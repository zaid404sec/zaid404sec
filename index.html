<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1528">
  <meta name="description" content="A simple billing, inventory and business management app for car washing centres.">
  <title>WashLedger — Car Wash Business</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">W</div>
        <div><div class="brand-name">WashLedger</div><div class="brand-sub">CAR WASH MANAGEMENT</div></div>
      </div>
      <div class="business-switch"><span class="online-dot"></span><span id="sideBusinessName">My Car Wash Centre</span></div>
      <nav class="nav-list" aria-label="Main navigation">
        <div class="nav-caption">WORKSPACE</div>
        <button class="nav-item active" data-page="dashboard"><span class="nav-icon">▦</span>Overview</button>
        <button class="nav-item nav-primary" data-page="new-bill"><span class="nav-icon">＋</span>New bill</button>
        <button class="nav-item" data-page="invoices"><span class="nav-icon">▤</span>Invoices</button>
        <button class="nav-item" data-page="customers"><span class="nav-icon">♙</span>Customers & vehicles</button>
        <div class="nav-caption">BUSINESS</div>
        <button class="nav-item" data-page="services"><span class="nav-icon">✧</span>Services & products</button>
        <button class="nav-item" data-page="inventory"><span class="nav-icon">▣</span>Inventory</button>
        <button class="nav-item" data-page="purchases"><span class="nav-icon">⇩</span>Purchases</button>
        <button class="nav-item" data-page="expenses"><span class="nav-icon">↗</span>Expenses</button>
        <button class="nav-item" data-page="staff"><span class="nav-icon">♟</span>Staff & payroll</button>
        <button class="nav-item" data-page="reports"><span class="nav-icon">▥</span>Reports</button>
        <div class="nav-caption">CONTROL</div>
        <button class="nav-item" data-page="settings"><span class="nav-icon">⚙</span>Business settings</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="backup-note"><div class="backup-icon">✓</div><div><strong>Your records stay on this device</strong><small>Export a backup regularly.</small></div></div>
        <div class="version-label">WASHLEDGER · VERSION 1.0</div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" aria-label="Open menu">☰</button>
        <div class="breadcrumb"><span>Workspace</span><b>/</b><strong id="pageCrumb">Overview</strong></div>
        <div class="topbar-right">
          <span class="local-chip"><span></span> Local data</span>
          <button class="avatar" id="settingsShortcut" title="Business settings">W</button>
        </div>
      </header>
      <section class="page-wrap">
        <div id="pageContent"></div>
        <footer class="app-footer">WashLedger · Designed for everyday car wash operations <span>Always keep a current backup of your records.</span></footer>
      </section>
    </main>
  </div>
  <div id="toastHost" class="toast-host" aria-live="polite"></div>
  <input id="restoreFile" type="file" accept="application/json,.json" hidden>
  <script src="app-core.js"></script>
  <script src="app-views-a.js"></script>
  <script src="app-views-b.js"></script>
  <script src="app-views-c.js"></script>
  <script src="app-actions-a.js"></script>
  <script src="app-actions-b.js"></script>
  <script src="app-init.js"></script>
  <script>if ('serviceWorker' in navigator && location.protocol.startsWith('http')) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {})); }</script>
</body>
</html>
