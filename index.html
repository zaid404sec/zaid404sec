<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1528">
<meta name="description" content="Billing, inventory and business records for a car washing centre.">
<title>WashLedger — Car Wash Business</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body>
<div id="appLoading" style="font:14px system-ui;padding:24px;color:#43536f">Loading WashLedger…</div>
<script>
(async function(){
 try {
  if (!('DecompressionStream' in window)) throw new Error('Please update Chrome to load this app.');
  const response=await fetch('./app.bundle.js.gz.b64');
  if(!response.ok) throw new Error('App bundle could not be downloaded.');
  const encoded=(await response.text()).trim();
  const binary=atob(encoded);
  const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
  const source=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  const url=URL.createObjectURL(new Blob([source],{type:'text/javascript'}));
  const script=document.createElement('script');script.src=url;
  script.onload=()=>{URL.revokeObjectURL(url);const e=document.getElementById('appLoading');if(e)e.remove();};
  script.onerror=()=>{document.getElementById('appLoading').textContent='The app could not start. Reload and try again.';};
  document.body.appendChild(script);
 } catch(e){document.getElementById('appLoading').textContent='Unable to load WashLedger: '+e.message;}
})();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
 window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
</body>
</html>
