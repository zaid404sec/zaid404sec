name: Build WashDesk Installers

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'car-wash-erp/**'
      - '.github/workflows/build-installers.yml'
  push:
    branches: [main]
    paths:
      - 'car-wash-erp/**'
      - '.github/workflows/build-installers.yml'

permissions:
  contents: read

jobs:
  windows:
    name: Windows EXE installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: car-wash-erp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies (retry transient download failures)
        shell: pwsh
        run: |
          $attempt = 0
          do {
            $attempt++
            npm install
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -ge 3) { exit $LASTEXITCODE }
            Start-Sleep -Seconds (15 * $attempt)
          } while ($true)
      - name: Build Windows installer (retry transient download failures)
        id: windows-installer
        continue-on-error: true
        shell: pwsh
        run: |
          $attempt = 0
          do {
            $attempt++
            npm run dist:win
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -ge 3) { exit $LASTEXITCODE }
            Start-Sleep -Seconds (15 * $attempt)
          } while ($true)
      - name: Build portable Windows executable if NSIS installer is unavailable
        if: steps.windows-installer.outcome == 'failure'
        shell: pwsh
        run: |
          npx electron-builder --win portable --x64 --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: WashDesk-Windows-Installer
          path: |
            car-wash-erp/release/*.exe
            car-wash-erp/release/*.zip
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: car-wash-erp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Capacitor without desktop-only development dependencies
        run: npm install --omit=dev --no-save esbuild@^0.25.0 @capacitor/core@^8 @capacitor/cli@^8 @capacitor/android@^8
      - name: Prepare local PDF, reports and cloud assets
        run: npm run prepare:assets
      - name: Validate app syntax and business calculations
        run: npm run validate
      - name: Prepare web assets
        run: |
          mkdir www
          cp index.html manifest.webmanifest icon.svg prime-auto-care-logo.jpg prime-auto-care-car-photo.jpg pdfmake.bundle.min.js pdfmake-vfs.js invoice-native.bundle.js exceljs.bundle.min.js report-export.bundle.js cloud-sync.bundle.js cloud-sync-setup.sql www/
      - name: Add Android platform
        run: npx cap add android
      - name: Sync web app
        run: npx cap sync android
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Use the official smaller Gradle binary distribution
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('android/gradle/wrapper/gradle-wrapper.properties')
          original = path.read_text()
          normalized = original.replace(r'https\:', 'https:').replace(r'http\:', 'http:')
          updated = re.sub(
              r'https://services\.gradle\.org/distributions/(gradle-[0-9.]+)-all\.zip',
              r'https://downloads.gradle.org/distributions/\1-bin.zip',
              normalized
          )
          if updated == normalized:
              raise SystemExit('Could not update Gradle wrapper distribution URL: ' + normalized)
          path.write_text(updated.replace('https:', r'https\:'))
          print(path.read_text())
          PY
      - name: Cache Gradle distributions and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('car-wash-erp/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Build debug APK (retry transient distribution timeouts)
        working-directory: car-wash-erp/android
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if ./gradlew assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done
      - uses: actions/upload-artifact@v4
        with:
          name: WashDesk-Android-APK
          path: car-wash-erp/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
