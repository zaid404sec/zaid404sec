name: Build WashDesk Installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'car-wash-erp/**'
      - '.github/workflows/build-installers.yml'

permissions:
  contents: read

jobs:
  windows:
    name: Windows EXE installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: car-wash-erp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: WashDesk-Windows-Installer
          path: car-wash-erp/release/*.exe
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: car-wash-erp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Capacitor
        run: npm install @capacitor/core@^8 @capacitor/cli@^8 @capacitor/android@^8
      - name: Prepare local PDF, reports and cloud assets
        run: npm run prepare:assets
      - name: Validate app syntax and business calculations
        run: npm run validate
      - name: Prepare web assets
        run: |
          mkdir www
          cp index.html manifest.webmanifest icon.svg prime-auto-care-logo.jpg html2pdf.bundle.min.js invoice-native.bundle.js exceljs.bundle.min.js report-export.bundle.js cloud-sync.bundle.js cloud-sync-setup.sql www/
      - name: Add Android platform
        run: npx cap add android
      - name: Sync web app
        run: npx cap sync android
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build debug APK
        working-directory: car-wash-erp/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WashDesk-Android-APK
          path: car-wash-erp/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
