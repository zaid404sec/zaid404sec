name: Build WashDesk Installers

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'car-wash-erp/**'
      - '.github/workflows/build-installers.yml'
  push:
    branches: [main]
    paths:
      - 'car-wash-erp/**'
      - '.github/workflows/build-installers.yml'

permissions:
  contents: read

jobs:
  windows:
    name: Windows EXE installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: car-wash-erp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate Prime Auto Care Windows and PWA icons
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/generate-brand-assets.py
      - name: Install dependencies (retry transient download failures)
        shell: pwsh
        run: |
          $attempt = 0
          do {
            $attempt++
            npm install
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -ge 3) { exit $LASTEXITCODE }
            Start-Sleep -Seconds (15 * $attempt)
          } while ($true)
      - name: Build Windows installer (retry transient download failures)
        id: windows-installer
        continue-on-error: true
        shell: pwsh
        run: |
          $attempt = 0
          do {
            $attempt++
            npm run dist:win
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -ge 3) { exit $LASTEXITCODE }
            Start-Sleep -Seconds (15 * $attempt)
          } while ($true)
      - name: Build portable Windows executable if NSIS installer is unavailable
        if: steps.windows-installer.outcome == 'failure'
        shell: pwsh
        run: |
          npx electron-builder --win portable --x64 --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Split the Windows EXE into two download-safe parts
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter '*.exe' | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer EXE was not produced.' }
          $bytes = [System.IO.File]::ReadAllBytes($installer.FullName)
          $chunkSize = 48MB
          $part1Dir = Join-Path release 'installer-part-1'
          $part2Dir = Join-Path release 'installer-part-2'
          New-Item -ItemType Directory -Force -Path $part1Dir, $part2Dir | Out-Null
          $firstLength = [Math]::Min($chunkSize, $bytes.Length)
          $first = New-Object byte[] $firstLength
          [Array]::Copy($bytes, 0, $first, 0, $firstLength)
          [System.IO.File]::WriteAllBytes((Join-Path $part1Dir 'part.bin'), $first)
          $secondLength = $bytes.Length - $firstLength
          $second = New-Object byte[] $secondLength
          if ($secondLength -gt 0) { [Array]::Copy($bytes, $firstLength, $second, 0, $secondLength) }
          [System.IO.File]::WriteAllBytes((Join-Path $part2Dir 'part.bin'), $second)
          $metadata = [string]$installer.Name + [Environment]::NewLine + [string]$bytes.Length + [Environment]::NewLine + [string]$firstLength
          [System.IO.File]::WriteAllText((Join-Path release 'installer-parts.txt'), $metadata)
          Write-Host ('Split ' + $installer.Name + ' (' + $bytes.Length + ' bytes) into ' + $firstLength + ' and ' + $secondLength + ' byte parts.')
      - uses: actions/upload-artifact@v4
        with:
          name: Prime-Auto-Care-Windows-EXE-Part-1
          path: car-wash-erp/release/installer-part-1/part.bin
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Prime-Auto-Care-Windows-EXE-Part-2
          path: car-wash-erp/release/installer-part-2/part.bin
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: WashDesk-Windows-Installer
          path: |
            car-wash-erp/release/*.exe
            car-wash-erp/release/*.zip
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: car-wash-erp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate Prime Auto Care PWA and Windows icon assets
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/generate-brand-assets.py
      - name: Install Capacitor without desktop-only development dependencies
        run: npm install --omit=dev --no-save esbuild@^0.25.0 @capacitor/core@^8 @capacitor/cli@^8 @capacitor/android@^8
      - name: Prepare local PDF, reports and cloud assets
        run: npm run prepare:assets
      - name: Validate app syntax and business calculations
        run: npm run validate
      - name: Prepare web assets
        run: |
          mkdir www
          cp index.html manifest.webmanifest icon.svg prime-auto-care-icon-192.png prime-auto-care-icon-512.png prime-auto-care-logo.jpg prime-auto-care-car-photo.jpg pdfmake.bundle.min.js pdfmake-vfs.js invoice-native.bundle.js exceljs.bundle.min.js report-export.bundle.js cloud-sync.bundle.js notifications-native.bundle.js communications.bundle.js native-links.bundle.js google-reviews.bundle.js cloud-sync-setup.sql www/
      - name: Add Android platform
        run: npx cap add android
      - name: Set Android app version from package.json
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          version = json.loads(Path('package.json').read_text())['version']
          major, minor, patch = (int(x) for x in version.split('.'))
          version_code = major * 10000 + minor * 100 + patch
          gradle = Path('android/app/build.gradle')
          source = gradle.read_text()
          source, code_count = re.subn(r"(?m)^\s*versionCode\s+\d+", f'        versionCode {version_code}', source, count=1)
          source, name_count = re.subn(r"(?m)^\s*versionName\s+['\"][^'\"]+['\"]", f'        versionName "{version}"', source, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit('Could not set Android versionCode/versionName in app/build.gradle')
          gradle.write_text(source)
          print(f'Android versionName={version}, versionCode={version_code}')
          PY
      - name: Sync web app
        run: npx cap sync android
      - name: Apply Prime Auto Care Android launcher and splash branding
        run: python scripts/generate-brand-assets.py --android
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Use the official smaller Gradle binary distribution
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('android/gradle/wrapper/gradle-wrapper.properties')
          original = path.read_text()
          normalized = original.replace(r'https\:', 'https:').replace(r'http\:', 'http:')
          updated = re.sub(
              r'https://services\.gradle\.org/distributions/(gradle-[0-9.]+)-all\.zip',
              r'https://downloads.gradle.org/distributions/\1-bin.zip',
              normalized
          )
          if updated == normalized:
              raise SystemExit('Could not update Gradle wrapper distribution URL: ' + normalized)
          path.write_text(updated.replace('https:', r'https\:'))
          print(path.read_text())
          PY
      - name: Cache Gradle distributions and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('car-wash-erp/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Build debug APK (retry transient distribution timeouts)
        working-directory: car-wash-erp/android
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if ./gradlew assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done
      - uses: actions/upload-artifact@v4
        with:
          name: WashDesk-Android-APK
          path: car-wash-erp/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


  backend-check:
    name: Google Reviews Edge Function type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check the Google Reviews API and OAuth callback
        run: |
          deno check car-wash-erp/supabase/functions/google-review-api/index.ts
          deno check car-wash-erp/supabase/functions/google-review-oauth-callback/index.ts

  source:
    name: WashDesk source, handover and full release package
    needs: [windows, android, backend-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package application source (exclude credentials and generated builds)
        run: |
          cd car-wash-erp
          zip -r ../WashDesk-Prime-Auto-Care-2.9.4-Project-Source.zip . \
            -x 'node_modules/*' 'android/.gradle/*' 'android/app/build/*' 'release/*' 'www/*' '.env*' '**/.env*'
          cd ..
          sha256sum WashDesk-Prime-Auto-Care-2.9.4-Project-Source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WashDesk-Project-Source
          path: WashDesk-Prime-Auto-Care-2.9.4-Project-Source.zip
          if-no-files-found: error
      - name: Package the complete repository and AI handover (exclude secrets and generated files)
        run: |
          zip -r WashDesk-Prime-Auto-Care-2.9.4-Complete-Handover.zip . \
            -x '.git/*' '**/.git/*' '**/node_modules/*' '**/.env*' '**/release/*' '**/www/*' '**/android/.gradle/*' '**/android/app/build/*' '**/dist/*' '**/build/*'
          sha256sum WashDesk-Prime-Auto-Care-2.9.4-Complete-Handover.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WashDesk-Complete-Project-Handover
          path: WashDesk-Prime-Auto-Care-2.9.4-Complete-Handover.zip
          if-no-files-found: error
      - name: Download verified Android APK from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: WashDesk-Android-APK
          path: build-artifacts/android
      - name: Download verified Windows installer from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: WashDesk-Windows-Installer
          path: build-artifacts/windows
      - name: Assemble one complete release package with checksums
        run: |
          apk="$(find build-artifacts/android -type f -name '*.apk' -print -quit)"
          exe="$(find build-artifacts/windows -type f -name '*.exe' -print -quit)"
          test -n "$apk" || { echo 'Android APK artifact was not found.'; exit 1; }
          test -n "$exe" || { echo 'Windows EXE artifact was not found.'; exit 1; }
          mkdir -p release-package/Android release-package/Windows release-package/Source
          cp "$apk" release-package/Android/Prime-Auto-Care-2.9.4.apk
          cp "$exe" release-package/Windows/Prime-Auto-Care-Setup-2.9.4-x64.exe
          cp WashDesk-Prime-Auto-Care-2.9.4-Project-Source.zip release-package/Source/
          cp WashDesk-Prime-Auto-Care-2.9.4-Complete-Handover.zip release-package/Source/
          cat > release-package/START-HERE.txt <<EOF
          PRIME AUTO CARE / WASHDESK — VERSION 2.9.4
          Android: Android/Prime-Auto-Care-2.9.4.apk
          Windows: Windows/Prime-Auto-Care-Setup-2.9.4-x64.exe
          App source: Source/WashDesk-Prime-Auto-Care-2.9.4-Project-Source.zip
          Complete repository + AI handover: Source/WashDesk-Prime-Auto-Care-2.9.4-Complete-Handover.zip
          Android package ID: com.washdesk.carwash.v24
          GitHub commit: $GITHUB_SHA
          Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Keep v23 installed until v24 is paired with the same cloud workspace or a verified backup is restored.
          This package excludes passwords, API tokens, OAuth secrets, private SSH keys and workspace pairing codes.
          EOF
          (cd release-package && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          zip -r WashDesk-Prime-Auto-Care-2.9.4-Full-Release-Package.zip release-package
          sha256sum WashDesk-Prime-Auto-Care-2.9.4-Full-Release-Package.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WashDesk-Full-Release-Package
          path: WashDesk-Prime-Auto-Care-2.9.4-Full-Release-Package.zip
          if-no-files-found: error
