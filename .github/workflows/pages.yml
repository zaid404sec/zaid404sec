name: Deploy WashDesk to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'car-wash-erp/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        working-directory: car-wash-erp
        run: npm install
      - name: Build local PDF, report and cloud assets
        working-directory: car-wash-erp
        run: npm run prepare:assets
      - name: Validate app syntax and business calculations
        working-directory: car-wash-erp
        run: npm run validate
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./car-wash-erp
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
