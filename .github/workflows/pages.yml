name: Validate and package WashDesk public site

on:
  push:
    branches: [main]
    paths:
      - 'car-wash-erp/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'car-wash-erp/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: washdesk-public-site
  cancel-in-progress: true

jobs:
  build:
    name: Validate website and booking portal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python for generated Prime Auto Care brand assets
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate the app's PWA and Windows icon assets
        working-directory: car-wash-erp
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/generate-brand-assets.py
      - name: Install app dependencies
        working-directory: car-wash-erp
        run: npm install --omit=dev
      - name: Build local PDF, report and cloud assets
        working-directory: car-wash-erp
        run: npm run prepare:assets
      - name: Validate app syntax and business calculations
        working-directory: car-wash-erp
        run: npm run validate
      - name: Package website and booking portal preview
        uses: actions/upload-artifact@v4
        with:
          name: prime-auto-care-public-site-preview
          path: |
            car-wash-erp/website/
            car-wash-erp/prime-auto-care-logo.jpg
            car-wash-erp/prime-auto-care-car-photo.jpg
          if-no-files-found: error
