appId: com.washdesk.carwash
productName: Prime Auto Care
directories:
  output: release
files:
  - index.html
  - manifest.webmanifest
  - icon.svg
  - pdfmake.bundle.min.js
  - pdfmake-vfs.js
  - prime-auto-care-logo.jpg
  - prime-auto-care-car-photo.jpg
  - html2pdf.bundle.min.js
  - invoice-native.bundle.js
  - exceljs.bundle.min.js
  - report-export.bundle.js
  - cloud-sync.bundle.js
  - cloud-sync-setup.sql
  - electron/**
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Prime-Auto-Care-Setup-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
