appId: com.washdesk.carwash
productName: Prime Auto Care
directories:
  output: release
files:
  - index.html
  - manifest.webmanifest
  - icon.svg
  - prime-auto-care-icon-192.png
  - prime-auto-care-icon-512.png
  - prime-auto-care-icon.ico
  - pdfmake.bundle.min.js
  - pdfmake-vfs.js
  - prime-auto-care-logo.jpg
  - prime-auto-care-car-photo.jpg
  - html2pdf.bundle.min.js
  - invoice-native.bundle.js
  - exceljs.bundle.min.js
  - report-export.bundle.js
  - cloud-sync.bundle.js
  - notifications-native.bundle.js
  - communications.bundle.js
  - cloud-sync-setup.sql
  - electron/**
  - package.json
win:
  icon: prime-auto-care-icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Prime-Auto-Care-Setup-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  customNsisBinary:
    url: https://mirrors.huaweicloud.com/electron-builder-binaries/nsis-3.0.4.1/nsis-3.0.4.1.7z
    checksum: VKMiizYdmNdJOWpRGz4trl4lD++BvYP2irAXpMilheUP0pc93iKlWAoP843Vlraj8YG19CVn0j+dCo/hURz9+Q==
    version: 3.0.4.1
  customNsisResources:
    url: https://mirrors.huaweicloud.com/electron-builder-binaries/nsis-resources-3.4.1/nsis-resources-3.4.1.7z
    checksum: Dqd6g+2buwwvoG1Vyf6BHR1b+25QMmPcwZx40atOT57gH27rkjOei1L0JTldxZu4NFoEmW4kJgZ3DlSWVON3+Q==
    version: 3.4.1
