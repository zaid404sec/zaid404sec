appId: com.washdesk.carwash
productName: WashDesk
directories:
  output: release
files:
  - index.html
  - manifest.webmanifest
  - icon.svg
  - html2pdf.bundle.min.js
  - invoice-native.bundle.js
  - report-export.bundle.js
  - cloud-sync.bundle.js
  - cloud-sync-setup.sql
  - electron/**
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: WashDesk-Setup-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
