<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta name="theme-color" content="#101827" />

  <link rel="manifest" href="./manifest.webmanifest" />

  <title>WashDesk — Car Wash Business Manager</title>
  <style>
    :root{--bg:#f4f6fb;--panel:#fff;--ink:#172033;--muted:#69758b;--line:#e5eaf2;--nav:#101827;--blue:#2563eb;--blue2:#eaf1ff;--teal:#0f9d83;--red:#dc4545;--amber:#d58a15;--shadow:0 10px 30px rgba(20,35,65,.07);--radius:18px}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}
    .shell{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}.sidebar{background:var(--nav);color:#e7edf8;padding:24px 16px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;align-items:center;gap:12px;padding:3px 8px 14px}.brand-mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#38bdf8,#2563eb);display:grid;place-items:center;font-weight:900;color:#fff;font-size:18px}.brand strong{display:block;font-size:17px;letter-spacing:.2px}.brand small{display:block;color:#9ba9bf;margin-top:2px;font-size:11px}.nav-label{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:#77849a;padding:0 10px;margin-bottom:4px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#aebbd0;text-align:left;padding:11px 12px;border-radius:11px;display:flex;gap:12px;align-items:center;font-weight:600;font-size:13px}.nav button:hover,.nav button.active{background:#202d42;color:#fff}.nav .ico{width:22px;text-align:center;font-size:16px}.side-foot{margin-top:auto;color:#7f8da4;font-size:11px;line-height:1.6;padding:12px}
    .main{min-width:0}.topbar{height:76px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:5}.top-left{display:flex;align-items:center;gap:14px}.topbar h1{font-size:20px;margin:0}.topbar p{font-size:12px;color:var(--muted);margin:4px 0 0}.top-actions{display:flex;align-items:center;gap:10px}.avatar{width:36px;height:36px;border-radius:50%;background:#e9efff;color:#2456b8;display:grid;place-items:center;font-weight:800}.hamb{display:none;border:0;background:#eef2f8;border-radius:10px;padding:9px}.content{padding:26px 30px 50px;max-width:1500px;margin:0 auto}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}.page-head h2{margin:0;font-size:23px;letter-spacing:-.5px}.page-head p{margin:6px 0 0;color:var(--muted);font-size:13px}.actions{display:flex;flex-wrap:wrap;gap:9px}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;padding:10px 14px;font-size:12px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn:hover{border-color:#b8c7df;background:#f9fbff}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:#1e53cf}.btn.danger{color:var(--red);border-color:#f0caca}.btn.ghost{background:transparent}.btn.small{padding:7px 10px;font-size:11px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.stat{padding:17px 18px}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;font-weight:650}.stat-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:#f0f4fc;font-size:16px}.stat-value{font-size:25px;font-weight:850;letter-spacing:-.7px;margin-top:14px}.stat-note{font-size:11px;color:var(--muted);margin-top:4px}.two{grid-template-columns:minmax(0,1.4fr) minmax(280px,.9fr)}.card{padding:19px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.card-head h3{font-size:14px;margin:0}.card-head span{font-size:11px;color:var(--muted)}.empty{border:1px dashed #cfd8e6;border-radius:14px;padding:30px 16px;text-align:center;color:var(--muted);font-size:12px}.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:5px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:12px}th{text-align:left;color:#78849a;font-size:10px;letter-spacing:.6px;text-transform:uppercase;padding:11px 10px;border-bottom:1px solid var(--line)}td{padding:12px 10px;border-bottom:1px solid #edf0f5}tr:last-child td{border-bottom:0}.right{text-align:right}.muted{color:var(--muted)}.strong{font-weight:800}.badge{display:inline-flex;border-radius:30px;padding:5px 8px;font-size:10px;font-weight:800;background:#eff5ff;color:#2457bf}.badge.green{background:#e7f8f2;color:#128267}.badge.red{background:#fff0f0;color:#c13d3d}.badge.amber{background:#fff5df;color:#9d6509}.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:6px;min-width:0}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:750;color:#4d5a70}.field input,.field select,.field textarea{width:100%;border:1px solid #dce3ee;background:#fff;border-radius:10px;padding:10px 11px;outline:none;color:var(--ink);font-size:12px;min-width:0}.field input:focus,.field select:focus,.field textarea:focus{border-color:#85a9f7;box-shadow:0 0 0 3px #eaf1ff}.field textarea{min-height:80px;resize:vertical}.help{font-size:10px;color:var(--muted);line-height:1.5}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px}.search{flex:1;min-width:180px}.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-size:12px}.form-card{max-width:900px}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.pill-row{display:flex;gap:8px;flex-wrap:wrap}.pill{border:1px solid var(--line);padding:7px 10px;border-radius:30px;background:#fff;font-size:11px;color:var(--muted)}.pill.active{background:var(--blue2);color:#2256be;border-color:#c9d9ff}.invoice-layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:16px}.line-add{display:grid;grid-template-columns:minmax(0,1fr) 90px 105px auto;gap:8px;align-items:end}.totals{display:grid;gap:9px;border-top:1px solid var(--line);padding-top:13px;margin-top:14px}.total-line{display:flex;justify-content:space-between;font-size:12px}.total-line.final{font-size:18px;font-weight:900;padding-top:9px;border-top:1px dashed var(--line)}.toast{position:fixed;right:20px;bottom:20px;background:#172033;color:white;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);font-size:12px;z-index:20;max-width:min(380px,calc(100vw - 40px));opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}.modal-backdrop{position:fixed;inset:0;background:rgba(10,20,38,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:30}.modal-backdrop.show{display:flex}.modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.2)}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.modal-head h3{margin:0;font-size:17px}.close{border:0;background:#f0f3f8;width:32px;height:32px;border-radius:50%;font-size:18px}.invoice-preview{border:1px solid var(--line);padding:22px;border-radius:12px;background:#fff}.invoice-preview h2{margin:0}.invoice-preview .inv-top{display:flex;justify-content:space-between;gap:20px}.invoice-preview .inv-meta{text-align:right;font-size:11px;line-height:1.7}.invoice-preview .bill-to{margin:20px 0;font-size:12px;line-height:1.6}.invoice-preview table{font-size:11px}.invoice-preview th{font-size:9px}.invoice-preview .inv-foot{font-size:10px;color:var(--muted);margin-top:18px}.chart{height:180px;display:flex;align-items:end;gap:8px;border-bottom:1px solid var(--line);padding:18px 4px 0}.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;gap:7px;min-width:0}.bar{width:min(30px,75%);background:linear-gradient(180deg,#5fa1ff,#2865e3);border-radius:7px 7px 2px 2px;min-height:3px}.bar-label{font-size:9px;color:var(--muted)}.stock-alert{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #edf0f5;font-size:12px}.stock-alert:last-child{border:0}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.notice{padding:12px 14px;border-radius:12px;background:#fff8e8;border:1px solid #f4dfac;color:#77530e;font-size:11px;line-height:1.55}.success-note{padding:12px 14px;border-radius:12px;background:#eaf8f3;border:1px solid #c6eadc;color:#126d54;font-size:11px;line-height:1.55}.hide{display:none!important}
    @media(max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.invoice-layout{grid-template-columns:1fr}}
    @media(max-width:760px){.shell{grid-template-columns:1fr}.sidebar{position:fixed;z-index:15;inset:0 auto 0 0;width:270px;transform:translateX(-105%);transition:.22s;box-shadow:0 0 0 100vmax transparent}.sidebar.open{transform:translateX(0);box-shadow:0 0 0 100vmax rgba(10,20,38,.42)}.hamb{display:block}.topbar{height:66px;padding:0 16px}.topbar h1{font-size:17px}.content{padding:20px 14px 38px}.page-head{align-items:flex-start;flex-direction:column}.page-head h2{font-size:21px}.stats{gap:10px}.stat{padding:14px}.stat-value{font-size:21px}.stat-icon{width:30px;height:30px}.field-grid,.settings-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.line-add{grid-template-columns:1fr 80px}.line-add .field:nth-child(3){grid-column:1}.line-add button{grid-column:2;grid-row:2}.actions .btn{flex:1}.card{padding:15px}.modal{padding:15px}.invoice-preview{padding:13px}.invoice-preview .inv-top{flex-direction:column}.invoice-preview .inv-meta{text-align:left}.top-actions .date-hide{display:none}}
    @media print{body{background:#fff}.shell,.modal-backdrop{display:none!important}#print-root{display:block!important}.print-page{display:block!important}.print-page .invoice-preview{border:0;border-radius:0;padding:0}.print-page table{white-space:normal}}
  </style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-mark">W</div><div><strong>WashDesk</strong><small>CAR WASH BUSINESS MANAGER</small></div></div>
    <div><div class="nav-label">Workspace</div><nav class="nav" id="nav">
      <button data-page="dashboard" class="active"><span class="ico">▦</span>Dashboard</button>
      <button data-page="billing"><span class="ico">▤</span>New bill</button>
      <button data-page="invoices"><span class="ico">▧</span>Invoices</button>
      <button data-page="customers"><span class="ico">♙</span>Customers & vehicles</button>
      <button data-page="services"><span class="ico">✦</span>Services & packages</button>
      <button data-page="inventory"><span class="ico">▣</span>Inventory</button>
      <button data-page="purchases"><span class="ico">⇩</span>Purchases</button>
      <button data-page="expenses"><span class="ico">₹</span>Expenses</button>
      <button data-page="staff"><span class="ico">♧</span>Staff</button>
      <button data-page="reports"><span class="ico">▥</span>Reports</button>
      <button data-page="settings"><span class="ico">⚙</span>Business settings</button>
    </nav></div>
    <div class="side-foot">Offline-first starter edition<br/>Your records stay in this browser.</div>
  </aside>
  <main class="main">
    <header class="topbar"><div class="top-left"><button class="hamb" id="hamb" aria-label="Open navigation">☰</button><div><h1 id="top-title">Dashboard</h1><p id="top-subtitle">Your business at a glance</p></div></div><div class="top-actions"><span class="muted date-hide" id="today-label" style="font-size:11px"></span><div class="avatar" id="avatar">W</div></div></header>
    <section class="content" id="app"></section>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="modal-backdrop" id="modal-backdrop"><div class="modal" id="modal"><div class="modal-head"><h3 id="modal-title">Details</h3><button class="close" id="modal-close" aria-label="Close">×</button></div><div id="modal-body"></div></div></div>
<div id="print-root" class="hide"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" referrerpolicy="no-referrer"></script>
<script>
(() => {
  'use strict';
  const STORE='washdesk-v1';
  const INR=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(Number(n)||0);
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
  const monthKey=d=>(d||today()).slice(0,7);
  const id=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
  const blank=()=>({
    business:{name:'',phone:'',email:'',address:'',city:'Surat',state:'Gujarat',stateCode:'24',gstin:'',registered:false,invoicePrefix:'CW',upi:'',terms:'Thank you for choosing us. Drive safe!'},
    settings:{currency:'INR',financialYearStart:4,stockAlerts:true},
    services:[],customers:[],vehicles:[],invoices:[],products:[],purchases:[],expenses:[],staff:[],payments:[],
  });
  let db=load(); let page='dashboard'; let billLines=[]; let toastTimer=null;
  function load(){try{const x=JSON.parse(localStorage.getItem(STORE));return x&&x.business?Object.assign(blank(),x):blank()}catch(e){return blank()}}
  function save(){try{localStorage.setItem(STORE,JSON.stringify(db));return true}catch(e){notify('Storage is full. Export a backup and remove old records.');return false}}
  function notify(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2800)}
  function setPage(p){page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('sidebar').classList.remove('open');document.getElementById('top-title').textContent=({dashboard:'Dashboard',billing:'New bill',invoices:'Invoices',customers:'Customers & vehicles',services:'Services & packages',inventory:'Inventory',purchases:'Purchases',expenses:'Expenses',staff:'Staff',reports:'Reports',settings:'Business settings'})[p]||'WashDesk';document.getElementById('top-subtitle').textContent=({dashboard:'Your business at a glance',billing:'Create a customer bill in a few steps',invoices:'Search, review and share customer invoices',customers:'Keep customer and vehicle records together',services:'Set service rates for private, taxi and commercial vehicles',inventory:'Track chemicals, consumables and products',purchases:'Record supplier purchases and stock received',expenses:'Track day-to-day business spending',staff:'Manage team members and service assignments',reports:'Review sales, expenses and operating performance',settings:'Set your business details, tax and data backup'})[p]||'';render()}
  function fy(d=today()){const x=new Date(d+'T00:00:00');let y=x.getFullYear();if(x.getMonth()+1<4)y--;return `${String(y).slice(-2)}-${String(y+1).slice(-2)}`}
  function nextInvoiceNo(){const prefix=(db.business.invoicePrefix||'CW').replace(/[^A-Za-z0-9-]/g,'').slice(0,4).toUpperCase();const year=fy();const n=db.invoices.filter(x=>x.financialYear===year).length+1;return `${prefix}${year.replace('-','')}-${String(n).padStart(4,'0')}`.slice(0,16)}
  function sum(a,fn){return a.reduce((s,x)=>s+(Number(fn?fn(x):x)||0),0)}
  function paid(i){return sum(db.payments.filter(p=>p.invoiceId===i.id),p=>p.amount)}
  function invoiceDue(i){return Math.max(0,Number(i.grandTotal)-paid(i))}
  function customerName(cid){return db.customers.find(c=>c.id===cid)?.name||'Walk-in customer'}
  function productName(pid){return db.products.find(p=>p.id===pid)?.name||'Item'}
  function empty(title,desc,button){return `<div class="empty"><b>${esc(title)}</b>${esc(desc)}${button?`<div style="margin-top:14px"><button class="btn primary" data-action="${button.action}">${esc(button.label)}</button></div>`:''}</div>`}
  function pageHead(title,desc,actions=''){return `<div class="page-head"><div><h2>${title}</h2><p>${desc}</p></div><div class="actions">${actions}</div></div>`}
  function render(){const el=document.getElementById('app');const map={dashboard:dashboard,billing:billing,invoices:invoices,customers:customers,services:services,inventory:inventory,purchases:purchases,expenses:expenses,staff:staff,reports:reports,settings:settings};el.innerHTML=(map[page]||dashboard)();wirePage()}
  function stat(label,value,icon,note=''){return `<div class="stat"><div class="stat-top">${label}<span class="stat-icon">${icon}</span></div><div class="stat-value">${value}</div><div class="stat-note">${note}</div></div>`}
  function dashboard(){const t=today(),m=monthKey(),todayInv=db.invoices.filter(i=>i.date===t),monInv=db.invoices.filter(i=>monthKey(i.date)===m),sales=sum(monInv,i=>i.grandTotal),exp=sum(db.expenses.filter(e=>monthKey(e.date)===m),e=>e.amount),cogs=sum(monInv,i=>i.stockCost||0),due=sum(db.invoices,invoiceDue),todaySales=sum(todayInv,i=>i.grandTotal);const recent=[...db.invoices].sort((a,b)=>b.createdAt-a.createdAt).slice(0,6);const low=db.products.filter(p=>Number(p.qty)<=Number(p.minQty||0));const days=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;return {key,label:d.toLocaleDateString('en-IN',{weekday:'short'}),v:sum(db.invoices.filter(x=>x.date===key),x=>x.grandTotal)}});const max=Math.max(1,...days.map(x=>x.v));return `${pageHead('Business overview','A quick view of your car wash centre.',`<button class="btn" data-action="export">⬇ Backup</button><button class="btn primary" data-action="new-bill">＋ Create bill</button>`)}<div class="grid stats">${stat('Sales this month',INR(sales),'₹',`${monInv.length} invoices`) }${stat('Sales today',INR(todaySales),'↗',`${todayInv.length} invoices today`)}${stat('Expenses this month',INR(exp),'⇩','Recorded operating expenses')}${stat('Outstanding balance',INR(due),'◷','Unpaid customer invoices')}</div><div class="grid two"><div class="card"><div class="card-head"><h3>Sales trend</h3><span>Last 7 days</span></div>${db.invoices.length?`<div class="chart">${days.map(d=>`<div class="bar-col" title="${esc(d.key)} · ${INR(d.v)}"><div class="bar" style="height:${Math.max(3,d.v/max*100)}%"></div><span class="bar-label">${d.label}</span></div>`).join('')}</div>`:empty('No sales yet','Your sales chart will appear after the first bill.')}</div><div class="card"><div class="card-head"><h3>Business snapshot</h3><span>${new Date().toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</span></div><div class="stock-alert"><span>Estimated operating surplus*</span><b>${INR(sales-exp-cogs)}</b></div><div class="stock-alert"><span>Vehicle visits this month</span><b>${monInv.length}</b></div><div class="stock-alert"><span>Customer accounts</span><b>${db.customers.length}</b></div><div class="stock-alert"><span>Active stock items</span><b>${db.products.length}</b></div><p class="help">*Sales less recorded operating expenses and estimated stock cost. This is a management estimate, not a statutory Profit & Loss statement.</p></div></div><div class="grid two" style="margin-top:16px"><div class="card"><div class="card-head"><h3>Recent invoices</h3><button class="btn small" data-nav="invoices">View all</button></div>${recent.length?`<div class="table-wrap"><table><thead><tr><th>Invoice</th><th>Customer</th><th>Date</th><th class="right">Amount</th><th>Status</th></tr></thead><tbody>${recent.map(i=>`<tr><td><button class="btn small" data-invoice="${i.id}">${esc(i.number)}</button></td><td>${esc(customerName(i.customerId))}</td><td>${esc(i.date)}</td><td class="right strong">${INR(i.grandTotal)}</td><td>${statusBadge(invoiceDue(i),i.grandTotal)}</td></tr>`).join('')}</tbody></table></div>`:empty('No invoices created','Create your first bill to start tracking business activity.',{action:'new-bill',label:'Create first bill'})}</div><div class="card"><div class="card-head"><h3>Low-stock alerts</h3><button class="btn small" data-nav="inventory">Manage stock</button></div>${low.length?low.slice(0,6).map(p=>`<div class="stock-alert"><div><b>${esc(p.name)}</b><div class="help">${esc(p.unit||'unit')} · Minimum ${p.minQty||0}</div></div><span class="badge red">${p.qty} left</span></div>`).join(''):empty('Stock looks good','Items below their minimum quantity will be listed here.')}</div></div>`}
  function statusBadge(due,total){if(due<=.009)return '<span class="badge green">Paid</span>';if(due>=Number(total)-.009)return '<span class="badge red">Unpaid</span>';return '<span class="badge amber">Partial</span>'}
  function billing(){const customerOptions=db.customers.map(c=>`<option value="${c.id}">${esc(c.name)} · ${esc(c.phone||'No phone')}</option>`).join('');const serviceOptions=db.services.map(s=>`<option value="${s.id}">${esc(s.name)} · ${INR(s.price)}</option>`).join('');const vehicleOptions=db.vehicles.map(v=>`<option value="${v.id}">${esc(v.number)} · ${esc(v.type)}</option>`).join('');return `${pageHead('Create a new bill','Select the customer, vehicle and services. Save the bill, then share it.','<button class="btn" data-nav="services">Manage services</button>')}<div class="invoice-layout"><div class="card"><div class="card-head"><h3>1. Customer & vehicle</h3><button class="btn small" data-action="quick-customer">＋ New customer</button></div><div class="field-grid"><div class="field"><label>Customer</label><select id="bill-customer"><option value="">Walk-in customer</option>${customerOptions}</select></div><div class="field"><label>Vehicle</label><select id="bill-vehicle"><option value="">Select vehicle (optional)</option>${vehicleOptions}</select></div><div class="field"><label>Vehicle number (if new)</label><input id="bill-number" placeholder="e.g. GJ05AB1234" /></div><div class="field"><label>Vehicle class</label><select id="bill-type"><option>Private Car</option><option>Taxi</option><option>Commercial Vehicle</option><option>SUV</option><option>Two Wheeler</option><option>Other</option></select></div><div class="field"><label>Odometer (optional)</label><input id="bill-odo" type="number" min="0" placeholder="Kilometres" /></div><div class="field"><label>Assigned staff</label><select id="bill-staff"><option value="">Not assigned</option>${db.staff.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div></div><div style="height:20px"></div><div class="card-head"><h3>2. Add services or products</h3><span>${db.services.length} services configured</span></div><div class="line-add"><div class="field"><label>Service / product</label><select id="line-item"><option value="">Choose an item</option><optgroup label="Services">${serviceOptions}</optgroup><optgroup label="Inventory products">${db.products.map(p=>`<option value="product:${p.id}">${esc(p.name)} · ${INR(p.sellPrice||0)}</option>`).join('')}</optgroup></select></div><div class="field"><label>Quantity</label><input id="line-qty" type="number" min=".01" step=".01" value="1" /></div><div class="field"><label>Discount (₹)</label><input id="line-discount" type="number" min="0" step=".01" value="0" /></div><button class="btn primary" id="add-line">Add</button></div><div style="height:14px"></div><div id="bill-lines">${billLines.length?billLineTable():empty('No items added','Add at least one service or product to build the bill.')}</div><div class="field-grid" style="margin-top:18px"><div class="field"><label>Overall discount (₹)</label><input id="bill-discount" type="number" min="0" step=".01" value="0" /></div><div class="field"><label>Payment received now (₹)</label><input id="bill-paid" type="number" min="0" step=".01" value="0" /></div><div class="field"><label>Payment mode</label><select id="bill-mode"><option>Cash</option><option>UPI</option><option>Card</option><option>Bank Transfer</option><option>Credit</option><option>Mixed</option></select></div><div class="field"><label>Service notes</label><input id="bill-notes" placeholder="Optional notes" /></div></div><div class="notice" style="margin-top:15px">Tax rates are taken from each service/product. Confirm your GST registration, SAC/HSN and applicable rates with your accountant before issuing tax invoices.</div><div class="form-actions"><button class="btn" data-action="clear-bill">Clear</button><button class="btn primary" data-action="save-bill" ${billLines.length?'':'disabled'}>Save invoice</button></div></div><div class="card"><div class="card-head"><h3>3. Bill summary</h3><span>Live calculation</span></div><div id="bill-summary">${billSummary()}</div><div class="success-note" style="margin-top:18px"><b>WhatsApp sharing</b><br/>After saving, use Share bill. On supported phones, the PDF can be shared from the Android share sheet. Otherwise, the app opens WhatsApp with the invoice details ready to send.</div></div></div>`}
  function billLineTable(){return `<div class="table-wrap"><table><thead><tr><th>Item</th><th>Qty</th><th class="right">Rate</th><th class="right">Amount</th><th></th></tr></thead><tbody>${billLines.map((l,i)=>`<tr><td>${esc(l.name)}<div class="help">${l.kind==='service'?'Service':'Product'} · GST ${l.taxRate||0}%</div></td><td>${l.qty}</td><td class="right">${INR(l.rate)}</td><td class="right strong">${INR(l.amount)}</td><td><button class="btn small danger" data-remove-line="${i}">×</button></td></tr>`).join('')}</tbody></table></div>`}
  function calcLines(lines=billLines,discount=0){const gross=sum(lines,l=>l.qty*l.rate);const lineDisc=sum(lines,l=>l.discount||0);const preTaxable=Math.max(0,gross-lineDisc);const overall=Math.min(preTaxable,Math.max(0,Number(discount)||0));const taxable=Math.max(0,preTaxable-overall);let tax=0;for(const l of lines){const lineBase=Math.max(0,l.qty*l.rate-(l.discount||0));const share=preTaxable>0?overall*lineBase/preTaxable:0;const lineTaxable=Math.max(0,lineBase-share);const rate=db.business.registered?Number(l.taxRate)||0:0;tax+=lineTaxable*rate/100}return {gross,lineDisc,overall,taxable,tax,grand:taxable+tax}}
  function billSummary(){const x=calcLines();const d=Number(document.getElementById('bill-discount')?.value||0);const y=calcLines(billLines,d);const due=Math.max(0,y.grand-Number(document.getElementById('bill-paid')?.value||0));return `<div class="totals"><div class="total-line"><span>Items subtotal</span><b>${INR(y.gross)}</b></div><div class="total-line"><span>Item discounts</span><b>− ${INR(y.lineDisc)}</b></div><div class="total-line"><span>Overall discount</span><b>− ${INR(y.overall)}</b></div><div class="total-line"><span>Taxable value (approx.)</span><b>${INR(y.taxable)}</b></div><div class="total-line"><span>GST total</span><b>${INR(y.tax)}</b></div><div class="total-line final"><span>Grand total</span><span>${INR(y.grand)}</span></div><div class="total-line"><span>Due after payment</span><b class="${due>0?'':'muted'}">${INR(due)}</b></div></div>`}
  function invoices(){const rows=[...db.invoices].sort((a,b)=>b.createdAt-a.createdAt);return `${pageHead('Invoices','Search, review, print and share every saved invoice.','<button class="btn primary" data-action="new-bill">＋ New bill</button>')}<div class="card"><div class="toolbar"><div class="search"><input id="invoice-search" placeholder="Search invoice, customer or vehicle number…" /></div><input class="btn" style="padding:8px" type="month" id="invoice-month" value="${monthKey()}" /><button class="btn" data-action="clear-invoice-filter">All dates</button></div><div id="invoice-table">${invoiceTable(rows)}</div></div>`}
  function invoiceTable(rows){return rows.length?`<div class="table-wrap"><table><thead><tr><th>Invoice no.</th><th>Date</th><th>Customer</th><th>Vehicle</th><th class="right">Total</th><th class="right">Due</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows.map(i=>`<tr><td class="strong">${esc(i.number)}</td><td>${esc(i.date)}</td><td>${esc(customerName(i.customerId))}</td><td>${esc(i.vehicleNumber||'—')}</td><td class="right">${INR(i.grandTotal)}</td><td class="right">${INR(invoiceDue(i))}</td><td>${statusBadge(invoiceDue(i),i.grandTotal)}</td><td><button class="btn small" data-invoice="${i.id}">View</button> <button class="btn small" data-share="${i.id}">Share</button></td></tr>`).join('')}</tbody></table></div>`:empty('No invoices found','Create a bill or adjust the search filter.')}
  function customers(){const rows=[...db.customers].sort((a,b)=>a.name.localeCompare(b.name));return `${pageHead('Customers & vehicles','Customer contacts, vehicle history and outstanding balances.','<button class="btn primary" data-action="add-customer">＋ Add customer</button>')}<div class="card"><div class="toolbar"><div class="search"><input id="customer-search" placeholder="Search name, phone or vehicle…" /></div></div><div id="customer-table">${customerTable(rows)}</div></div>`}
  function customerTable(rows){return rows.length?`<div class="table-wrap"><table><thead><tr><th>Customer</th><th>Phone</th><th>Vehicles</th><th>Visits</th><th class="right">Billed</th><th class="right">Due</th><th>Action</th></tr></thead><tbody>${rows.map(c=>{const inv=db.invoices.filter(i=>i.customerId===c.id);return `<tr><td><b>${esc(c.name)}</b><div class="help">${esc(c.city||'')}</div></td><td>${esc(c.phone||'—')}</td><td>${db.vehicles.filter(v=>v.customerId===c.id).map(v=>esc(v.number)).join(', ')||'—'}</td><td>${inv.length}</td><td class="right">${INR(sum(inv,i=>i.grandTotal))}</td><td class="right">${INR(sum(inv,invoiceDue))}</td><td><button class="btn small" data-customer="${c.id}">View</button></td></tr>`}).join('')}</tbody></table></div>`:empty('No customers yet','Add customers to build visit history and link vehicles.',{action:'add-customer',label:'Add first customer'})}
  function services(){return `${pageHead('Services & packages','Configure rates for private cars, taxis and commercial vehicles.','<button class="btn primary" data-action="add-service">＋ Add service</button>')}<div class="card"><div class="table-wrap">${db.services.length?`<table><thead><tr><th>Service</th><th>Category</th><th>Vehicle class</th><th>SAC</th><th>GST</th><th class="right">Rate</th><th>Action</th></tr></thead><tbody>${db.services.map(s=>`<tr><td><b>${esc(s.name)}</b><div class="help">${esc(s.description||'')}</div></td><td>${esc(s.category||'Wash')}</td><td>${esc(s.vehicleClass||'All')}</td><td>${esc(s.sac||'—')}</td><td>${Number(s.taxRate)||0}%</td><td class="right strong">${INR(s.price)}<div class="help">${s.prices?.private!=null?'Private '+INR(s.prices.private)+' · ':''}${s.prices?.taxi!=null?'Taxi '+INR(s.prices.taxi)+' · ':''}${s.prices?.commercial!=null?'Commercial '+INR(s.prices.commercial):''}</div></td><td><button class="btn small" data-edit-service="${s.id}">Edit</button> <button class="btn small danger" data-delete-service="${s.id}">Delete</button></td></tr>`).join('')}</tbody></table>`:empty('No services configured','Add your standard wash services and prices. Use your actual rates and tax details.',{action:'add-service',label:'Add first service'})}</div></div><div class="notice" style="margin-top:14px">Package/AMC note: prepaid wash-pass sale and redemption tracking are planned for the next module. Do not record prepaid passes as ordinary completed washes in this starter version.</div>`}
  function inventory(){return `${pageHead('Inventory','Track shampoo, foam, tyre polish, microfiber, wax and other consumables.','<button class="btn" data-action="stock-adjust">± Adjust stock</button><button class="btn primary" data-action="add-product">＋ Add item</button>')}<div class="card"><div class="toolbar"><div class="search"><input id="stock-search" placeholder="Search stock item…" /></div><span class="badge">${db.products.length} items</span></div><div id="stock-table">${stockTable(db.products)}</div></div>`}
  function stockTable(rows){return rows.length?`<div class="table-wrap"><table><thead><tr><th>Item</th><th>SKU</th><th>Current stock</th><th>Minimum</th><th>Unit cost</th><th class="right">Stock value</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows.map(p=>`<tr><td><b>${esc(p.name)}</b><div class="help">${esc(p.category||'Consumable')}</div></td><td>${esc(p.sku||'—')}</td><td>${p.qty} ${esc(p.unit||'unit')}</td><td>${p.minQty||0}</td><td>${INR(p.cost||0)}</td><td class="right">${INR(p.qty*p.cost)}</td><td>${Number(p.qty)<=Number(p.minQty||0)?'<span class="badge red">Low stock</span>':'<span class="badge green">In stock</span>'}</td><td><button class="btn small" data-edit-product="${p.id}">Edit</button></td></tr>`).join('')}</tbody></table></div>`:empty('No inventory items','Add products and consumables to track purchase quantity and stock value.',{action:'add-product',label:'Add first item'})}
  function purchases(){return `${pageHead('Purchases','Record stock received from suppliers. Purchase entries increase inventory.','<button class="btn primary" data-action="add-purchase">＋ Record purchase</button>')}<div class="card"><div class="table-wrap">${db.purchases.length?`<table><thead><tr><th>Date</th><th>Supplier</th><th>Item</th><th>Quantity</th><th class="right">Total</th><th>Payment</th></tr></thead><tbody>${[...db.purchases].sort((a,b)=>b.createdAt-a.createdAt).map(p=>`<tr><td>${esc(p.date)}</td><td>${esc(p.supplier)}</td><td>${esc(productName(p.productId))}</td><td>${p.qty} ${esc(db.products.find(x=>x.id===p.productId)?.unit||'')}</td><td class="right strong">${INR(p.total)}</td><td>${esc(p.paymentMode)}</td></tr>`).join('')}</tbody></table>`:empty('No purchases recorded','Record a purchase when stock arrives.',{action:'add-purchase',label:'Record first purchase'})}</div></div>`}
  function expenses(){return `${pageHead('Expenses','Record rent, electricity, water, salaries, repairs and other costs.','<button class="btn primary" data-action="add-expense">＋ Add expense</button>')}<div class="card"><div class="toolbar"><span class="badge">Total recorded: ${INR(sum(db.expenses,e=>e.amount))}</span><span class="muted" style="font-size:11px">All time</span></div><div class="table-wrap">${db.expenses.length?`<table><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Paid to</th><th>Mode</th><th class="right">Amount</th><th></th></tr></thead><tbody>${[...db.expenses].sort((a,b)=>b.createdAt-a.createdAt).map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.category)}</td><td>${esc(e.note||'—')}</td><td>${esc(e.paidTo||'—')}</td><td>${esc(e.mode)}</td><td class="right strong">${INR(e.amount)}</td><td><button class="btn small danger" data-delete-expense="${e.id}">Delete</button></td></tr>`).join('')}</tbody></table>`:empty('No expenses recorded','Start recording expenses to understand your monthly operating cost.',{action:'add-expense',label:'Add first expense'})}</div></div>`}
  function staff(){return `${pageHead('Staff','Keep a simple staff directory for assigning work to invoices.','<button class="btn primary" data-action="add-staff">＋ Add staff</button>')}<div class="card"><div class="table-wrap">${db.staff.length?`<table><thead><tr><th>Name</th><th>Role</th><th>Phone</th><th>Monthly salary (optional)</th><th></th></tr></thead><tbody>${db.staff.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.role)}</td><td>${esc(s.phone||'—')}</td><td>${s.salary?INR(s.salary):'—'}</td><td><button class="btn small danger" data-delete-staff="${s.id}">Remove</button></td></tr>`).join('')}</tbody></table>`:empty('No staff listed','Add washers, detailers, supervisors or cashiers.',{action:'add-staff',label:'Add staff'})}</div><p class="help" style="margin-top:12px">This version does not calculate payroll, attendance, PF or ESI. Those require a full payroll module.</p></div>`}
  function reports(){const m=document.getElementById('report-month')?.value||monthKey();const inv=db.invoices.filter(i=>monthKey(i.date)===m);const ex=db.expenses.filter(e=>monthKey(e.date)===m);const sales=sum(inv,i=>i.grandTotal),expensesTotal=sum(ex,e=>e.amount),cogs=sum(inv,i=>i.stockCost||0),collected=sum(inv,i=>paid(i));const grouped={};inv.forEach(i=>{(i.lines||[]).forEach(l=>{grouped[l.name]=(grouped[l.name]||0)+l.qty})});const popular=Object.entries(grouped).sort((a,b)=>b[1]-a[1]).slice(0,5);return `${pageHead('Reports','Monthly management reports. Choose a month to review business activity.','<button class="btn" data-action="export-csv">⬇ Export CSV</button>')}<div class="card" style="margin-bottom:16px"><div class="toolbar"><label class="muted" style="font-size:12px;font-weight:700">Report month</label><input type="month" id="report-month" value="${m}" /></div><div class="grid stats" style="margin:0">${stat('Sales',INR(sales),'₹',`${inv.length} invoices`)}${stat('Payments received',INR(collected),'✓','Collections against these invoices')}${stat('Expenses',INR(expensesTotal),'⇩',`${ex.length} expense entries`)}${stat('Estimated surplus',INR(sales-expensesTotal-cogs),'∑','After recorded expenses and estimated stock cost')}</div></div><div class="grid two"><div class="card"><div class="card-head"><h3>Expense categories</h3><span>${m}</span></div>${ex.length?`<div class="table-wrap"><table><thead><tr><th>Category</th><th class="right">Amount</th></tr></thead><tbody>${Object.entries(ex.reduce((a,e)=>(a[e.category]=(a[e.category]||0)+Number(e.amount),a),{})).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="right strong">${INR(v)}</td></tr>`).join('')}</tbody></table></div>`:empty('No expenses in this month','Expense categories will appear here.')}</div><div class="card"><div class="card-head"><h3>Most-used services / items</h3><span>${m}</span></div>${popular.length?popular.map(([k,v])=>`<div class="stock-alert"><span>${esc(k)}</span><b>${v} qty</b></div>`).join(''):empty('No billed items','Items will appear after creating invoices.')}</div></div><div class="notice" style="margin-top:16px">Important: this is an operational summary, not a double-entry Tally ledger, audited Profit & Loss, Balance Sheet, GST return or tax filing report. Purchase stock is not treated as a direct expense here; the surplus figure subtracts estimated stock usage only when a stock-linked service is configured.</div>`}
  function settings(){const b=db.business;return `${pageHead('Business settings','Complete these details before issuing customer invoices.','<button class="btn" data-action="export">⬇ Export backup</button><button class="btn" data-action="import">⬆ Restore backup</button>')}<div class="settings-grid"><div class="card"><div class="card-head"><h3>Business profile</h3></div><form id="business-form"><div class="field-grid"><div class="field full"><label>Business / washing centre name *</label><input name="name" required value="${esc(b.name)}" placeholder="Your Car Wash Centre" /></div><div class="field"><label>Phone number</label><input name="phone" value="${esc(b.phone)}" placeholder="+91…" /></div><div class="field"><label>Email</label><input name="email" type="email" value="${esc(b.email)}" /></div><div class="field full"><label>Business address</label><textarea name="address">${esc(b.address)}</textarea></div><div class="field"><label>City</label><input name="city" value="${esc(b.city)}" /></div><div class="field"><label>State</label><input name="state" value="${esc(b.state)}" /></div><div class="field"><label>State code</label><input name="stateCode" value="${esc(b.stateCode)}" placeholder="24" /></div><div class="field"><label>Invoice prefix (max 4 chars)</label><input name="invoicePrefix" maxlength="4" value="${esc(b.invoicePrefix)}" /></div><div class="field full"><label>UPI ID (optional)</label><input name="upi" value="${esc(b.upi)}" placeholder="business@upi" /></div><div class="field full"><label>Invoice footer / terms</label><textarea name="terms">${esc(b.terms)}</textarea></div></div><div class="form-actions"><button class="btn primary">Save business profile</button></div></form></div><div class="card"><div class="card-head"><h3>GST & invoice setup</h3></div><form id="tax-form"><div class="field-grid"><div class="field full"><label>GST registration</label><select name="registered"><option value="false" ${b.registered?'':'selected'}>Not registered / do not show GSTIN</option><option value="true" ${b.registered?'selected':''}>GST registered</option></select></div><div class="field full"><label>GSTIN</label><input name="gstin" value="${esc(b.gstin)}" maxlength="15" placeholder="15-character GSTIN" /></div></div><div class="notice" style="margin-top:14px">For registered businesses, tax invoices need prescribed supplier, serial number, date, recipient, SAC/HSN, description, taxable value and tax details. Confirm all tax settings with your CA. The app does not file GST returns or generate IRN e-invoices.</div><div class="form-actions"><button class="btn primary">Save tax settings</button></div></form></div><div class="card"><div class="card-head"><h3>Data protection</h3></div><div class="success-note">Your records are saved in this browser on this device. Use Export backup regularly and store the file somewhere safe. The app does not upload customer records to a server.</div><div class="actions" style="margin-top:14px"><button class="btn primary" data-action="export">Download full backup</button><button class="btn" data-action="import">Restore backup</button></div><p class="help" style="margin-top:12px">Clearing browser data, changing devices or using a different browser can remove access to these records unless you restore a backup. Do not use a shared/public device for real customer data.</p></div><div class="card"><div class="card-head"><h3>System status</h3></div><div class="stock-alert"><span>Storage</span><b>Local browser</b></div><div class="stock-alert"><span>Offline install</span><b id="pwa-status">Checking…</b></div><div class="stock-alert"><span>WhatsApp</span><b>Click-to-share</b></div><div class="stock-alert"><span>Cloud sync</span><b>Not configured</b></div><div class="help" style="margin-top:10px">Automatic multi-device sync requires a secured backend and user authentication. WhatsApp automatic outbound delivery requires official Meta Business Platform setup.</div></div></div>`}
  function wirePage(){document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.nav)));if(page==='billing'){document.getElementById('add-line')?.addEventListener('click',addLine);document.getElementById('bill-discount')?.addEventListener('input',updateBillSummary);document.getElementById('bill-paid')?.addEventListener('input',updateBillSummary)}if(page==='invoices'){document.getElementById('invoice-search')?.addEventListener('input',filterInvoices);document.getElementById('invoice-month')?.addEventListener('change',filterInvoices)}if(page==='customers')document.getElementById('customer-search')?.addEventListener('input',filterCustomers);if(page==='inventory')document.getElementById('stock-search')?.addEventListener('input',filterStock);if(page==='reports')document.getElementById('report-month')?.addEventListener('change',()=>render());document.getElementById('business-form')?.addEventListener('submit',saveBusiness);document.getElementById('tax-form')?.addEventListener('submit',saveTax);document.getElementById('pwa-status')&&(document.getElementById('pwa-status').textContent=('serviceWorker' in navigator)?'Supported':'Not supported')}
  function addLine(){const val=document.getElementById('line-item').value;const qty=Number(document.getElementById('line-qty').value);const disc=Number(document.getElementById('line-discount').value||0);if(!val||qty<=0||disc<0){notify('Choose an item and enter valid quantity and discount.');return}let l;if(val.startsWith('product:')){const p=db.products.find(x=>x.id===val.slice(8));if(!p)return;if(qty>Number(p.qty)){notify(`Only ${p.qty} ${p.unit||'units'} available.`);return}l={kind:'product',refId:p.id,name:p.name,qty,rate:Number(p.sellPrice||0),taxRate:db.business.registered?Number(p.taxRate||0):0,sac:p.hsn||'',discount:disc,unit:p.unit||'unit',cost:Number(p.cost||0)}}else{const svc=db.services.find(x=>x.id===val);if(!svc)return;const vtype=document.getElementById('bill-type')?.value||'Private Car';const key=({'Private Car':'private','Taxi':'taxi','Commercial Vehicle':'commercial','SUV':'suv'})[vtype]||'private';const custom=svc.prices?.[key];const rate=custom!==undefined&&custom!==null&&custom!==''?Number(custom):Number(svc.price||0);l={kind:'service',refId:svc.id,name:svc.name,qty,rate,taxRate:db.business.registered?Number(svc.taxRate||0):0,sac:svc.sac||'',discount:disc,unit:'service',consumption:svc.consumption||[]}}if(disc>qty*l.rate){notify('Line discount cannot exceed that line amount.');return}l.amount=Math.max(0,l.qty*l.rate-l.discount);billLines.push(l);document.getElementById('bill-lines').innerHTML=billLineTable();document.querySelector('[data-action="save-bill"]').disabled=false;document.getElementById('line-item').value='';document.getElementById('line-qty').value='1';document.getElementById('line-discount').value='0';updateBillSummary()}  function updateBillSummary(){document.getElementById('bill-summary').innerHTML=billSummary()}
  function saveBill(){if(!billLines.length){notify('Add at least one service or product.');return}let custId=document.getElementById('bill-customer').value||null;const vehicleId=document.getElementById('bill-vehicle').value||null;const selectedVehicle=db.vehicles.find(v=>v.id===vehicleId);if(selectedVehicle&&!custId)custId=selectedVehicle.customerId;if(selectedVehicle&&custId&&selectedVehicle.customerId!==custId){notify('The selected vehicle does not belong to this customer.');return}const number=(document.getElementById('bill-number').value||selectedVehicle?.number||'').trim().toUpperCase();const type=document.getElementById('bill-type').value;const discount=Number(document.getElementById('bill-discount').value||0);const calc=calcLines(billLines,discount);const amountPaid=Number(document.getElementById('bill-paid').value||0);if(discount<0||discount>calc.gross-calc.lineDisc+.009){notify('Overall discount cannot exceed the remaining item value.');return}if(amountPaid<0||amountPaid>calc.grand+.009){notify('Payment received cannot be more than the bill total.');return}const required={};billLines.forEach(l=>{if(l.kind==='product')required[l.refId]=(required[l.refId]||0)+l.qty;else (l.consumption||[]).forEach(u=>required[u.productId]=(required[u.productId]||0)+Number(u.qtyPerService||0)*l.qty)});for(const [pid,qty] of Object.entries(required)){const p=db.products.find(x=>x.id===pid);if(p&&qty>Number(p.qty)+.000001){notify(`Not enough stock for ${p.name}. Required ${qty}; available ${p.qty}.`);return}}const stockCost=applyConsumption(billLines);const cust=db.customers.find(c=>c.id===custId);const biz=JSON.parse(JSON.stringify(db.business));const inv={id:id(),number:nextInvoiceNo(),financialYear:fy(),date:today(),createdAt:Date.now(),businessSnapshot:biz,gstRegistered:!!biz.registered,businessState:biz.state,customerId:custId,customerState:cust?.state||biz.state,customerGstin:cust?.gstin||'',customerAddress:cust?.address||'',customerCity:cust?.city||'',vehicleId,vehicleNumber:number,vehicleType:type,odometer:document.getElementById('bill-odo').value,staffId:document.getElementById('bill-staff').value||null,lines:JSON.parse(JSON.stringify(billLines)),discount,subtotal:calc.gross,lineDiscount:calc.lineDisc,taxable:calc.taxable,tax:calc.tax,grandTotal:calc.grand,stockCost,notes:document.getElementById('bill-notes').value||'',paymentMode:document.getElementById('bill-mode').value};db.invoices.push(inv);if(amountPaid>0)db.payments.push({id:id(),invoiceId:inv.id,date:today(),amount:amountPaid,mode:inv.paymentMode,createdAt:Date.now()});if(custId&&number&&!selectedVehicle&&!db.vehicles.some(v=>v.number.toUpperCase()===number)){db.vehicles.push({id:id(),customerId:custId,number,type,createdAt:Date.now()})}save();billLines=[];setPage('invoices');openInvoice(inv.id);notify('Invoice saved successfully.')}
  function applyConsumption(lines){let cost=0;lines.forEach(l=>{if(l.kind==='product'){const p=db.products.find(x=>x.id===l.refId);if(p){p.qty=Math.max(0,Number(p.qty)-l.qty);cost+=l.qty*Number(p.cost||0)}}if(l.kind==='service'){(l.consumption||[]).forEach(u=>{const p=db.products.find(x=>x.id===u.productId);if(p){const q=Number(u.qtyPerService||0)*l.qty;p.qty=Math.max(0,Number(p.qty)-q);cost+=q*Number(p.cost||0)}})}});return cost}
  function filterInvoices(){const q=(document.getElementById('invoice-search').value||'').toLowerCase();const m=document.getElementById('invoice-month').value;let rows=[...db.invoices].filter(i=>(!m||monthKey(i.date)===m)&&[i.number,i.vehicleNumber,customerName(i.customerId)].join(' ').toLowerCase().includes(q)).sort((a,b)=>b.createdAt-a.createdAt);document.getElementById('invoice-table').innerHTML=invoiceTable(rows)}

  function invoiceTaxLines(i){const pre=(i.lines||[]).map(l=>Math.max(0,l.qty*l.rate-(l.discount||0)));const preTotal=sum(pre);const supplierState=i.businessState||i.businessSnapshot?.state||db.business.state;const registered=i.gstRegistered??i.businessSnapshot?.registered??db.business.registered;const inter=!!(i.customerState&&supplierState&&i.customerState.trim().toLowerCase()!==supplierState.trim().toLowerCase());return (i.lines||[]).map((l,n)=>{const allocated=preTotal>0?(Number(i.discount)||0)*pre[n]/preTotal:0;const taxable=Math.max(0,pre[n]-allocated);const rate=registered?Number(l.taxRate)||0:0;const tax=taxable*rate/100;return {taxable,rate,tax,cgst:inter?0:tax/2,sgst:inter?0:tax/2,igst:inter?tax:0}})}
  function invoiceHTML(i){const b=i.businessSnapshot||db.business;const registered=i.gstRegistered??b.registered;const lines=invoiceTaxLines(i);const cgst=sum(lines,x=>x.cgst),sgst=sum(lines,x=>x.sgst),igst=sum(lines,x=>x.igst);const rows=i.lines.map((l,n)=>{const tx=lines[n];return `<tr><td>${n+1}. ${esc(l.name)}<div class="help">${l.kind==='service'?'Service':'Product'} · ${esc(l.sac||'SAC/HSN not set')} · GST ${tx.rate}%</div></td><td>${l.qty} ${esc(l.unit||'')}</td><td class="right">${INR(l.rate)}</td><td class="right">${INR(tx.taxable)}</td><td class="right">${INR(tx.tax)}</td></tr>`}).join('');const cust=db.customers.find(c=>c.id===i.customerId);const pay=paid(i);return `<div class="invoice-preview" id="invoice-paper"><div class="inv-top"><div><h2>${esc(b.name||'Your Car Wash Centre')}</h2><div style="font-size:11px;line-height:1.6;color:#657187">${esc(b.address||'Business address not configured')}<br/>${esc(b.city||'')}, ${esc(b.state||'')} (${esc(b.stateCode||'')})<br/>${b.phone?'Phone: '+esc(b.phone):''}<br/>${registered&&b.gstin?'GSTIN: '+esc(b.gstin):''}</div></div><div class="inv-meta"><b>${registered?'TAX INVOICE':'INVOICE'}</b><br/>No: ${esc(i.number)}<br/>Date: ${esc(i.date)}<br/>Financial year: ${esc(i.financialYear)}</div></div><div class="bill-to"><b>Bill to</b><br/>${esc(customerName(i.customerId))}<br/>${esc(i.customerAddress||cust?.address||'')}<br/>${esc(i.customerCity||cust?.city||'')}, ${esc(i.customerState||cust?.state||'')}<br/>${cust?.phone?'Phone: '+esc(cust.phone):''} ${i.customerGstin?' · GSTIN: '+esc(i.customerGstin):''}<br/>Vehicle: ${esc(i.vehicleNumber||'—')} · ${esc(i.vehicleType||'')}<br/>${i.odometer?'Odometer: '+esc(i.odometer)+' km':''}</div><table><thead><tr><th>Description / SAC-HSN</th><th>Qty</th><th class="right">Rate</th><th class="right">Taxable</th><th class="right">GST</th></tr></thead><tbody>${rows}</tbody></table><div style="margin-left:auto;max-width:280px;margin-top:15px;font-size:11px;line-height:1.8"><div style="   function shareInvoice(invId){const i=db.invoices.find(x=>x.id===invId);if(!i)return;let phone=(db.customers.find(c=>c.id===i.customerId)?.phone||'').replace(/\D/g,'');if(phone.length===10)phone='91'+phone;const message=`Hello ${customerName(i.customerId)}, thank you for visiting ${i.businessSnapshot?.name||db.business.name||'our car wash centre'}. Your invoice ${i.number} dated ${i.date} is ${INR(i.grandTotal)}. Paid: ${INR(paid(i))}. Balance: ${INR(invoiceDue(i))}. Vehicle: ${i.vehicleNumber||'—'}. Thank you!`;const file=makePdf(i);if(file&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:`Invoice ${i.number}`,text:message}).catch(err=>{if(err?.name!=='AbortError')notify('Sharing was cancelled. Use Print / Save PDF or WhatsApp message instead.')});return}if(!phone){notify('Customer phone number is missing. Add it to the customer record.');return}const url=`https://wa.me/${phone}?text=${encodeURIComponent(message)}`;window.open(url,'_blank','noopener');notify('WhatsApp opened. Review and send the message; attach the PDF manually if needed.')}
  function makePdf(i){if(!window.jspdf?.jsPDF){notify('PDF library is unavailable. Use Print / Save PDF instead.');return null}const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});const b=i.businessSnapshot||db.business;const registered=i.gstRegistered??b.registered;const taxLines=invoiceTaxLines(i);let y=17;doc.setFont('helvetica','bold');doc.setFontSize(18);doc.text(b.name||'Car Wash Centre',14,y);doc.setFont('helvetica','normal');doc.setFontSize(9);y+=6;const sub=[b.address,b.city,b.state,b.phone?'Phone: '+b.phone:'',registered&&b.gstin?'GSTIN: '+b.gstin:''].filter(Boolean).join(' | ');const subLines=doc.splitTextToSize(sub,115);doc.text(subLines,14,y);doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text(registered?'TAX INVOICE':'INVOICE',196,17,{align:'right'});doc.setFont('helvetica','normal');doc.setFontSize(9);doc.text(`No: ${i.number}\nDate: ${i.date}\nFY: ${i.financialYear}`,196,23,{align:'right'});y+=subLines.length*4+11;doc.setFont('helvetica','bold');doc.text('Bill To',14,y);doc.setFont('helvetica','normal');y+=5;doc.text([customerName(i.customerId),i.customerAddress||'',`${i.customerCity||''} ${i.customerState||''}`,i.customerGstin?`GSTIN: ${i.customerGstin}`:'',`Vehicle: ${i.vehicleNumber||'—'} (${i.vehicleType||''})`,db.customers.find(c=>c.id===i.customerId)?.phone||''].filter(Boolean),14,y);y+=29;doc.setFont('helvetica','bold');doc.text('Description',14,y);doc.text('Qty',118,y);doc.text('Rate',142,y,{align:'right'});doc.text('Taxable',169,y,{align:'right'});doc.text('GST',196,y,{align:'right'});y+=3;doc.line(14,y,196,y);y+=6;doc.setFont('helvetica','normal');for(let idx=0;idx<i.lines.length;idx++){const l=i.lines[idx],tx=taxLines[idx];const lines=doc.splitTextToSize(`${l.name} (${l.sac||'SAC/HSN n/a'})`,93);doc.text(lines,14,y);doc.text(`${l.qty} ${l.unit||''}`,118,y);doc.text(`Rs. ${Number(l.rate).toFixed(2)}`,142,y,{align:'right'});doc.text(`Rs. ${tx.taxable.toFixed(2)}`,169,y,{align:'right'});doc.text(`Rs. ${tx.tax.toFixed(2)}`,196,y,{align:'right'});y+=Math.max(6,lines.length*4)+2;if(y>250){doc.addPage();y=18}}y+=5;doc.line(120,y,196,y);y+=7;const cg=sum(taxLines,x=>x.cgst),sg=sum(taxLines,x=>x.sgst),ig=sum(taxLines,x=>x.igst);const lines=[['Subtotal',`Rs. ${Number(i.subtotal).toFixed(2)}`],['Discount',`Rs. ${Number(i.lineDiscount+i.discount).toFixed(2)}`],['Taxable value',`Rs. ${Number(i.taxable).toFixed(2)}`],...(registered?(ig>0?[['IGST',`Rs. ${ig.toFixed(2)}`]]:[['CGST',`Rs. ${cg.toFixed(2)}`],['SGST',`Rs. ${sg.toFixed(2)}`]]):[]),['Grand total',`Rs. ${Number(i.grandTotal).toFixed(2)}`],['Paid',`Rs. ${Number(paid(i)).toFixed(2)}`],['Balance due',`Rs. ${Number(invoiceDue(i)).toFixed(2)}`]];for(const [k,v] of lines){doc.setFont('helvetica',k==='Grand total'?'bold':'normal');doc.text(k,132,y);doc.text(v,196,y,{align:'right'});y+=6}y+=8;doc.setFont('helvetica','normal');doc.setFontSize(8);doc.text(doc.splitTextToSize(`${i.notes||''} ${b.terms||'Thank you for your business.'}`,180),14,y);const blob=doc.output('blob');const file=new File([blob],`Invoice-${i.number}.pdf`,{type:'application/pdf'});return file}

  function addCustomerForm(){openModal('Add customer',`<form id="customer-form"><div class="field-grid"><div class="field"><label>Customer name *</label><input name="name" required /></div><div class="field"><label>Mobile number</label><input name="phone" inputmode="tel" placeholder="10-digit mobile or country code" /></div><div class="field"><label>City</label><input name="city" value="Surat" /></div><div class="field"><label>State</label><input name="state" value="Gujarat" /></div><div class="field full"><label>Full address</label><input name="address" /></div><div class="field full"><label>Customer GSTIN (optional)</label><input name="gstin" maxlength="15" /></div></div><div class="form-actions"><button type="button" class="btn" id="cancel-modal">Cancel</button><button class="btn primary">Save customer</button></div></form>`);document.getElementById('customer-form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);db.customers.push({id:id(),name:String(f.get('name')).trim(),phone:String(f.get('phone')||'').trim(),city:String(f.get('city')||'').trim(),state:String(f.get('state')||'').trim(),address:String(f.get('address')||'').trim(),gstin:String(f.get('gstin')||'').trim().toUpperCase(),createdAt:Date.now()});save();closeModal();render();notify('Customer saved.')})}
  function addServiceForm(s){const edit=!!s;openModal(edit?'Edit service':'Add service',`<form id="service-form"><div class="field-grid"><div class="field"><label>Service name *</label><input name="name" required value="${esc(s?.name||'')}" /></div><div class="field"><label>Category</label><select name="category"><option ${s?.category==='Wash'?'selected':''}>Wash</option><option ${s?.category==='Detailing'?'selected':''}>Detailing</option><option ${s?.category==='Interior'?'selected':''}>Interior</option><option ${s?.category==='Polishing'?'selected':''}>Polishing</option><option ${s?.category==='Other'?'selected':''}>Other</option></select></div><div class="field"><label>Vehicle class</label><select name="vehicleClass"><option>All</option><option>Private Car</option><option>Taxi</option><option>Commercial Vehicle</option><option>SUV</option><option>Two Wheeler</option></select></div><div class="field"><label>Standard price (₹) *</label><input name="price" type="number" min="0" step=".01" required value="${s?.price??''}" /></div><div class="field"><label>Private car price (optional)</label><input name="pricePrivate" type="number" min="0" step=".01" value="${s?.prices?.private??''}" /></div><div class="field"><label>Taxi price (optional)</label><input name="priceTaxi" type="number" min="0" step=".01" value="${s?.prices?.taxi??''}" /></div><div class="field"><label>Commercial vehicle price (optional)</label><input name="priceCommercial" type="number" min="0" step=".01" value="${s?.prices?.commercial??''}" /></div><div class="field"><label>SUV price (optional)</label><input name="priceSuv" type="number" min="0" step=".01" value="${s?.prices?.suv??''}" /></div><div class="field"><label>GST rate (%)</label><input name="taxRate" type="number" min="0" max="100" step=".01" value="${s?.taxRate??0}" /></div><div class="field"><label>SAC code (ask your CA)</label><input name="sac" value="${esc(s?.sac||'')}" /></div><div class="field full"><label>Description</label><input name="description" value="${esc(s?.description||'')}" /></div><div class="field"><label>Consumable used (optional)</label><select name="productId"><option value="">No automatic stock deduction</option>${db.products.map(p=>`<option value="${p.id}" ${s?.consumption?.[0]?.productId===p.id?'selected':''}>${esc(p.name)} (${esc(p.unit||'unit')})</option>`).join('')}</select></div><div class="field"><label>Quantity used per service</label><input name="qtyPerService" type="number" min="0" step=".001" value="${s?.consumption?.[0]?.qtyPerService??0}" /></div></div><p class="help">Optional: map one main chemical/consumable to this service. The quantity is automatically deducted when you bill this service.</p><div class="form-actions"><button type="button" class="btn" id="cancel-modal">Cancel</button><button class="btn primary">Save service</button></div></form>`);document.getElementById('service-form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);const prod=f.get('productId');const sObj={id:s?.id||id(),name:f.get('name').trim(),category:f.get('category'),vehicleClass:f.get('vehicleClass'),price:Number(f.get('price')),prices:{private:f.get('pricePrivate')===''?null:Number(f.get('pricePrivate')),taxi:f.get('priceTaxi')===''?null:Number(f.get('priceTaxi')),commercial:f.get('priceCommercial')===''?null:Number(f.get('priceCommercial')),suv:f.get('priceSuv')===''?null:Number(f.get('priceSuv'))},taxRate:Number(f.get('taxRate')||0),sac:f.get('sac').trim(),description:f.get('description').trim(),consumption:prod&&Number(f.get('qtyPerService'))>0?[{productId:prod,qtyPerService:Number(f.get('qtyPerService'))}]:[]};if(s)db.services=db.services.map(x=>x.id===s.id?sObj:x);else db.services.push(sObj);save();closeModal();render();notify('Service saved.')})}
  function addProductForm(p){openModal(p?'Edit inventory item':'Add inventory item',`<form id="product-form"><div class="field-grid"><div class="field"><label>Item name *</label><input name="name" required value="${esc(p?.name||'')}" /></div><div class="field"><label>SKU / code</label><input name="sku" value="${esc(p?.sku||'')}" /></div><div class="field"><label>Category</label><input name="category" value="${esc(p?.category||'Chemical') }" /></div><div class="field"><label>Unit</label><select name="unit"><option ${p?.unit==='Litre'?'selected':''}>Litre</option><option ${p?.unit==='Bottle'?'selected':''}>Bottle</option><option ${p?.unit==='Kg'?'selected':''}>Kg</option><option ${p?.unit==='Piece'?'selected':''}>Piece</option><option ${p?.unit==='Packet'?'selected':''}>Packet</option><option ${p?.unit==='Unit'?'selected':''}>Unit</option></select></div><div class="field"><label>Opening stock</label><input name="qty" type="number" min="0" step=".001" value="${p?.qty??0}" /></div><div class="field"><label>Minimum stock alert</label><input name="minQty" type="number" min="0" step=".001" value="${p?.minQty??0}" /></div><div class="field"><label>Cost per unit (₹)</label><input name="cost" type="number" min="0" step=".01" value="${p?.cost??0}" /></div><div class="field"><label>Selling price (₹)</label><input name="sellPrice" type="number" min="0" step=".01" value="${p?.sellPrice??0}" /></div><div class="field"><label>GST rate (%)</label><input name="taxRate" type="number" min="0" max="100" value="${p?.taxRate??0}" /></div><div class="field"><label>HSN code</label><input name="hsn" value="${esc(p?.hsn||'')}" /></div></div><div class="form-actions"><button type="button" class="btn" id="cancel-modal">Cancel</button><button class="btn primary">Save item</button></div></form>`);document.getElementById('product-form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);const o={id:p?.id||id(),name:f.get('name').trim(),sku:f.get('sku').trim(),category:f.get('category').trim(),unit:f.get('unit'),qty:Number(f.get('qty')||0),minQty:Number(f.get('minQty')||0),cost:Number(f.get('cost')||0),sellPrice:Number(f.get('sellPrice')||0),taxRate:Number(f.get('taxRate')||0),hsn:String(f.get('hsn')||'').trim()};if(p){const old=db.products.find(x=>x.id===p.id);o.qty=Number(f.get('qty')||0);db.products=db.products.map(x=>x.id===p.id?o:x)}else db.products.push(o);save();closeModal();render();notify('Inventory item saved.')})}
  function addExpenseForm(){openModal('Add expense',`<form id="expense-form"><div class="field-grid"><div class="field"><label>Date *</label><input name="date" type="date" required value="${today()}" /></div><div class="field"><label>Category *</label><select name="category"><option>Electricity</option><option>Water</option><option>Rent</option><option>Salary</option><option>Repairs & maintenance</option><option>Equipment</option><option>Marketing</option><option>Transport</option><option>Internet / phone</option><option>Other</option></select></div><div class="field"><label>Amount (₹) *</label><input name="amount" type="number" min=".01" step=".01" required /></div><div class="field"><label>Paid to</label><input name="paidTo" /></div><div class="field"><label>Payment mode</label><select name="mode"><option>Cash</option><option>UPI</option><option>Card</option><option>Bank Transfer</option></select></div><div class="field"><label>Description</label><input name="note" /></div></div><div class="form-actions"><button type="button" class="btn" id="cancel-modal">Cancel</button><button class="btn primary">Save expense</button></div></form>`);document.getElementById('expense-form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);db.expenses.push({id:id(),date:f.get('date'),category:f.get('category'),amount:Number(f.get('amount')),paidTo:f.get('paidTo'),mode:f.get('mode'),note:f.get('note'),createdAt:Date.now()});save();closeModal();render();notify('Expense saved.')})}
  function addPurchaseForm(){if(!db.products.length){notify('Add an inventory item first.');closeModal();setPage('inventory');return}openModal('Record purchase',`<form id="purchase-form"><div class="field-grid"><div class="field"><label>Date</label><input name="date" type="date" value="${today()}" required /></div><div class="field"><label>Supplier name *</label><input name="supplier" required /></div><div class="field"><label>Item *</label><select name="productId">${db.products.map(p=>`<option value="${p.id}">${esc(p.name)} · stock ${p.qty}</option>`).join('')}</select></div><div class="field"><label>Quantity received</label><input name="qty" type="number" min=".001" step=".001" required /></div><div class="field"><label>Cost per unit (₹)</label><input name="unitCost" type="number" min="0" step=".01" required /></div><div class="field"><label>Payment mode</label><select name="paymentMode"><option>Cash</option><option>UPI</option><option>Card</option><option>Bank Transfer</option><option>Credit</option></select></div><div class="field full"><label>Invoice / reference no.</label><input name="ref" /></div></div><div class="form-actions"><button type="button" class="btn" id="cancel-modal">Cancel</button><button class="btn primary">Save purchase & update stock</button></div></form>`);document.getElementById('purchase-form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);const p=db.products.find(x=>x.id===f.get('productId'));const q=Number(f.get('qty'));const c=Number(f.get('unitCost'));if(!p||q<=0)return;const oldQty=Number(p.qty)||0;const newQty=oldQty+q;const oldCost=Number(p.cost)||0;p.cost=newQty>0?((oldQty*oldCost)+(q*c))/newQty:c;p.qty=newQty;db.purchases.push({id:id(),date:f.get('date'),supplier:f.get('supplier'),productId:p.id,qty:q,unitCost:c,total:q*c,paymentMode:f.get('paymentMode'),ref:f.get('ref'),createdAt:Date.now()});save();closeModal();render();notify('Purchase saved and stock updated.')})}
  function addStaffForm(){openModal('Add staff member',`<form id="staff-form"><div class="field-grid"><div class="field"><label>Name *</label><input name="name" required /></div><div class="field"><label>Role</label><select name="role"><option>Washer</option><option>Detailer</option><option>Supervisor</option><option>Cashier</option><option>Manager</option><option>Other</option></select></div><div class="field"><label>Phone</label><input name="phone" /></div><div class="field"><label>Monthly salary (optional)</label><input name="salary" type="number" min="0" /></div></div><div class="form-actions"><button type="button" class="btn" id="cancel-modal">Cancel</button><button class="btn primary">Save staff</button></div></form>`);document.getElementById('staff-form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);db.staff.push({id:id(),name:f.get('name'),role:f.get('role'),phone:f.get('phone'),salary:Number(f.get('salary')||0)});save();closeModal();render();notify('Staff member added.')})}
  function saveBusiness(e){e.preventDefault();const f=new FormData(e.target);['name','phone','email','address','city','state','stateCode','invoicePrefix','upi','terms'].forEach(k=>db.business[k]=String(f.get(k)||'').trim());db.business.invoicePrefix=(db.business.invoicePrefix||'CW').slice(0,4).toUpperCase();save();document.getElementById('avatar').textContent=(db.business.name||'W').slice(0,1).toUpperCase();notify('Business profile saved.')}
  function saveTax(e){e.preventDefault();const f=new FormData(e.target);db.business.registered=f.get('registered')==='true';db.business.gstin=String(f.get('gstin')||'').trim().toUpperCase();if(db.business.registered&&db.business.gstin.length!==15){notify('Please enter a valid 15-character GSTIN, or choose Not registered.');return}save();notify('Tax settings saved.')}
  function exportBackup(){const blob=new Blob([JSON.stringify({app:'WashDesk',version:1,exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'});downloadBlob(blob,`washdesk-backup-${today()}.json`);notify('Backup downloaded.')}
  function downloadBlob(blob,name){const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
  function importBackup(){const inp=document.createElement('input');inp.type='file';inp.accept='application/json,.json';inp.onchange=()=>{const file=inp.files?.[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const parsed=JSON.parse(r.result);const candidate=parsed.data||parsed;if(!candidate.business||!Array.isArray(candidate.invoices)||!Array.isArray(candidate.products))throw new Error('Invalid backup');if(!confirm('Restore this backup and replace the data currently saved in this browser?'))return;db=Object.assign(blank(),candidate);save();setPage('dashboard');notify('Backup restored.')}catch(e){notify('Could not restore: invalid backup file.')}};r.readAsText(file)};inp.click()}
  function exportCsv(){const rows=[['Invoice','Date','Customer','Vehicle','Total','Paid','Due'],...db.invoices.map(i=>[i.number,i.date,customerName(i.customerId),i.vehicleNumber,i.grandTotal,paid(i),invoiceDue(i)])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),`washdesk-invoices-${today()}.csv`)}
  function stockAdjustForm(){if(!db.products.length){notify('Add an item first.');return}openModal('Adjust stock',`<form id="adjust-form"><div class="field-grid"><div class="field full"><label>Inventory item</label><select name="productId">${db.products.map(p=>`<option value="${p.id}">${esc(p.name)} — current ${p.qty} ${esc(p.unit||'')}</option>`).join('')}</select></div><div class="field"><label>Adjustment</label><select name="kind"><option value="add">Add stock</option><option value="remove">Use / remove stock</option><option value="set">Set exact stock count</option></select></div><div class="field"><label>Quantity</label><input name="qty" type="number" min="0" step=".001" required /></div><div class="field full"><label>Reason</label><input name="reason" placeholder="Spillage, damaged, usage, stock count…" /></div></div><div class="form-actions"><button type="button" class="btn" id="cancel-modal">Cancel</button><button class="btn primary">Save adjustment</button></div></form>`);document.getElementById('adjust-form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);const p=db.products.find(x=>x.id===f.get('productId'));const q=Number(f.get('qty'));if(!p||q<0)return;const before=Number(p.qty);p.qty=f.get('kind')==='add'?before+q:f.get('kind')==='remove'?Math.max(0,before-q):q;db.expenses.push({id:id(),date:today(),category:'Stock adjustment',amount:0,paidTo:'',mode:'Non-cash',note:`${p.name}: ${before} → ${p.qty}. ${f.get('reason')||''}`,createdAt:Date.now()});save();closeModal();render();notify('Stock adjusted.')})}
  function addVehicleForm(cid){openModal('Add vehicle',`<form id="vehicle-form"><div class="field-grid"><div class="field"><label>Registration number *</label><input name="number" required placeholder="GJ05AB1234" /></div><div class="field"><label>Vehicle class</label><select name="type"><option>Private Car</option><option>Taxi</option><option>Commercial Vehicle</option><option>SUV</option><option>Two Wheeler</option><option>Other</option></select></div><div class="field"><label>Make / model</label><input name="make" /></div></div><div class="form-actions"><button type="button" class="btn" id="cancel-modal">Cancel</button><button class="btn primary">Save vehicle</button></div></form>`);document.getElementById('vehicle-form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);db.vehicles.push({id:id(),customerId:cid,number:f.get('number').trim().toUpperCase(),type:f.get('type'),make:f.get('make')});save();closeModal();showCustomer(cid);notify('Vehicle added.')})}
  function addPaymentForm(invId){const i=db.invoices.find(x=>x.id===invId);const due=invoiceDue(i);openModal('Record payment',`<p class="muted" style="font-size:12px">Invoice ${esc(i.number)} · Balance due ${INR(due)}</p><form id="payment-form"><div class="field-grid"><div class="field"><label>Amount received (₹)</label><input name="amount" type="number" min=".01" max="${due}" step=".01" required /></div><div class="field"><label>Payment mode</label><select name="mode"><option>Cash</option><option>UPI</option><option>Card</option><option>Bank Transfer</option><option>Mixed</option></select></div><div class="field"><label>Date</label><input name="date" type="date" value="${today()}" required /></div></div><div class="form-actions"><button type="button" class="btn" id="cancel-modal">Cancel</button><button class="btn primary">Save payment</button></div></form>`);document.getElementById('payment-form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);const amount=Number(f.get('amount'));if(amount<=0||amount>due+.009){notify('Enter a payment within the outstanding balance.');return}db.payments.push({id:id(),invoiceId:invId,date:f.get('date'),amount,mode:f.get('mode'),createdAt:Date.now()});save();closeModal();openInvoice(invId);notify('Payment recorded.')})}
  document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.action;if(a==='new-bill'){billLines=[];setPage('billing')}else if(a==='add-customer'||a==='quick-customer')addCustomerForm();else if(a==='add-service')addServiceForm();else if(a==='add-product')addProductForm();else if(a==='add-expense')addExpenseForm();else if(a==='add-purchase')addPurchaseForm();else if(a==='add-staff')addStaffForm();else if(a==='export')exportBackup();else if(a==='import')importBackup();else if(a==='export-csv')exportCsv();else if(a==='stock-adjust')stockAdjustForm();else if(a==='clear-bill'){billLines=[];setPage('billing')}else if(a==='save-bill')saveBill();else if(a==='add-vehicle')addVehicleForm(b.dataset.customerId);if(b.dataset.nav)setPage(b.dataset.nav);if(b.dataset.invoice)openInvoice(b.dataset.invoice);if(b.dataset.customer)showCustomer(b.dataset.customer);if(b.dataset.share)shareInvoice(b.dataset.share);if(b.dataset.print)printInvoice(b.dataset.print);if(b.dataset.payment)addPaymentForm(b.dataset.payment);if(b.dataset.editService)addServiceForm(db.services.find(x=>x.id===b.dataset.editService));if(b.dataset.deleteService){if(confirm('Delete this service? Existing invoices will remain unchanged.')){db.services=db.services.filter(x=>x.id!==b.dataset.deleteService);save();render()}}if(b.dataset.editProduct)addProductForm(db.products.find(x=>x.id===b.dataset.editProduct));if(b.dataset.deleteExpense){if(confirm('Delete this expense entry?')){db.expenses=db.expenses.filter(x=>x.id!==b.dataset.deleteExpense);save();render()}}if(b.dataset.deleteStaff){db.staff=db.staff.filter(x=>x.id!==b.dataset.deleteStaff);save();render()}if(b.id==='modal-close'||b.id==='cancel-modal')closeModal();if(b.dataset.removeLine!==undefined){billLines.splice(Number(b.dataset.removeLine),1);render()}});
  document.getElementById('modal-close').addEventListener('click',closeModal);document.getElementById('modal-backdrop').addEventListener('click',e=>{if(e.target.id==='modal-backdrop')closeModal()});document.getElementById('hamb').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)setPage(b.dataset.page)});document.getElementById('today-label').textContent=new Date().toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'});document.getElementById('avatar').textContent=(db.business.name||'W').slice(0,1).toUpperCase();
  render();
  if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
