ce-preview .inv-meta{text-align:right;font-size:11px;line-height:1.7}.invoice-preview .bill-to{margin:20px 0;font-size:12px;line-height:1.6}.invoice-summary{margin:18px 0 0 auto;width:100%;max-width:310px;font-size:11px;line-height:1.65}.invoice-summary-row{display:flex;justify-content:space-between;gap:14px;padding:3px 0}.invoice-summary-row b{text-align:right;white-space:nowrap}.invoice-grand-total{margin:8px 0;padding:11px 12px;border-radius:8px;background:#14213a;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px}.invoice-grand-total strong{font-size:20px;white-space:nowrap}.balance-row{border-top:1px dashed #cbd5e1;padding-top:7px;margin-top:4px;font-size:12px}.invoice-preview table{font-size:11px}.invoice-preview th{font-size:9px}.invoice-preview .inv-foot{font-size:10px;color:var(--muted);margin-top:18px}.chart{height:180px;display:flex;align-items:end;gap:8px;border-bottom:1px solid var(--line);padding:18px 4px 0}.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;gap:7px;min-width:0}.bar{width:min(30px,75%);background:linear-gradient(180deg,#5fa1ff,#2865e3);border-radius:7px 7px 2px 2px;min-height:3px}.bar-label{font-size:9px;color:var(--muted)}.stock-alert{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #edf0f5;font-size:12px}.stock-alert:last-child{border:0}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.notice{padding:12px 14px;border-radius:12px;background:#fff8e8;border:1px solid #f4dfac;color:#77530e;font-size:11px;line-height:1.55}.success-note{padding:12px 14px;border-radius:12px;background:#eaf8f3;border:1px solid #c6eadc;color:#126d54;font-size:11px;line-height:1.55}.hide{display:none!important}

<script>
(() => {
  'use strict';
  const STORE='washdesk-v1';
  const INR=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(Number(n)||0);
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
  const monthKey=d=>(d||today()).slice(0,7);
  const id=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
  const blank=()=>({
    business:{name:'Prime Auto Care',phone:'',email:'',address:'',city:'Surat',state:'Gujarat',stateCode:'24',gstin:'',registered:false,invoicePrefix:'CW',upi:'',terms:'Thank you for choosing us. Drive safe!'},
    settings:{currency:'INR',financialYearStart:4,stockAlerts:true},
    services:[],customers:[],vehicles:[],invoices:[],products:[],purchases:[],expenses:[],staff:[],payments:[],_deletedIds:{},meta:{businessUpdatedAt:0},
  });
  let db=load(); let page='dashboard'; let cloudOtpPending=false; let cloudOtpEmail=''; let billLines=[]; let billSaving=false; let editingLines=[]; let editingInvoiceId=null; let offerQueue=[]; let offerIndex=0; let offerDraft=''; let toastTimer=null;
  function load(){try{const x=JSON.parse(localStorage.getItem(STORE));return x&&x.business?Object.assign(blank(),x):blank()}catch(e){return blank()}}
  function save(){try{const previous=JSON.parse(localStorage.getItem(STORE)||'{}');['customers','vehicles','services','invoices','products','purchases','expenses','staff','payments'].forEach(k=>{const oldMap=new Map((previous[k]||[]).map(x=>[x.id,x]));(db[k]||[]).forEach(x=>{const old=oldMap.get(x.id);if(!old||JSON.stringify(old)!==JSON.stringify(x))x.updatedAt=Date.now()})});if(!previous.business||JSON.stringify(previous.business)!==JSON.stringify(db.business))db.business.updatedAt=Date.now();if(JSON.stringify(previous.settings||{})!==JSON.stringify(db.settings||{}))db.settings.updatedAt=Date.now();db._deletedIds=db._deletedIds||{};localStorage.setItem(STORE,JSON.stringify(db));window.WashDeskCloud?.schedulePush?.(db);return true}catch(e){notify('Storage is full. Export a backup and remove old records.');return false}}
  function notify(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2800)}
  function setPage(p){page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('sidebar').classList.remove('open');document.getElementById('top-title').textContent=({dashboard:'Dashboard',billing:'New bill',invoices:'Invoices',customers:'Customers & vehicles',services:'Services & packages',inventory:'Inventory',purchases:'Purchases',expenses:'Expenses',staff:'Staff',reports:'Reports',offers:'Offers & WhatsApp',settings:'Business settings'})[p]||'WashDesk';document.getElementById('top-subtitle').textContent=({dashboard:'Your business at a glance',billing:'Create a customer bill in a few steps',invoices:'Search, review and share every saved invoice',customers:'Customer contacts, vehicles and visit history',services:'Set service rates for private, taxi and commercial vehicles',inventory:'Track chemicals and consumables',purchases:'Record supplier purchases and stock received',expenses:'Daily, monthly and all-time business expenses',staff:'Staff profiles, monthly salaries and payments',reports:'Sales registers and Excel reports',offers:'Prepare WhatsApp offers for customers who agreed to receive them',settings:'Business profile, backups and connected cloud sync'})[p]||'';render()}
  function fy(d=today()){const x=new Date(d+'T00:00:00');let y=x.getFullYear();if(x.getMonth()+1<4)y--;return `${String(y).slice(-2)}-${String(y+1).slice(-2)}`}
  function nextInvoiceNo(date=today()){const prefix=(db.business.invoicePrefix||'CW').replace(/[^A-Za-z0-9-]/g,'').slice(0,4).toUpperCase()||'CW';const key=String(date).slice(2).replace(/-/g,'');const n=db.invoices.filter(x=>x.date===date).reduce((m,x)=>{const z=String(x.number||'').match(/-(\d{3,})$/);return Math.max(m,z?Number(z[1]):0)},0)+1;return `${prefix}-${key}-${String(n).padStart(3,'0')}`} async function reserveInvoiceNo(date=today()){try{if(window.WashDeskCloud?.nextInvoiceNumber)return await window.WashDeskCloud.nextInvoiceNumber({prefix:db.business.invoicePrefix||'CW',date,minNext:Number(nextInvoiceNo(date).match(/-(\d+)$/)?.[1]||1)});}catch(e){console.warn('Cloud invoice counter unavailable; using this device counter.',e)}return nextInvoiceNo(date)}
  function sum(a,fn){return a.reduce((s,x)=>s+(Number(fn?fn(x):x)||0),0)}
  function paid(i){return sum(db.payments.filter(p=>p.invoiceId===i.id),p=>p.amount)}
  function invoiceDue(i){return Math.max(0,Number(i.grandTotal)-paid(i))}
  function customerName(cid){return db.customers.find(c=>c.id===cid)?.name||'Walk-in customer'} function invoiceCustomerName(i){return i?.customerNameSnapshot||customerName(i?.customerId)}
  function productName(pid){return db.products.find(p=>p.id===pid)?.name||'Item'}
  function empty(title,desc,button){return `<div class="empty"><b>${esc(title)}</b>${esc(desc)}${button?`<div style="margin-top:14px"><button class="btn primary" data-action="${button.action}">${esc(button.label)}</button></div>`:''}</div>`}
  function pageHead(title,desc,actions=''){return `<div class="page-head"><div><h2>${title}</h2><p>${desc}</p></div><div class="actions">${actions}</div></div>`}
  function render(){const el=document.getElementById('app');const map={dashboard:dashboard,billing:billing,invoices:invoices,customers:customers,services:services,inventory:inventory,purchases:purchases,expenses:expenses,staff:staff,reports:reports,offers:offers,settings:settings};el.innerHTML=(map[page]||dashboard)();wirePage()}
  function stat(label,value,icon,note=''){return `<div class="stat"><div class="stat-top">${label}<span class="stat-icon">${icon}</span></div><div class="stat-value">${value}</div><div class="stat-note">${note}</div></div>`}
  function dashboard(){const t=today(),m=monthKey(),todayInv=db.invoices.filter(i=>i.date===t),monInv=db.invoices.filter(i=>monthKey(i.date)===m),todayExp=db.expenses.filter(e=>e.date===t),monthExp=db.expenses.filter(e=>monthKey(e.date)===m),sales=sum(monInv,i=>i.grandTotal),expMonth=sum(monthExp,e=>e.amount),expToday=sum(todayExp,e=>e.amount),cogs=sum(monInv,i=>i.stockCost||0),due=sum(db.invoices,invoiceDue),dueToday=sum(todayInv,invoiceDue),todaySales=sum(todayInv,i=>i.grandTotal);const recent=[...db.invoices].sort((a,b)=>b.createdAt-a.createdAt).slice(0,6);const low=db.products.filter(p=>Number(p.qty)<=Number(p.minQty||0));const days=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;return {key,label:d.toLocaleDateString('en-IN',{weekday:'short'}),v:sum(db.invoices.filter(x=>x.date===key),x=>x.grandTotal)}});const max=Math.max(1,...days.map(x=>x.v));return `${pageHead('Business overview','Today’s activity, payments and outstanding balances.',`<button class="btn" data-action="export">⬇ Backup</button><button class="btn primary" data-action="new-bill">＋ Create bill</button>`)}${(!db.business.name&&!db.invoices.length&&!db.customers.length)?`<div class="notice" style="margin-bottom:16px"><b>Restore your previous WashDesk records</b><br/>This updated app is a separate Android installation. Keep your old app, export its backup, then restore that JSON file here before creating new bills.<div style="margin-top:10px"><button class="btn primary" data-action="import">Restore previous backup</button></div></div>`:''}<div class="grid stats">${stat('Sales today',INR(todaySales),'↗',`${todayInv.length} bills today`)}${stat('Expenses today',INR(expToday),'⇩',`${todayExp.length} expense entries`)}${stat('Outstanding today',INR(dueToday),'◷','Balance on today’s bills')}${stat('Total outstanding',INR(due),'₹','All unpaid invoices')}${stat('Sales this month',INR(sales),'▤',`${monInv.length} invoices`)}${stat('Expenses this month',INR(expMonth),'⇣',`${monthExp.length} expense entries`)}</div><div class="grid two"><div class="card"><div class="card-head"><h3>Sales trend</h3><span>Last 7 days</span></div>${db.invoices.length?`<div class="chart">${days.map(d=>`<div class="bar-col" title="${esc(d.key)} · ${INR(d.v)}"><div class="bar" style="height:${Math.max(3,d.v/max*100)}%"></div><span class="bar-label">${d.label}</span></div>`).join('')}</div>`:empty('No sales yet','Your sales chart will appear after the first bill.')}</div><div class="card"><div class="card-head"><h3>Business snapshot</h3><span>${new Date().toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</span></div><div class="stock-alert"><span>Estimated operating surplus*</span><b>${INR(sales-expMonth-cogs)}</b></div><div class="stock-alert"><span>Vehicle visits this month</span><b>${monInv.length}</b></div><div class="stock-alert"><span>Customer accounts</span><b>${db.customers.length}</b></div><div class="stock-alert"><span>Staff members</span><b>${db.staff.length}</b></div><p class="help">*Management estimate after recorded expenses and estimated stock usage; not a statutory Profit & Loss statement.</p></div></div><div class="grid two" style="margin-top:16px"><div class="card"><div class="card-head"><h3>Recent invoices</h3><button class="btn small" data-nav="invoices">View all</button></div>${recent.length?`<div class="table-wrap"><table><thead><tr><th>Invoice</th><th>Customer</th><th>Date</th><th class="right">Amount</th><th>Status</th></tr></thead><tbody>${recent.map(i=>`<tr><td><button class="btn small" data-invoice="${i.id}">${esc(i.number)}</button></td><td>${esc(invoiceCustomerName(i))}</td><td>${esc(i.date)}</td><td class="right strong">${INR(i.grandTotal)}</td><td>${statusBadge(invoiceDue(i),i.grandTotal)}</td></tr>`).join('')}</tbody></table></div>`:empty('No invoices created','Create your first bill to start tracking business activity.',{action:'new-bill',label:'Create first bill'})}</div><div class="card"><div class="card-head"><h3>Low-stock alerts</h3><button class="btn small" data-nav="inventory">Manage stock</button></div>${low.length?low.slice(0,6).map(p=>`<div class="stock-alert"><div><b>${esc(p.name)}</b><div class="help">${esc(p.unit||'unit')} · Minimum ${p.minQty||0}</div></div><span class="badge red">${p.qty} left</span></div>`).join(''):empty('Stock looks good','Items below their minimum quantity will be listed here.')}</div></div>`}
  function statusBadge(due,total){if(due<=.009)return '<span class="badge green">Paid</span>';if(due>=Number(total)-.009)return '<span class="badge red">Unpaid</span>';return '<span class="badge amber">Partial</span>'}
  function billing(){const customerOptions=db.customers.map(c=>`<option value="${c.id}">${esc(c.name)} · ${esc(c.phone||'No phone')}</option>`).join('');const serviceOptions=db.services.map(s=>`<option value="${s.id}">${esc(s.name)} · ${INR(s.price)}</option>`).join('');const vehicleOptions=db.vehicles.map(v=>`<option value="${v.id}">${esc(v.number)} · ${esc(v.type)}</option>`).join('');return `${pageHead('Create a new bill','Select the customer, vehicle and services. Save the bill, then share it.','<button class="btn" data-nav="services">Manage services</button>')}<div class="invoice-layout"><div class="card"><div class="card-head"><h3>1. Customer & vehicle</h3><button class="btn small" data-action="quick-customer">＋ New customer</button></div><div class="field-grid"><div class="field"><label>Customer</label><select id="bill-customer"><option value="">Walk-in customer</option>${customerOptions}</select></div><div class="field"><label>Vehicle</label><select id="bill-vehicle"><option value="">Select vehicle (optional)</option>${vehicleOptions}</select></div><div class="field"><label>Vehicle number (if new)</label><input id="bill-number" placeholder="e.g. GJ05AB1234" /></div><div class="field"><label>Vehicle class</label><select id="bill-type"><option>Private Car</option><option>Taxi</option><option>Commercial Vehicle</option><option>SUV</option><option>Two Wheeler</option><option>Other</option></select></div><div class="field"><label>Odometer (optional)</label><input id="bill-odo" type="number" min="0" placeholder="Kilometres" /></div><div class="field"><label>Assigned staff</label><select id="bill-staff"><option value="">Not assigned</option>${db.staff.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div></div><div style="height:20px"></div><div class="card-head"><h3>2. Add services or products</h3><span>${db.services.length} services configured</span></div><div class="line-add"><div class="field"><label>Service / product</label><select id="line-item"><option value="">Choose an item</option><optgroup label="Services">${serviceOptions}</optgroup><optgroup label="Inventory products">${db.products.map(p=>`<option value="product:${p.id}">${esc(p.name)} · ${INR(p.sellPrice||0)}</option>`).join('')}</optgroup></select></div><div class="field"><label>Quantity</label><input id="line-qty" type="number" min=".01" step=".01" value="1" /></div><div class="field"><label>Discount (₹)</label><input id="line-discount" type="number" min="0" step=".01" value="0" /></div><button class="btn primary" id="add-line">Add</button></div><div style="height:14px"></div><div id="bill-lines">${billLines.length?billLineTable():empty('No items added','Add at least one service or product to build the bill.')}</div><div class="field-grid" style="margin-top:18px"><div class="field"><label>Overall discount (₹)</label><input id="bill-discount" type="number" min="0" step=".01" value="0" /></div><div class="field"><label>Payment received now (₹)</label><input id="bill-paid" type="number" min="0" step=".01" value="0" /></div><div class="field"><label>Payment mode</label><select id="bill-mode"><option>Cash</option><option>UPI</option><option>Card</option><option>Bank Transfer</option><option>Credit</option><option>Mixed</option></select></div><div class="field"><label>Service notes</label><input id="bill-notes" placeholder="Optional notes" /></div></div><div class="notice" style="margin-top:15px">Tax rates are taken from each service/product. Confirm your GST registration, SAC/HSN and applicable rates with your accountant before issuing tax invoices.</div><div class="form-actions"><button class="btn" data-action="clear-bill">Clear</button><button class="btn primary" data-action="save-bill" ${billLines.length?'':'disabled'}>Save invoice</button></div></div><div class="card"><div class="card-head"><h3>3. Bill summary</h3><span>Live calculation</span></div><div id="bill-summary">${billSummary()}</div><div class="success-note" style="margin-top:18px"><b>WhatsApp sharing</b><br/>After saving, use Share bill. On supported phones, the PDF can be shared from the Android share sheet. Otherwise, the app opens WhatsApp with the invoice details ready to send.</div></div></div>`}
  function billLineTable(){return `<div class="table-wrap"><table><thead><tr><th>Item</th><th>Qty</th><th class="right">Rate</th><th class="right">Amount</th><th></th></tr></thead><tbody>${billLines.map((l,i)=>`<tr><td>${esc(l.name)}<div class="help">${l.kind==='service'?'Service':'Product'} · GST ${l.taxRate||0}%</div></td><td>${l.qty}</td><td class="right">${INR(l.rate)}</td><td class="right strong">${INR(l.amount)}</td><td><button class="btn small danger" data-remove-line="${i}">×</button></td></tr>`).join('')}</tbody></table></div>`}
  function calcLines(lines=billLines,discount=0){const gross=sum(lines,l=>l.qty*l.rate);const lineDisc=sum(lines,l=>l.discount||0);const preTaxable=Math.max(0,gross-lineDisc);const overall=Math.min(preTaxable,Math.max(0,Number(discount)||0));const taxable=Math.max(0,preTaxable-overall);let tax=0;for(const l of lines){const lineBase=Math.max(0,l.qty*l.rate-(l.discount||0));const share=preTaxable>0?overall*lineBase/preTaxable:0;const lineTaxable=Math.max(0,lineBase-share);const rate=db.business.registered?Number(l.taxRate)||0:0;tax+=lineTaxable*rate/100}return {gross,lineDisc,overall,taxable,tax,grand:taxable+tax}}
  function billSummary(){const x=calcLines();const d=Number(document.getElementById('bill-discount')?.value||0);const y=calcLines(billLines,d);const due=Math.max(0,y.grand-Number(document.getElementById('bill-paid')?.value||0));return `<div class="totals"><div class="total-line"><span>Items subtotal</span><b>${INR(y.gross)}</b></div><div class="total-line"><span>Item discounts</span><b>− ${INR(y.lineDisc)}</b></div><div class="total-line"><span>Overall discount</span><b>− ${INR(y.overall)}</b></div><div class="total-line"><span>Taxable value (approx.)</span><b>${INR(y.taxable)}</b></div><div class="total-line"><span>GST total</span><b>${INR(y.tax)}</b></div><div class="total-line final"><span>Grand total</span><span>${INR(y.grand)}</span></div><div class="total-line"><span>Due after payment</span><b class="${due>0?'':'muted'}">${INR(due)}</b></div></div>`}
  function invoices(){const rows=[...db.invoices].sort((a,b)=>b.createdAt-a.createdAt);return `${pageHead('Invoices','Search, review, print and share every saved invoice.','<button class="btn primary" data-action="new-bill">＋ New bill</button>')}<div class="card"><div class="toolbar"><div class="search"><input id="invoice-search" placeholder="Search invoice, customer or vehicle number…" /></div><input class="btn" style="padding:8px" type="month" id="invoice-month" value="${monthKey()}" /><button class="btn" data-action="clear-invoice-filter">All dates</button></div><div id="invoice-table">${invoiceTable(rows)}</div></div>`}
  function invoiceTable(rows){return rows.length?`<div class="table-wrap"><table><thead><tr><th>Invoice no.</th><th>Date</th><th>Customer</th><th>Vehicle</th><th class="right">Total</th><th class="right">Due</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows.map(i=>`<tr><td class="strong">${esc(i.number)}</td><td>${esc(i.date)}</td><td>${esc(invoiceCustomerName(i))}</td><td>${esc(i.vehicleNumber||'—')}</td><td class="right">${INR(i.grandTotal)}</td><td class="right">${INR(invoiceDue(i))}</td><td>${statusBadge(invoiceDue(i),i.grandTotal)}</td><td><button class="btn small" data-invoice="${i.id}">View</button> <button class="btn small" data-edit-invoice="${i.id}">Edit</button> <button class="btn small" data-share="${i.id}">Share</button></td></tr>`).join('')}</tbody></table></div>`:empty('No invoices found','Create a bill or adjust the search filter.')}
  function customers(){const rows=[...db.customers].sort((a,b)=>a.name.localeCompare(b.name));return `${pageHead('Customers & vehicles','Customer contacts, visit history and WhatsApp offer preferences.','<button class="btn primary" data-action="add-customer">＋ Add customer</button>')}<div class="card"><div class="toolbar"><div class="search"><input id="customer-search" placeholder="Search name, phone or vehicle…" /></div><span class="badge">${rows.length} customers</span></div><div id="customer-table">${customerTable(rows)}</div><p class="help" style="margin-top:12px">Only customers marked as agreed to receive WhatsApp offers are included in offer campaigns. You can change this preference from the Offer permission column.</p></div>`}
  function customerTable(rows){return rows.length?`<div class="table-wrap"><table><thead><tr><th>Customer</th><th>Phone</th><th>Vehicles</th><th>Visits</th><th class="right">Billed</th><th class="right">Due</th><th>Offer permission</th><th>Action</th></tr></thead><tbody>${rows.map(c=>{const inv=db.invoices.filter(i=>i.customerId===c.id);return `<tr><td><b>${esc(c.name)}</b><div class="help">${esc(c.city||'')}</div></td><td>${esc(c.phone||'—')}</td><td>${db.vehicles.filter(v=>v.customerId===c.id).map(v=>esc(v.number)).join(', ')||'—'}</td><td>${inv.length}</td><td class="right">${INR(sum(inv,i=>i.grandTotal))}</td><td class="right">${INR(sum(inv,invoiceDue))}</td><td><button class="btn small ${c.waOptIn?'primary':''}" data-wa-toggle="${c.id}">${c.waOptIn?'✓ Opted in':'Not opted in'}</button></td><td><button class="btn small" data-customer="${c.id}">View</button></td></tr>`}).join('')}</tbody></table></div>`:empty('No customers yet','Add customers to build visit history and link vehicles.',{action:'add-customer',label:'Add first customer'})}
  function services(){return `${pageHead('Services & packages','Configure rates for private cars, taxis and commercial vehicles.','<button class="btn primary" data-action="add-service">＋ Add service</button>')}<div class="card"><div class="table-wrap">${db.services.length?`<table><thead><tr><th>Service</th><th>Category</th><th>Vehicle class</th><th>SAC</th><th>GST</th><th class="right">Rate</th><th>Action</th></tr></thead><tbody>${db.services.map(s=>`<tr><td><b>${esc(s.name)}</b><div class="help">${esc(s.description||'')}</div></td><td>${esc(s.category||'Wash')}</td><td>${esc(s.vehicleClass||'All')}</td><td>${esc(s.sac||'—')}</td><td>${Number(s.taxRate)||0}%</td><td class="right strong">${INR(s.price)}<div class="help">${s.prices?.private!=null?'Private '+INR(s.prices.private)+' · ':''}${s.prices?.taxi!=null?'Taxi '+INR(s.prices.taxi)+' · ':''}${s.prices?.commercial!=null?'Commercial '+INR(s.prices.commercial):''}</div></td><td><button class="btn small" data-edit-service="${s.id}">Edit</button> <button class="btn small danger" data-delete-service="${s.id}">Delete</button></td></tr>`).join('')}</tbody></table>`:empty('No services configured','Add your standard wash services and prices. Use your actual rates and tax details.',{action:'add-service',label:'Add first service'})}</div></div><div class="notice" style="margin-top:14px">Package/AMC note: prepaid wash-pass sale and redemption tracking are planned for the next module. Do not record prepaid passes as ordinary completed washes in this starter version.</div>`}
  function inventory(){return `${pageHead('Inventory','Track shampoo, foam, tyre polish, microfiber, wax and other consumables.','<button class="btn" data-action="stock-adjust">± Adjust stock</button><button class="btn primary" data-action="add-product">＋ Add item</button>')}<div class="card"><div class="toolbar"><div class="search"><input id="stock-search" placeholder="Search stock item…" /></div><span class="badge">${db.products.length} items</span></div><div id="stock-table">${stockTable(db.products)}</div></div>`}
  function stockTable(rows){return rows.length?`<div class="table-wrap"><table><thead><tr><th>Item</th><th>SKU</th><th>Current stock</th><th>Minimum</th><th>Unit cost</th><th class="right">Stock value</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows.map(p=>`<tr><td><b>${esc(p.name)}</b><div class="help">${esc(p.category||'Consumable')}</div></td><td>${esc(p.sku||'—')}</td><td>${p.qty} ${esc(p.unit||'unit')}</td><td>${p.minQty||0}</td><td>${INR(p.cost||0)}</td><td class="right">${INR(p.qty*p.cost)}</td><td>${Number(p.qty)<=Number(p.minQty||0)?'<span class="badge red">Low stock</span>':'<span class="badge green">In stock</span>'}</td><td><button class="btn small" data-edit-product="${p.id}">Edit</button></td></tr>`).join('')}</tbody></table></div>`:empty('No inventory items','Add products and consumables to track purchase quantity and stock value.',{action:'add-product',label:'Add first item'})}
  function purchases(){return `${pageHead('Purchases','Record stock received from suppliers. Purchase entries increase inventory.','<button class="btn primary" data-action="add-purchase">＋ Record purchase</button>')}<div class="card"><div class="table-wrap">${db.purchases.length?`<table><thead><tr><th>Date</th><th>Supplier</th><th>Item</th><th>Quantity</th><th class="right">Total</th><th>Payment</th></tr></thead><tbody>${[...db.purchases].sort((a,b)=>b.createdAt-a.createdAt).map(p=>`<tr><td>${esc(p.date)}</td><td>${esc(p.supplier)}</td><td>${esc(productName(p.productId))}</td><td>${p.qty} ${esc(db.products.find(x=>x.id===p.productId)?.unit||'')}</td><td class="right strong">${INR(p.total)}</td><td>${esc(p.paymentMode)}</td></tr>`).join('')}</tbody></table>`:empty('No purchases recorded','Record a purchase when stock arrives.',{action:'add-purchase',label:'Record first purchase'})}</div></div>`}
  function expenses(){const t=today(),m=monthKey(),todayItems=db.expenses.filter(e=>e.date===t),monthItems=db.expenses.filter(e=>monthKey(e.date)===m);return `${pageHead('Expenses','Daily spending, monthly costs and the full expense book.','<button class="btn primary" data-action="add-expense">＋ Add expense</button>')}<div class="grid stats">${stat('Today',INR(sum(todayItems,e=>e.amount)),'₹',`${todayItems.length} entries`)}${stat('This month',INR(sum(monthItems,e=>e.amount)),'▤',`${monthItems.length} entries`)}${stat('All time',INR(sum(db.expenses,e=>e.amount)),'∑',`${db.expenses.length} entries`)}</div><div class="card"><div class="toolbar"><b>Expense book</b><span class="muted" style="font-size:11px">Salary payments are included here automatically.</span></div><div class="table-wrap">${db.expenses.length?`<table><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Paid to</th><th>Mode</th><th class="right">Amount</th><th></th></tr></thead><tbody>${[...db.expenses].sort((a,b)=>String(b.date).localeCompare(String(a.date))||(b.createdAt||0)-(a.createdAt||0)).map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.category)}</td><td>${esc(e.note||'—')}</td><td>${esc(e.paidTo||'—')}</td><td>${esc(e.mode||'—')}</td><td class="right strong">${INR(e.amount)}</td><td><button class="btn small danger" data-delete-expense="${e.id}">Delete</button></td></tr>`).join('')}</tbody></table>`:empty('No expenses recorded','Start recording expenses to understand your daily and monthly operating costs.',{action:'add-expense',label:'Add first expense'})}</div></div>`}
  function staffSalaryPaid(staffId,month=monthKey()){return sum(db.expenses.filter(e=>e.category==='Salary'&&e.staffId===staffId&&(e.salaryMonth||monthKey(e.date))===month),e=>e.amount)}
  function staffSalaryDue(st,month=monthKey()){return Math.max(0,Number(st.salary||0)-staffSalaryPaid(st.id,month))}
  function staff(){const m=monthKey();return `${pageHead('Staff','Staff directory, monthly salary, salary paid and remaining balance.','<button class="btn primary" data-action="add-staff">＋ Add staff</button>')}<div class="card"><div class="table-wrap">${db.staff.length?`<table><thead><tr><th>Name</th><th>Role</th><th>Phone</th><th class="right">Monthly salary</th><th class="right">Paid this month</th><th class="right">Salary balance</th><th>Actions</th></tr></thead><tbody>${db.staff.map(st=>`<tr><td><b>${esc(st.name)}</b></td><td>${esc(st.role||'—')}</td><td>${esc(st.phone||'—')}</td><td class="right">${INR(st.salary||0)}</td><td class="right">${INR(staffSalaryPaid(st.id,m))}</td><td class="right strong">${INR(staffSalaryDue(st,m))}</td><td><button class="btn small" data-edit-staff="${st.id}">Edit</button> <button class="btn small primary" data-pay-salary="${st.id}">Pay salary</button> <button class="btn small danger" data-delete-staff="${st.id}">Remove</button></td></tr>`).join('')}</tbody></table>`:empty('No staff listed','Add washers, detailers, supervisors or cashiers.',{action:'add-staff',label:'Add staff'})}</div><p class="help" style="margin-top:12px">Use Pay salary to record actual payment. Every salary payment is also added to the Expenses book under Salary, so it appears in daily and monthly expense totals. Salary balance is an estimate from the monthly salary less recorded payments.</p></div>`}
  function reports(){const m=document.getElementById('report-month')?.value||monthKey();const inv=db.invoices.filter(i=>monthKey(i.date)===m),ex=db.expenses.filter(e=>monthKey(e.date)===m);const sales=sum(inv,i=>i.grandTotal),expensesTotal=sum(ex,e=>e.amount),cogs=sum(inv,i=>i.stockCost||0),collected=sum(inv,i=>paid(i));const grouped={};inv.forEach(i=>(i.lines||[]).forEach(l=>grouped[l.name]=(grouped[l.name]||0)+l.qty));const popular=Object.entries(grouped).sort((a,b)=>b[1]-a[1]).slice(0,5);return `${pageHead('Sales & business reports','Choose a month and export a complete multi-sheet Excel workbook for review or sharing.','<button class="btn primary" data-action="export-excel">⬇ Export Excel workbook</button>')}<div class="card" style="margin-bottom:16px"><div class="toolbar"><label class="muted" style="font-size:12px;font-weight:700">Report month</label><input type="month" id="report-month" value="${m}" /></div><div class="grid stats" style="margin:0">${stat('Sales',INR(sales),'₹',`${inv.length} invoices`)}${stat('Payments received',INR(collected),'✓','Collections against these invoices')}${stat('Expenses',INR(expensesTotal),'⇩',`${ex.length} entries, including salary`)}${stat('Estimated surplus',INR(sales-expensesTotal-cogs),'∑','After recorded expenses and estimated stock cost')}</div></div><div class="grid two"><div class="card"><div class="card-head"><h3>Expense categories</h3><span>${m}</span></div>${ex.length?`<div class="table-wrap"><table><thead><tr><th>Category</th><th class="right">Amount</th></tr></thead><tbody>${Object.entries(ex.reduce((a,e)=>(a[e.category]=(a[e.category]||0)+Number(e.amount),a),{})).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="right strong">${INR(v)}</td></tr>`).join('')}</tbody></table></div>`:empty('No expenses in this month','Expense categories will appear here.')}</div><div class="card"><div class="card-head"><h3>Most-used services / items</h3><span>${m}</span></div>${popular.length?popular.map(([k,v])=>`<div class="stock-alert"><span>${esc(k)}</span><b>${v} qty</b></div>`).join(''):empty('No billed items','Items will appear after creating invoices.')}</div></div><div class="success-note" style="margin-top:16px">The Excel file includes Sales Register, Daily Summary, Expenses and Staff Salary sheets, with invoice totals, payments received, balance due and customer/vehicle details.</div><div class="notice" style="margin-top:14px">Important: this is an operational management report, not a double-entry Tally ledger, audited Profit & Loss, Balance Sheet, GST return or tax filing report.</div>`}

ions</h3><span>Customers with mobile numbers</span></div><div class="table-wrap">${withPhone.length?`<table><thead><tr><th>Customer</th><th>Mobile</th><th>Offer permission</th><th>Action</th></tr></thead><tbody>${withPhone.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.phone)}</td><td>${c.waOptIn?'<span class="badge green">Opted in</span>':'<span class="badge amber">Not opted in</span>'}</td><td><button class="btn small ${c.waOptIn?'':'primary'}" data-wa-toggle="${c.id}">${c.waOptIn?'Remove permission':'Mark opted in'}</button></td></tr>`).join('')}</tbody></table>`:empty('No mobile numbers found','Add customer mobile numbers to prepare WhatsApp offers.')}</div></div>`}
  function startOfferCampaign(){offerDraft=String(document.getElementById('offer-message')?.value||'').trim();if(!offerDraft){notify('Write the offer message first.');return}offerQueue=db.customers.filter(c=>c.waOptIn&&offerPhone(c.phone).length>=11);offerIndex=0;if(!offerQueue.length){notify('No customers with a mobile number and offer permission. Update permissions in Customers.');return}openOfferCampaign()}

    function settings(){const b=db.business,cfg=window.WashDeskCloud?.getConfig?.()||{},cloudStatus=window.WashDeskCloud?.getStatus?.()||'Not connected';return `${pageHead('Business settings','Manage your business profile, backups and multi-device sync.','<button class="btn" data-action="export">⬇ Export backup</button><button class="btn" data-action="import">⬆ Restore backup</button>')}<div class="settings-grid"><div class="card"><div class="card-head"><h3>Business profile</h3></div><form id="business-form"><div class="field-grid"><div class="field full"><label>Business / washing centre name *</label><input name="name" required value="${esc(b.name)}" placeholder="Prime Auto Care" /></div><div class="field"><label>Phone number</label><input name="phone" value="${esc(b.phone)}" placeholder="+91…" /></div><div class="field"><label>Email</label><input name="email" type="email" value="${esc(b.email)}" /></div><div class="field full"><label>Business address</label><textarea name="address">${esc(b.address)}</textarea></div><div class="field"><label>City</label><input name="city" value="${esc(b.city)}" /></div><div class="field"><label>State</label><input name="state" value="${esc(b.state)}" /></div><div class="field"><label>State code</label><input name="stateCode" value="${esc(b.stateCode)}" placeholder="24" /></div><div class="field"><label>Invoice prefix (max 4 chars)</label><input name="invoicePrefix" maxlength="4" value="${esc(b.invoicePrefix)}" /></div><div class="field full"><label>UPI ID (optional)</label><input name="upi" value="${esc(b.upi)}" placeholder="business@upi" /></div><div class="field full"><label>Invoice footer / terms</label><textarea name="terms">${esc(b.terms)}</textarea></div></div><div class="form-actions"><button class="btn primary">Save business profile</button></div></form></div><div class="card"><div class="card-head"><h3>GST & invoice setup</h3></div><form id="tax-form"><div class="field-grid"><div class="field full"><label>GST registration</label><select name="registered"><option value="false" ${b.registered?'':'selected'}>Not registered / do not show GSTIN</option><option value="true" ${b.registered?'selected':''}>GST registered</option></select></div><div class="field full"><label>GSTIN</label><input name="gstin" value="${esc(b.gstin)}" maxlength="15" placeholder="15-character GSTIN" /></div></div><div class="notice" style="margin-top:14px">For registered businesses, tax invoices need prescribed supplier, serial number, date, recipient, SAC/HSN, description, taxable value and tax details. Confirm all tax settings with your CA. The app does not file GST returns or generate IRN e-invoices.</div><div class="form-actions"><button class="btn primary">Save tax settings</button></div></form></div><div class="card"><div class="card-head"><h3>Data protection & backup</h3></div><div class="success-note">Your records remain saved on this device. On Android, Download full backup saves the JSON file to <b>Files → Downloads → WashDesk</b>. On a browser or laptop, check the browser Downloads folder.</div><div class="actions" style="margin-top:14px"><button class="btn primary" data-action="export">Download full backup</button><button class="btn" data-action="import">Restore backup</button></div><p class="help" style="margin-top:12px">Keep a backup before changing or reinstalling the app. A backup is portable and can be restored on another device.</p></div><div class="card"><div class="card-head"><h3>Cloud Sync · ${esc(cloudStatus)}</h3></div><div class="notice">To sync four phones and your laptop, connect all devices to the same private cloud project and sign in with the same account. Your app continues to save locally while offline and uploads queued changes when the internet returns.</div><form id="cloud-form" style="margin-top:14px"><div class="field-grid"><div class="field full"><label>Supabase Project URL</label><input name="url" type="url" required value="${esc(cfg.url||'')}" placeholder="https://your-project.supabase.co" /></div><div class="field full"><label>Supabase anon / publishable key</label><input name="anonKey" required value="${esc(cfg.anonKey||'')}" placeholder="Public anon key from Supabase project settings" /></div><div class="field"><label>Shared account email</label><input name="email" type="email" required placeholder="you@example.com" /></div></div><div class="actions" style="margin-top:12px"><button class="btn primary">Send email sign-in code</button><button type="button" class="btn" data-action="cloud-sync-now">Sync now</button><button type="button" class="btn ghost" data-action="cloud-disconnect">Disconnect this device</button></div></form><form id="cloud-otp-form" class="${cloudOtpPending?'':'hide'}" style="margin-top:14px"><div class="field"><label>Six-digit email sign-in code</label><input name="token" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required placeholder="Code sent to ${esc(cloudOtpEmail||cfg.email||'your Gmail')}" /></div><div class="actions" style="margin-top:10px"><button class="btn primary">Verify code & connect this device</button></div></form><p class="help" style="margin-top:12px">One-time cloud setup: create a Supabase project, run the SQL setup file below once in its SQL Editor, then enter the same project URL, public key and Gmail address on all devices. Supabase email templates must deliver the six-digit token. Do not share your account password or service-role key.</p><p style="font-size:12px"><a href="./cloud-sync-setup.sql" download>Download Cloud Sync SQL setup file</a> · <a href="https://supabase.com/dashboard" target="_blank" rel="noopener">Open Supabase Dashboard</a></p></div><div class="card"><div class="card-head"><h3>System status</h3></div><div class="stock-alert"><span>Local storage</span><b>Active</b></div><div class="stock-alert"><span>Offline install</span><b id="pwa-status">Checking…</b></div><div class="stock-alert"><span>WhatsApp offers</span><b>Manual send / opt-in</b></div><div class="stock-alert"><span>Cloud status</span><b>${esc(cloudStatus)}</b></div><div class="help" style="margin-top:10px">Cloud data is protected by row-level security so each shared login sees only its own WashDesk records. All devices must use the same project and login.</div></div></div>`}
  function wirePage(){document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.nav)));if(page==='billing'){document.getElementById('add-line')?.addEventListener('click',addLine);document.getElementById('bill-discount')?.addEventListener('input',updateBillSummary);document.getElementById('bill-paid')?.addEventListener('input',updateBillSummary)}if(page==='invoices'){document.getElementById('invoice-search')?.addEventListener('input',filterInvoices);document.getElementById('invoice-month')?.addEventListener('change',filterInvoices)}if(page==='customers')document.getElementById('customer-search')?.addEventListener('input',filterCustomers);if(page==='inventory')document.getElementById('stock-search')?.addEventListener('input',filterStock);if(page==='reports')document.getElementById('report-month')?.addEventListener('change',()=>render());document.getElementById('business-form')?.addEventListener('submit',saveBusiness);document.getElementById('tax-form')?.addEventListener('submit',saveTax);document.getElementById('cloud-form')?.addEventListener('submit',connectCloud);document.getElementById('cloud-otp-form')?.addEventListener('submit',verifyCloudOtp);document.getElementById('pwa-status')&&(document.getElementById('pwa-status').textContent=('serviceWorker' in navigator)?'Supported':'Not supported')}
  function addLine(){const val=document.getElementById('line-item').value;const qty=Number(document.getElementById('line-qty').value);const disc=Number(document.getElementById('line-discount').value||0);if(!val||qty<=0||disc<0){notify('Choose an item and enter valid quantity and discount.');return}let l;if(val.startsWith('product:')){const p=db.products.find(x=>x.id===val.slice(8));if(!p)return;if(qty>Number(p.qty)){notify(`Only ${p.qty} ${p.unit||'units'} available.`);return}l={kind:'product',refId:p.id,name:p.name,qty,rate:Number(p.sellPrice||0),taxRate:db.business.registered?Number(p.taxRate||0):0,sac:p.hsn||'',discount:disc,unit:p.unit||'unit',cost:Number(p.cost||0)}}else{const svc=db.services.find(x=>x.id===val);if(!svc)return;const vtype=document.getElementById('bill-type')?.value||'Private Car';const key=({'Private Car':'private','Taxi':'taxi','Commercial Vehicle':'commercial','SUV':'suv'})[vtype]||'private';const custom=svc.prices?.[key];const rate=custom!==undefined&&custom!==null&&custom!==''?Number(custom):Number(svc.price||0);l={kind:'service',refId:svc.id,name:svc.name,qty,rate,taxRate:db.business.registered?Number(svc.taxRate||0):0,sac:svc.sac||'',discount:disc,unit:'service',consumption:svc.consumption||[]}}if(disc>qty*l.rate){notify('Line discount cannot exceed that line amount.');return}l.amount=Math.max(0,l.qty*l.rate-l.discount);billLines.push(l);document.getElementById('bill-lines').innerHTML=billLineTable();document.querySelector('[data-action="save-bill"]').disabled=false;document.getElementById('line-item').value='';document.getElementById('line-qty').value='1';document.getElementById('line-discount').value='0';updateBillSummary()}  function updateBillSummary(){document.getElementById('bill-summary').innerHTML=billSummary()}
  async function saveBill(){if(billSaving){notify('This bill is already being saved.');return}if(!billLines.length){notify('Add at least one service or product.');return}let custId=document.getElementById('bill-customer').value||null;const vehicleId=document.getElementById('bill-vehicle').value||null;const selectedVehicle=db.vehicles.find(v=>v.id===vehicleId);if(selectedVehicle&&!custId)custId=selectedVehicle.customerId;if(selectedVehicle&&custId&&selectedVehicle.customerId!==custId){notify('The selected vehicle does not belong to this customer.');return}const number=(document.getElementById('bill-number').value||selectedVehicle?.number||'').trim().toUpperCase();const type=document.getElementById('bill-type').value;const discount=Number(document.getElementById('bill-discount').value||0);const calc=calcLines(billLines,discount);const amountPaid=Number(document.getElementById('bill-paid').value||0);if(discount<0||discount>calc.gross-calc.lineDisc+.009){notify('Overall discount cannot exceed the remaining item value.');return}if(amountPaid<0||amountPaid>calc.grand+.009){notify('Payment received cannot be more than the bill total.');return}const required={};billLines.forEach(l=>{if(l.kind==='product')required[l.refId]=(required[l.refId]||0)+l.qty;else (l.consumption||[]).forEach(u=>required[u.productId]=(required[u.productId]||0)+Number(u.qtyPerService||0)*l.qty)});for(const [pid,qty] of Object.entries(required)){const p=db.products.find(x=>x.id===pid);if(p&&qty>Number(p.qty)+.000001){notify(`Not enough stock for ${p.name}. Required ${qty}; available ${p.qty}.`);return}}billSaving=true;const saveButton=document.querySelector('[data-action="save-bill"]');if(saveButton)saveButton.disabled=true;const stockCost=applyConsumption(billLines);const cust=db.customers.find(c=>c.id===custId);const biz=JSON.parse(JSON.stringify(db.business));const invoiceDate=today(),invoiceNumber=await reserveInvoiceNo(invoiceDate);const inv={id:id(),number:invoiceNumber,financialYear:fy(invoiceDate),date:invoiceDate,createdAt:Date.now(),businessSnapshot:biz,gstRegistered:!!biz.registered,businessState:biz.state,customerId:custId,customerNameSnapshot:cust?.name||'Walk-in customer',customerState:cust?.state||biz.state,customerGstin:cust?.gstin||'',customerAddress:cust?.address||'',customerCity:cust?.city||'',vehicleId,vehicleNumber:number,vehicleType:type,odometer:document.getElementById('bill-odo').value,staffId:document.getElementById('bill-staff').value||null,staffNameSnapshot:db.staff.find(st=>st.id===document.getElementById('bill-staff').value)?.name||'',lines:JSON.parse(JSON.stringify(billLines)),discount,subtotal:calc.gross,lineDiscount:calc.lineDisc,taxable:calc.taxable,tax:calc.tax,grandTotal:calc.grand,stockCost,notes:document.getElementById('bill-notes').value||'',paymentMode:document.getElementById('bill-mode').value};db.invoices.push(inv);if(amountPaid>0)db.payments.push({id:id(),invoiceId:inv.id,date:today(),amount:amountPaid,mode:inv.paymentMode,createdAt:Date.now()});if(custId&&number&&!selectedVehicle&&!db.vehicles.some(v=>v.number.toUpperCase()===number)){db.vehicles.push({id:id(),customerId:custId,number,type,createdAt:Date.now()})}save();billLines=[];billSaving=false;setPage('invoices');openInvoice(inv.id);notify('Invoice saved successfully.')}
  function applyConsumption(lines){let cost=0;lines.forEach(l=>{if(l.kind==='product'){const p=db.products.find(x=>x.id===l.refId);if(p){p.qty=Math.max(0,Number(p.qty)-l.qty);cost+=l.qty*Number(p.cost||0)}}if(l.kind==='service'){(l.consumption||[]).forEach(u=>{const p=db.products.find(x=>x.id===u.productId);if(p){const q=Number(u.qtyPerService||0)*l.qty;p.qty=Math.max(0,Number(p.qty)-q);cost+=q*Number(p.cost||0)}})}});return cost}
  function filterInvoices(){const q=(document.getElementById('invoice-search').value||'').toLowerCase();const m=document.getElementById('invoice-month').value;let rows=[...db.invoices].filter(i=>(!m||monthKey(i.date)===m)&&[i.number,i.vehicleNumber,invoiceCustomerName(i)].join(' ').toLowerCase().includes(q)).sort((a,b)=>b.createdAt-a.createdAt);document.getElementById('invoice-table').innerHTML=invoiceTable(rows)}

  function payStaffSalaryForm(staffId){const st=db.staff.find(x=>x.id===staffId);if(!st)return;const month=monthKey(),paidNow=staffSalaryPaid(staffId,month),suggested=Math.max(0,Number(st.salary||0)-paidNow);openModal(`Pay salary · ${esc(st.name)}`,`<p class="muted" style="font-size:12px">Monthly salary: <b>${INR(st.salary||0)}</b> · Already paid this month: <b>${INR(paidNow)}</b></p><form id="salary-form"><div class="field-grid"><div class="field"><label>Salary month</label><input name="salaryMonth" type="month" value="${month}" required /></div><div class="field"><label>Payment date</label><input name="date" type="date" value="${today()}" required /></div><div class="field"><label>Amount paid (₹)</label><input name="amount" type="number" min=".01" step=".01" value="${suggested||Number(st.salary)||''}" required /></div><div class="field"><label>Payment mode</label><select name="mode"><option>Cash</option><option>UPI</option><option>Bank Transfer</option><option>Card</option></select></div><div class="field full"><label>Note</label><input name="note" placeholder="Salary / advance / part payment" /></div></div><div class="form-actions"><button type="button" class="btn" id="cancel-modal">Cancel</button><button class="btn primary">Record salary payment</button></div></form>`);document.getElementById('salary-form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target),amount=Number(f.get('amount'));if(amount<=0){notify('Enter a valid salary payment.');return}db.expenses.push({id:id(),date:String(f.get('date')),category:'Salary',amount,paidTo:st.name,staffId:st.id,salaryMonth:String(f.get('salaryMonth')),mode:String(f.get('mode')),note:String(f.get('note')||'Monthly salary'),createdAt:Date.now()});save();closeModal();render();notify('Salary payment recorded in Staff and Expenses.')})}

  async function exportBackup(){try{const blob=new Blob([JSON.stringify({app:'Prime Auto Care',version:3,exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'}),filename=`prime-auto-care-backup-${today()}.json`;if(window.WashDeskFileSharer?.save){await window.WashDeskFileSharer.save({filename,contentType:'application/json',base64Data:await blobAsDataUrl(blob),android:{saveDirectory:'downloads',relativePath:'Download/WashDesk'}});notify('Backup saved: Files app → Downloads → Prime Auto Care.')}else{downloadBlob(blob,filename);notify('Backup downloaded. Check your browser Downloads folder.')}}catch(e){console.error(e);notify(e?.message||'Backup could not be saved. Please retry.')}}
  function downloadBlob(blob,name){const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
  function importBackup(){const inp=document.createElement('input');inp.type='file';inp.accept='application/json,.json';inp.onchange=()=>{const file=inp.files?.[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const parsed=JSON.parse(r.result);const candidate=parsed.data||parsed;if(!candidate.business||!Array.isArray(candidate.invoices)||!Array.isArray(candidate.products))throw new Error('Invalid backup');if(!confirm('Restore this backup and replace the data currently saved in this browser?'))return;db=Object.assign(blank(),candidate);save();setPage('dashboard');notify('Backup restored.')}catch(e){notify('Could not restore: invalid backup file.')}};r.readAsText(file)};inp.click()}
  function exportCsv(){const rows=[['Invoice','Date','Customer','Vehicle','Total','Paid','Due'],...db.invoices.map(i=>[i.number,i.date,invoiceCustomerName(i),i.vehicleNumber,i.grandTotal,paid(i),invoiceDue(i)])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),`prime-auto-care-invoices-${today()}.csv`)}

  function exportSalesExcel(){const m=document.getElementById('report-month')?.value||monthKey(),invoices=db.invoices.filter(i=>monthKey(i.date)===m),expenseRows=db.expenses.filter(e=>monthKey(e.date)===m);const sales=invoices.map(i=>({Invoice:i.number,Date:i.date,Customer:invoiceCustomerName(i),Mobile:db.customers.find(c=>c.id===i.customerId)?.phone||'',Vehicle:i.vehicleNumber||'',VehicleClass:i.vehicleType||'',Items:(i.lines||[]).map(l=>`${l.name} × ${l.qty}`).join('; '),Subtotal:Number(i.subtotal)||0,'Line Discounts':Number(i.lineDiscount)||0,'Bill Discount':Number(i.discount)||0,'Taxable Value':Number(i.taxable)||0,GST:Number(i.tax)||0,'Grand Total':Number(i.grandTotal)||0,Paid:paid(i),'Balance Due':invoiceDue(i),'Payment Mode':i.paymentMode||'',Staff:db.staff.find(st=>st.id===i.staffId)?.name||'',Notes:i.notes||''}));const dailyMap={};invoices.forEach(i=>{const d=i.date;dailyMap[d]??={Date:d,'Bills Count':0,Sales:0,'Payments Received':0,Outstanding:0,Expenses:0,'Salary Expenses':0};dailyMap[d]['Bills Count']++;dailyMap[d].Sales+=Number(i.grandTotal)||0;dailyMap[d]['Payments Received']+=paid(i);dailyMap[d].Outstanding+=invoiceDue(i)});expenseRows.forEach(e=>{dailyMap[e.date]??={Date:e.date,'Bills Count':0,Sales:0,'Payments Received':0,Outstanding:0,Expenses:0,'Salary Expenses':0};dailyMap[e.date].Expenses+=Number(e.amount)||0;if(e.category==='Salary')dailyMap[e.date]['Salary Expenses']+=Number(e.amount)||0});const daily=Object.values(dailyMap).sort((a,b)=>a.Date.localeCompare(b.Date));const expenses=expenseRows.map(e=>({Date:e.date,Category:e.category,'Paid To':e.paidTo||'',Staff:db.staff.find(st=>st.id===e.staffId)?.name||'',Description:e.note||'',Mode:e.mode||'',Amount:Number(e.amount)||0}));const staff=db.staff.map(st=>({'Staff Name':st.name,Role:st.role||'',Phone:st.phone||'','Monthly Salary':Number(st.salary)||0,'Salary Paid':staffSalaryPaid(st.id,m),'Salary Balance':staffSalaryDue(st,m)}));const clean=String(db.business.name||'WashDesk').replace(/[^A-Za-z0-9_-]+/g,'-').slice(0,40);const filename=`${clean}-Sales-Report-${m}.xlsx`;if(!window.WashDeskExcel?.exportWorkbook){notify('Excel report module is not loaded. Please reopen the app and retry.');return}window.WashDeskExcel.exportWorkbook({filename,sales,daily,expenses,staff}).then(result=>notify(`Excel workbook saved. Check ${result?.location||'Downloads'}.`)).catch(e=>{console.error(e);notify(e?.message||'Excel workbook could not be exported.')})}
  function mergeWashDeskData(local,remote){const base=Object.assign(blank(),local||{},remote||{}),deleted={...(local?._deletedIds||{})};Object.entries(remote?._deletedIds||{}).forEach(([id,t])=>deleted[id]=Math.max(Number(deleted[id])||0,Number(t)||0));const collections=['customers','vehicles','services','invoices','products','purchases','expenses','staff','payments'];collections.forEach(key=>{const map=new Map();[...(local?.[key]||[]),...(remote?.[key]||[])].forEach(record=>{if(!record?.id)return;const old=map.get(record.id),stamp=x=>Number(x?.updatedAt||x?.editedAt||x?.createdAt||0);if(!old||stamp(record)>=stamp(old))map.set(record.id,record)});base[key]=[...map.values()].filter(record=>(Number(deleted[record.id])||0)<=(Number(record.updatedAt||record.editedAt||record.createdAt||0)))});base._deletedIds=deleted;const stamp=x=>Number(x?.updatedAt||0);base.business=stamp(local?.business)>=stamp(remote?.business)?(local?.business||base.business):(remote?.business||base.business);base.settings=stamp(local?.settings)>=stamp(remote?.settings)?(local?.settings||base.settings):(remote?.settings||base.settings);base.meta={...(local?.meta||{}),...(remote?.meta||{})};return base}

  async function connectCloud(e){e.preventDefault();if(!window.WashDeskCloud?.requestEmailOtp){notify('Email sign-in is not available.');return}const f=new FormData(e.target);try{const email=String(f.get('email')||'').trim();const result=await window.WashDeskCloud.requestEmailOtp({url:String(f.get('url')||''),anonKey:String(f.get('anonKey')||''),email,getLocal:()=>db,onRemote:receiveCloudData});cloudOtpPending=true;cloudOtpEmail=result.email||email;notify(result.message);render()}catch(err){console.error('Cloud OTP request failed:',err);notify(err?.message||'Could not send the email code. Check Supabase setup.')}}async function verifyCloudOtp(e){e.preventDefault();const f=new FormData(e.target);try{const result=await window.WashDeskCloud.verifyEmailOtp({email:cloudOtpEmail||String((window.WashDeskCloud.getConfig()||{}).email||''),token:String(f.get('token')||''),getLocal:()=>db,onRemote:receiveCloudData});cloudOtpPending=false;notify(result.message);render()}catch(err){console.error('Email verification failed:',err);notify(err?.message||'Verification failed. Check the six-digit code.')}}

  async function disconnectCloud(){try{await window.WashDeskCloud?.disconnect?.();notify('This device disconnected. Local business records were kept.');render()}catch(e){notify(e?.message||'Could not disconnect cloud sync.')}}
  function stockAdjustForm(){if(!db.products.length){notify('Add an item first.');return}openModal('Adjust stock',`<form id="adjust-form"><div class="field-grid"><div class="field full"><label>Inventory item</label><select name="productId">${db.products.map(p=>`<option value="${p.id}">${esc(p.name)} — current ${p.qty} ${esc(p.unit||'')}</option>`).join('')}</select></div><div class="field"><label>Adjustment</label><select name="kind"><option value="add">Add stock</option><option value="remove">Use / remove stock</option><option value="set">Set exact stock count</option></select></div><div class="field"><label>Quantity</label><input name="qty" type="number" min="0" step=".001" required /></div><div class="field full"><label>Reason</label><input name="reason" placeholder="Spillage, damaged, usage, stock count…" /></div></div><div class="form-actions"><button type="button" class="btn" id="cancel-modal">Cancel</button><button class="btn primary">Save adjustment</button></div></form>`);document.getElementById('adjust-form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);const p=db.products.find(x=>x.id===f.get('productId'));const q=Number(f.get('qty'));if(!p||q<0)return;const before=Number(p.qty);p.qty=f.get('kind')==='add'?before+q:f.get('kind')==='remove'?Math.max(0,before-q):q;db.expenses.push({id:id(),date:today(),category:'Stock adjustment',amount:0,paidTo:'',mode:'Non-cash',note:`${p.name}: ${before} → ${p.qty}. ${f.get('reason')||''}`,createdAt:Date.now()});save();closeModal();render();notify('Stock adjusted.')})}
  function addVehicleForm(cid){openModal('Add vehicle',`<form id="vehicle-form"><div class="field-grid"><div class="field"><label>Registration number *</label><input name="number" required placeholder="GJ05AB1234" /></div><div class="field"><label>Vehicle class</label><select name="type"><option>Private Car</option><option>Taxi</option><option>Commercial Vehicle</option><option>SUV</option><option>Two Wheeler</option><option>Other</option></select></div><div class="field"><label>Make / model</label><input name="make" /></div></div><div class="form-actions"><button type="button" class="btn" id="cancel-modal">Cancel</button><button class="btn primary">Save vehicle</button></div></form>`);document.getElementById('vehicle-form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);db.vehicles.push({id:id(),customerId:cid,number:f.get('number').trim().toUpperCase(),type:f.get('type'),make:f.get('make')});save();closeModal();showCustomer(cid);notify('Vehicle added.')})}
  function addPaymentForm(invId){const i=db.invoices.find(x=>x.id===invId);const due=invoiceDue(i);openModal('Record payment',`<p class="muted" style="font-size:12px">Invoice ${esc(i.number)} · Balance due ${INR(due)}</p><form id="payment-form"><div class="field-grid"><div class="field"><label>Amount received (₹)</label><input name="amount" type="number" min=".01" max="${due}" step=".01" required /></div><div class="field"><label>Payment mode</label><select name="mode"><option>Cash</option><option>UPI</option><option>Card</option><option>Bank Transfer</option><option>Mixed</option></select></div><div class="field"><label>Date</label><input name="date" type="date" value="${today()}" required /></div></div><div class="form-actions"><button type="button" class="btn" id="cancel-modal">Cancel</button><button class="btn primary">Save payment</button></div></form>`);document.getElementById('payment-form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);const amount=Number(f.get('amount'));if(amount<=0||amount>due+.009){notify('Enter a payment within the outstanding balance.');return}db.payments.push({id:id(),invoiceId:invId,date:f.get('date'),amount,mode:f.get('mode'),createdAt:Date.now()});save();closeModal();openInvoice(invId);notify('Payment recorded.')})}
  document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.action;if(a==='new-bill'){billLines=[];setPage('billing')}else if(a==='add-customer'||a==='quick-customer')addCustomerForm();else if(a==='add-service')addServiceForm();else if(a==='add-product')addProductForm();else if(a==='add-expense')addExpenseForm();else if(a==='add-purchase')addPurchaseForm();else if(a==='add-staff')addStaffForm();else if(a==='export')exportBackup();else if(a==='import')importBackup();else if(a==='export-csv')exportCsv();else if(a==='export-excel')exportSalesExcel();else if(a==='stock-adjust')stockAdjustForm();else if(a==='clear-bill'){billLines=[];setPage('billing')}else if(a==='save-bill')saveBill();else if(a==='add-vehicle')addVehicleForm(b.dataset.customerId);else if(a==='add-edit-line')addInvoiceEditLine();else if(a==='start-offer-campaign')startOfferCampaign();else if(a==='open-offer-whatsapp')openCurrentOfferWhatsApp();else if(a==='next-offer-customer')nextOfferCustomer();else if(a==='end-offer-campaign'){closeModal();offerQueue=[];offerIndex=0} else if(a==='cloud-sync-now')syncCloudNow();else if(a==='cloud-disconnect')disconnectCloud();if(b.dataset.nav)setPage(b.dataset.nav);if(b.dataset.invoice)openInvoice(b.dataset.invoice);if(b.dataset.editInvoice)editInvoice(b.dataset.editInvoice);if(b.dataset.customer)showCustomer(b.dataset.customer);if(b.dataset.savePdf)saveInvoicePdf(b.dataset.savePdf);if(b.dataset.share)shareInvoice(b.dataset.share);if(b.dataset.print)printInvoice(b.dataset.print);if(b.dataset.payment)addPaymentForm(b.dataset.payment);if(b.dataset.editService)addServiceForm(db.services.find(x=>x.id===b.dataset.editService));if(b.dataset.deleteService){if(confirm('Delete this service? Existing invoices will remain unchanged.'))markRecordDeleted('services',b.dataset.deleteService)}if(b.dataset.editProduct)addProductForm(db.products.find(x=>x.id===b.dataset.editProduct));if(b.dataset.deleteExpense){if(confirm('Delete this expense entry?'))markRecordDeleted('expenses',b.dataset.deleteExpense)}if(b.dataset.deleteStaff){if(confirm('Remove this staff member from the active directory? Existing invoice and salary records remain in history.'))markRecordDeleted('staff',b.dataset.deleteStaff)}if(b.dataset.editStaff)addStaffForm(db.staff.find(x=>x.id===b.dataset.editStaff));if(b.dataset.paySalary)payStaffSalaryForm(b.dataset.paySalary);if(b.dataset.waToggle)toggleWhatsAppConsent(b.dataset.waToggle);if(b.dataset.removeEditLine!==undefined)removeInvoiceEditLine(Number(b.dataset.removeEditLine));if(b.id==='modal-close'||b.id==='cancel-modal')closeModal();if(b.dataset.removeLine!==undefined){billLines.splice(Number(b.dataset.removeLine),1);render()}});
  document.getElementById('modal-close').addEventListener('click',closeModal);document.getElementById('modal-backdrop').addEventListener('click',e=>{if(e.target.id==='modal-backdrop')closeModal()});document.getElementById('hamb').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)setPage(b.dataset.page)});document.getElementById('today-label').textContent=new Date().toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'});document.getElementById('avatar').textContent=(db.business.name||'W').slice(0,1).toUpperCase();
  render();
  window.WashDeskCloud?.resume?.({getLocal:()=>db,onRemote:receiveCloudData}).then(()=>{if(page==='settings')render()}).catch(e=>console.warn('Cloud sync resume:',e));
  if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
