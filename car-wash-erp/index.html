<html lang="en">

  <meta charset="utf-8" />

  <link rel="manifest" href="./manifest.webmanifest" />

  <title>Prime Auto Care — Business Manager</title>
  <style>
    :root{--bg:#f6f4ee;--panel:#fffefa;--ink:#1b1a17;--muted:#716b5e;--line:#e9e1d0;--nav:#111111;--blue:#b58a36;--blue2:#fff3d4;--teal:#27845d;--red:#c8423d;--amber:#c58d2b;--shadow:0 10px 30px rgba(38,28,12,.07);--radius:18px}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}
    .shell{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}.sidebar{background:var(--nav);color:#e7edf8;padding:24px 16px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;align-items:center;gap:12px;padding:3px 8px 14px}.brand-mark{width:52px;height:52px;border-radius:14px;background:linear-gradient(145deg,#201b11,#050505);border:1px solid #c69a42;display:grid;place-items:center;box-shadow:inset 0 0 0 2px rgba(215,175,91,.16)}.brand-mark svg{width:43px;height:43px}.brand strong{display:block;font-size:17px;letter-spacing:.2px}.brand small{display:block;color:#9ba9bf;margin-top:2px;font-size:11px}.nav-label{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:#77849a;padding:0 10px;margin-bottom:4px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#aebbd0;text-align:left;padding:11px 12px;border-radius:11px;display:flex;gap:12px;align-items:center;font-weight:600;font-size:13px}.nav button:hover,.nav button.active{background:#202d42;color:#fff}.nav .ico{width:22px;text-align:center;font-size:16px}.side-foot{margin-top:auto;color:#7f8da4;font-size:11px;line-height:1.6;padding:12px}
    .main{min-width:0}.topbar{height:76px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:5}.top-left{display:flex;align-items:center;gap:14px}.topbar h1{font-size:20px;margin:0}.topbar p{font-size:12px;color:var(--muted);margin:4px 0 0}.top-actions{display:flex;align-items:center;gap:10px}.avatar{width:36px;height:36px;border-radius:50%;background:#e9efff;color:#2456b8;display:grid;place-items:center;font-weight:800}.hamb{display:none;border:0;background:#eef2f8;border-radius:10px;padding:9px}.content{padding:26px 30px 50px;max-width:1500px;margin:0 auto}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}.page-head h2{margin:0;font-size:23px;letter-spacing:-.5px}.page-head p{margin:6px 0 0;color:var(--muted);font-size:13px}.actions{display:flex;flex-wrap:wrap;gap:9px}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;padding:10px 14px;font-size:12px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn:hover{border-color:#b8c7df;background:#f9fbff}.btn.primary{background:linear-gradient(135deg,#c7a052,#94702b);border-color:#a77d31;color:#17130a}.btn.primary:hover{background:#d1ad64}.btn.danger{color:var(--red);border-color:#f0caca}.btn.ghost{background:transparent}.btn.small{padding:7px 10px;font-size:11px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.stat{padding:17px 18px}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;font-weight:650}.stat-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:#f0f4fc;font-size:16px}.stat-value{font-size:25px;font-weight:850;letter-spacing:-.7px;margin-top:14px}.stat-note{font-size:11px;color:var(--muted);margin-top:4px}.two{grid-template-columns:minmax(0,1.4fr) minmax(280px,.9fr)}.card{padding:19px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.card-head h3{font-size:14px;margin:0}.card-head span{font-size:11px;color:var(--muted)}.empty{border:1px dashed #cfd8e6;border-radius:14px;padding:30px 16px;text-align:center;color:var(--muted);font-size:12px}.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:5px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:12px}th{text-align:left;color:#78849a;font-size:10px;letter-spacing:.6px;text-transform:uppercase;padding:11px 10px;border-bottom:1px solid var(--line)}td{padding:12px 10px;border-bottom:1px solid #edf0f5}tr:last-child td{border-bottom:0}.right{text-align:right}.muted{color:var(--muted)}.strong{font-weight:800}.badge{display:inline-flex;border-radius:30px;padding:5px 8px;font-size:10px;font-weight:800;background:#eff5ff;color:#2457bf}.badge.green{background:#e7f8f2;color:#128267}.badge.red{background:#fff0f0;color:#c13d3d}.badge.amber{background:#fff5df;color:#9d6509}.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:6px;min-width:0}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:750;color:#4d5a70}.field input,.field select,.field textarea{width:100%;border:1px solid #dce3ee;background:#fff;border-radius:10px;padding:10px 11px;outline:none;color:var(--ink);font-size:12px;min-width:0}.field input:focus,.field select:focus,.field textarea:focus{border-color:#85a9f7;box-shadow:0 0 0 3px #eaf1ff}.field textarea{min-height:80px;resize:vertical}.help{font-size:10px;color:var(--muted);line-height:1.5}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px}.search{flex:1;min-width:180px}.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-size:12px}.form-card{max-width:900px}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.pill-row{display:flex;gap:8px;flex-wrap:wrap}.pill{border:1px solid var(--line);padding:7px 10px;border-radius:30px;background:#fff;font-size:11px;color:var(--muted)}.pill.active{background:var(--blue2);color:#2256be;border-color:#c9d9ff}.invoice-layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:16px}.line-add{display:grid;grid-template-columns:minmax(0,1fr) 90px 105px auto;gap:8px;align-items:end}.totals{display:grid;gap:9px;border-top:1px solid var(--line);padding-top:13px;margin-top:14px}.total-line{display:flex;justify-content:space-between;font-size:12px}.total-line.final{font-size:18px;font-weight:900;padding-top:9px;border-top:1px dashed var(--line)}.toast{position:fixed;right:20px;bottom:20px;background:#172033;color:white;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);font-size:12px;z-index:20;max-width:min(380px,calc(100vw - 40px));opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}.modal-backdrop{position:fixed;inset:0;background:rgba(10,20,38,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:30}.modal-backdrop.show{display:flex}.modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.2)}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.modal-head h3{margin:0;font-size:17px}.close{border:0;background:#f0f3f8;width:32px;height:32px;border-radius:50%;font-size:18px}.invoice-preview{border:1px solid var(--line);padding:22px;border-radius:12px;background:#fff}.invoice-preview h2{margin:0}.invoice-preview .inv-top{display:flex;justify-content:space-between;gap:20px}.invoice-preview .inv-meta{text-align:right;font-size:11px;line-height:1.7}.invoice-preview .bill-to{margin:20px 0;font-size:12px;line-height:1.6}.invoice-summary{margin:18px 0 0 auto;width:100%;max-width:310px;font-size:11px;line-height:1.65}.invoice-summary-row{display:flex;justify-content:space-between;gap:14px;padding:3px 0}.invoice-summary-row b{text-align:right;white-space:nowrap}.invoice-grand-total{margin:8px 0;padding:11px 12px;border-radius:8px;background:#14213a;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px}.invoice-grand-total strong{font-size:20px;white-space:nowrap}.balance-row{border-top:1px dashed #cbd5e1;padding-top:7px;margin-top:4px;font-size:12px}.invoice-preview table{font-size:11px}.invoice-preview th{font-size:9px}.invoice-preview .inv-foot{font-size:10px;color:var(--muted);margin-top:18px}.chart{height:180px;display:flex;align-items:end;gap:8px;border-bottom:1px solid var(--line);padding:18px 4px 0}.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;gap:7px;min-width:0}.bar{width:min(30px,75%);background:linear-gradient(180deg,#5fa1ff,#2865e3);border-radius:7px 7px 2px 2px;min-height:3px}.bar-label{font-size:9px;color:var(--muted)}.stock-alert{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #edf0f5;font-size:12px}.stock-alert:last-child{border:0}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.notice{padding:12px 14px;border-radius:12px;background:#fff8e8;border:1px solid #f4dfac;color:#77530e;font-size:11px;line-height:1.55}.success-note{padding:12px 14px;border-radius:12px;background:#eaf8f3;border:1px solid #c6eadc;color:#126d54;font-size:11px;line-height:1.55}.hide{display:none!important}
    
    .brand-mark{width:82px;height:54px;border-radius:11px;overflow:hidden;background:#050505;border:1px solid #c69a42;display:grid;place-items:center;box-shadow:inset 0 0 0 2px rgba(215,175,91,.16);flex:0 0 auto}
    .brand-mark img{display:block;width:100%;height:100%;object-fit:contain}
    .dashboard-hero{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:24px 26px;margin:0 0 16px;border:1px solid rgba(205,164,85,.36);border-radius:18px;background:radial-gradient(circle at 82% 20%,rgba(199,157,69,.28),transparent 28%),linear-gradient(112deg,#101725 0%,#1b263a 62%,#302719 100%);box-shadow:0 14px 34px rgba(18,27,43,.12);color:#fff}
    .dashboard-kicker{display:block;color:#e7c983;font-size:10px;font-weight:850;letter-spacing:1.5px;text-transform:uppercase}
    .dashboard-hero h2{margin:8px 0 5px;font-size:23px;letter-spacing:-.5px;color:#fff}
    .dashboard-hero p{margin:0;color:#c4ccda;font-size:12px}
    .dashboard-hero-meta{flex:0 0 auto;text-align:right;border-left:1px solid rgba(255,255,255,.18);padding-left:20px}
    .dashboard-hero-meta b{display:block;color:#f2d696;font-size:16px}
    .dashboard-hero-meta span{display:block;color:#c4ccda;font-size:10px;margin-top:5px}
    .dashboard-quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
    .dashboard-quick-link{display:grid;grid-template-columns:38px 1fr;grid-template-rows:auto auto;align-items:center;column-gap:11px;text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:13px 14px;box-shadow:var(--shadow);color:var(--ink)}
    .dashboard-quick-link>span{grid-row:1/3;width:38px;height:38px;border-radius:12px;background:#f6edda;color:#8d6728;display:grid;place-items:center;font-size:20px;font-weight:800}
    .dashboard-quick-link b{font-size:12px}
    .dashboard-quick-link small{font-size:10px;color:var(--muted);margin-top:3px}
    .dashboard-quick-link:hover{border-color:#c99f51;transform:translateY(-1px)}
    .dashboard-insight{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;background:#fbf7ee;border:1px solid #eee1c7;color:#5b4b2f;font-size:11px;margin-top:12px}
    .dashboard-insight b{font-size:12px;color:#292318}

    
    .customer-search-results{margin-top:6px;border:1px solid #dce3ee;border-radius:10px;background:#fff;max-height:230px;overflow:auto}
    .customer-search-option{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:0;border-bottom:1px solid #edf0f5;background:#fff;text-align:left;color:#172033;cursor:pointer}
    .customer-search-option:last-child{border-bottom:0}.customer-search-option:hover{background:#fbf6e9}
    .customer-search-option small{display:block;margin-top:3px;color:#77849a;font-size:10px}
    .customer-search-pick{font-size:10px;font-weight:800;color:#8b6727;white-space:nowrap}
    .customer-search-empty{padding:10px 12px;color:#77849a;font-size:11px}
    .duplicate-hint{font-size:10px;line-height:1.45;color:#68758b;margin-top:5px;min-height:15px}
    .duplicate-hint.warning{color:#9a6a16}.duplicate-hint.error{color:#b42318;font-weight:750}

    /* Premium Prime Auto Care invoice preview styling */
    .premium-invoice-header{display:grid;grid-template-columns:78px minmax(0,1fr) 148px;align-items:center;gap:12px;min-height:104px;padding:13px 15px;border:2px solid #17130c;border-radius:3px;background:linear-gradient(118deg,#a77a2b 0%,#e6ca83 28%,#f7e7b5 49%,#d0aa5c 75%,#94691f 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
    .premium-logo-panel{width:72px;height:72px;padding:4px;border:1px solid rgba(35,25,8,.5);background:rgba(255,255,255,.36);display:grid;place-items:center}
    .premium-logo-panel img{display:block;width:100%;height:100%;object-fit:contain}
    .premium-brand-center{text-align:center;min-width:0}
    .premium-brand-center h2{margin:0 0 3px!important;color:#080704!important;font-family:Georgia,serif!important;font-size:23px!important;line-height:1.1!important;letter-spacing:1.1px!important;font-weight:900!important;text-shadow:0 1px 0 rgba(255,255,255,.48),0 2px 2px rgba(45,30,5,.2)}
    .premium-brand-subtitle{font-family:Georgia,serif;font-weight:800;font-size:13px;letter-spacing:.6px;color:#17120a}
    .premium-brand-tagline{font-size:8px;font-weight:800;letter-spacing:2px;color:#4b3817;margin:3px 0 5px}
    .premium-business-details{font-size:8px;line-height:1.35;color:#35270f;overflow-wrap:anywhere}
    .premium-car-mark{text-align:center;min-width:0}
    .premium-car-mark svg{display:block;width:100%;height:57px}
    .premium-car-mark img{display:block;width:100%;height:57px;object-fit:cover;border:1px solid #8b6729;border-radius:3px;box-shadow:0 2px 7px rgba(0,0,0,.24)}
    .premium-car-mark span{display:block;font-size:7px;font-weight:900;letter-spacing:1.1px;color:#211809}
    .invoice-title-strip{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:10px 0 7px;padding:8px 11px;border-bottom:1px solid #b68a3d;border-top:1px solid #e5d1a1;background:linear-gradient(90deg,#fbf4e3,#fffdf8)}
    .invoice-title-strip>strong{font-family:Georgia,serif;color:#75531e;font-size:14px;letter-spacing:.5px}
    .invoice-reference{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:5px 12px;font-size:8px;color:#6f6043}
    .invoice-reference span{white-space:nowrap}.invoice-reference b{color:#17130b}
    .invoice-status-strip{display:flex;justify-content:space-between;gap:10px;padding:5px 10px;margin-bottom:8px;background:#19160f;color:#e9cf91;font-size:8px;font-weight:900;letter-spacing:.6px}
    .invoice-party-grid{display:grid;grid-template-columns:1.12fr .88fr;gap:8px;margin:8px 0}
    .invoice-party-card{min-width:0;padding:9px 11px;border:1px solid #dfc891;border-left:3px solid #b88c3b;border-radius:3px;background:linear-gradient(135deg,#fffdf7,#f8f1df);font-size:9px;line-height:1.45;overflow-wrap:anywhere}
    .invoice-section-label{margin-bottom:5px;color:#8c6529;font-size:8px;font-weight:900;letter-spacing:1px}
    .invoice-customer-name{display:block;color:#17130b;font-size:13px;margin-bottom:3px}
    .invoice-vehicle-number{display:block;font-family:Georgia,serif;font-size:16px;letter-spacing:1px;color:#17130b;margin-bottom:4px}
    .premium-invoice-table{width:100%;max-width:100%;border-collapse:collapse;table-layout:fixed;white-space:normal;font-size:9px;margin-top:9px}
    .premium-invoice-table th{padding:8px 6px;border:1px solid #17130b;background:linear-gradient(180deg,#29251b,#0b0a07);color:#e9cf91;font-size:8px;font-weight:900;letter-spacing:.25px;text-align:left}
    .premium-invoice-table th:nth-child(1),.premium-invoice-table td:nth-child(1){width:43%}
    .premium-invoice-table th:nth-child(2),.premium-invoice-table td:nth-child(2){width:11%}
    .premium-invoice-table th:nth-child(3),.premium-invoice-table td:nth-child(3){width:15%}
    .premium-invoice-table th:nth-child(4),.premium-invoice-table td:nth-child(4){width:17%}
    .premium-invoice-table th:nth-child(5),.premium-invoice-table td:nth-child(5){width:14%}
    .premium-invoice-table td{padding:8px 6px;border:1px solid #d8caa9;white-space:normal;overflow-wrap:anywhere;vertical-align:top;color:#211d15;background:#fffefa}
    .premium-invoice-table tbody tr:nth-child(even) td{background:#fbf6e9}
    .premium-invoice-table .help{font-size:8px;color:#786b53;margin-top:2px;line-height:1.35}
    .invoice-serial{display:inline-block;min-width:18px;color:#886529;font-weight:900}
    .invoice-lower-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start;margin-top:10px}
    .invoice-payment-card{padding:10px 11px;border:1px solid #dfc891;border-radius:3px;background:#fbf5e7;font-size:9px;line-height:1.55;overflow-wrap:anywhere}
    .invoice-payment-row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed #d9cba9}
    .invoice-payment-row span{color:#62563f}.invoice-payment-row b{text-align:right;color:#19150c}
    .invoice-payment-status{color:#8b6423!important}.invoice-payment-note{margin-top:7px;color:#796744;font-size:8px}
    .invoice-summary{display:block;width:100%;max-width:none;margin:0!important;padding:7px 9px;border:1px solid #e0cfaa;border-radius:3px;background:#fffefa;font-size:9px;line-height:1.45}
    .invoice-summary-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:3px 0}
    .invoice-summary-row span{flex:1 1 auto;min-width:0;color:#5e5544}.invoice-summary-row b{flex:0 0 auto;max-width:58%;text-align:right;white-space:nowrap;color:#17130b}
    .invoice-grand-total{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin:7px 0;padding:10px 11px;border:1px solid #7d5b20;border-radius:3px;background:linear-gradient(110deg,#9e7328,#f2d88f 45%,#bb9142);color:#171108}
    .invoice-grand-total span{flex:1 1 auto;min-width:0;font-size:10px;font-weight:900;letter-spacing:.65px}.invoice-grand-total strong{flex:0 0 auto;font-size:17px;white-space:nowrap;text-align:right;color:#0b0905;text-shadow:0 1px 0 rgba(255,255,255,.5)}
    .invoice-footer-grid{display:grid;grid-template-columns:1fr .86fr;gap:9px;margin-top:12px}
    .invoice-terms-card,.invoice-signature-card{position:relative;min-width:0;border:1px solid #dfc891;background:#fffdf7;overflow:hidden}
    .invoice-footer-label{padding:6px 9px;background:#17140e;color:#e9cf91;font-size:8px;font-weight:900;letter-spacing:.75px}
    .invoice-terms-card p{margin:7px 9px;font-size:8px;line-height:1.42;color:#61563f;overflow-wrap:anywhere;white-space:pre-line}
    .invoice-signature-card{padding-bottom:8px;text-align:center}
    .invoice-signature-space{height:24px;margin:8px 18px 5px;border-bottom:1px solid #b89a60}
    .invoice-signature-card b{font-family:Georgia,serif;font-size:10px;color:#21190b}
    .invoice-signature-caption{font-size:8px;color:#756747;margin-top:3px}
    .invoice-gold-seal{position:absolute;right:8px;top:38px;width:38px;height:38px;border:2px solid #b18a3b;border-radius:50%;display:grid;place-content:center;background:radial-gradient(circle,#fff4ce,#cba34d);color:#4b3612;font-size:6px;font-weight:900;line-height:1.05;transform:rotate(8deg)}
    .invoice-bottom-line{margin-top:9px;padding-top:5px;border-top:1px solid #d9c28e;text-align:center;color:#8b6a31;font-size:7px;font-weight:900;letter-spacing:1px}

    @media(max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.dashboard-quick{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.invoice-layout{grid-template-columns:1fr}}
    
    /* Mobile invoice preview: keep the brand, car image and invoice columns readable. */

<script>
(() => {
  'use strict';
  const STORE='washdesk-v1';
  const INR=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(Number(n)||0);
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
  const monthKey=d=>(d||today()).slice(0,7);
  const id=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
  const blank=()=>({
    business:{name:'Prime Auto Care',phone:'',email:'',address:'',city:'Surat',state:'Gujarat',stateCode:'24',gstin:'',registered:false,invoicePrefix:'CW',upi:'',terms:'Thank you for choosing us. Drive safe!',openingTime:'08:00',closingTime:'20:00',openingReminderEnabled:false,openingReminderTime:'07:45'},
    settings:{currency:'INR',financialYearStart:4,stockAlerts:true},
    services:[],customers:[],vehicles:[],invoices:[],products:[],stockMovements:[],purchases:[],expenses:[],staff:[],staffAdvances:[],attendance:[],payments:[],_deletedIds:{},meta:{businessUpdatedAt:0,stockLedgerVersion:1},
  });
  function reconcileStockLedger(data){
    data.stockMovements=Array.isArray(data.stockMovements)?data.stockMovements:[];
    data.products=Array.isArray(data.products)?data.products:[];
    data.meta={...(data.meta||{}),stockLedgerVersion:1};
    const deltas=new Map();
    data.stockMovements.forEach(m=>{const key=String(m?.productId||'');if(!key)return;deltas.set(key,(deltas.get(key)||0)+Number(m.delta||0))});
    data.products.forEach(p=>{
      if(p.stockOpeningQty===undefined||p.stockOpeningQty===null)p.stockOpeningQty=Number(p.qty)||0;
      p.stockOpeningQty=Number(p.stockOpeningQty)||0;
      p.qty=p.stockOpeningQty+(deltas.get(String(p.id))||0);
    });
    return data;
  }
  function recordStockMovement(productId,delta,reason,sourceId,movementId){
    const amount=Number(delta)||0,product=db.products.find(p=>p.id===productId);
    if(!product||!amount)return false;
    db.stockMovements=db.stockMovements||[];
    const movementKey=movementId||('stock_'+id());
    if(db.stockMovements.some(m=>m.id===movementKey))return false;
    const now=Date.now();
    db.stockMovements.push({id:movementKey,productId:String(productId),delta:amount,reason:String(reason||'adjustment'),sourceId:String(sourceId||''),createdAt:now,updatedAt:now});
    product.qty=(Number(product.qty)||0)+amount;
    return true;
  }
  let db=load(); let page='dashboard'; let billLines=[]; let billSaving=false; let editingLines=[]; let editingInvoiceId=null; let offerDraft=''; let offerSelectedCustomerIds=null; let toastTimer=null;
  function load(){try{const x=JSON.parse(localStorage.getItem(STORE));return reconcileStockLedger(x&&x.business?Object.assign(blank(),x):blank())}catch(e){return reconcileStockLedger(blank())}}
  function snapshotDatabase(){return JSON.stringify(db)}
  function restoreDatabase(snapshot){db=reconcileStockLedger(JSON.parse(snapshot))}
  function save(){let previousRaw=null;try{previousRaw=localStorage.getItem(STORE)||'{}';const previous=JSON.parse(previousRaw);reconcileStockLedger(db);['customers','vehicles','services','invoices','products','stockMovements','purchases','expenses','staff','staffAdvances','attendance','payments'].forEach(k=>{const oldMap=new Map((previous[k]||[]).map(x=>[x.id,x]));(db[k]||[]).forEach(x=>{const old=oldMap.get(x.id);if(!old||JSON.stringify(old)!==JSON.stringify(x))x.updatedAt=Date.now()})});if(!previous.business||JSON.stringify(previous.business)!==JSON.stringify(db.business))db.business.updatedAt=Date.now();if(JSON.stringify(previous.settings||{})!==JSON.stringify(db.settings||{}))db.settings.updatedAt=Date.now();db.meta={...(db.meta||{}),stockLedgerVersion:1};db._deletedIds=db._deletedIds||{};localStorage.setItem(STORE,JSON.stringify(db));window.WashDeskCloud?.schedulePush?.(db);return true}catch(e){if(previousRaw!==null){try{db=reconcileStockLedger(Object.assign(blank(),JSON.parse(previousRaw)))}catch(restoreError){console.error('Prime Auto Care local rollback failed:',restoreError)}}notify('Storage is full. The failed change was rolled back. Export a backup and remove old records before retrying.');return false}}
  function notify(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),5200)}
  window.addEventListener('washdesk-cloud-conflict',e=>{const message=String(e.detail||'');if(message)notify(message)});
  window.addEventListener('prime-auto-care-opening-reminder',()=>{offerDraft=openingAnnouncementMessage();setPage('offers');notify('Opening announcement prepared. Review it and choose WhatsApp Business or SMS to share.')});
  function setPage(p){if(page!==p)applyPendingRemoteData();page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('sidebar').classList.remove('open');document.getElementById('top-title').textContent=({dashboard:'Dashboard',billing:'New bill',invoices:'Invoices',customers:'Customers & vehicles',services:'Services & packages',inventory:'Inventory',purchases:'Purchases',expenses:'Expenses',staff:'Staff',reports:'Reports',offers:'Offers & WhatsApp',settings:'Business settings'})[p]||'Prime Auto Care';document.getElementById('top-subtitle').textContent=({dashboard:'Your business at a glance',billing:'Create a customer bill in a few steps',invoices:'Search, review and share every saved invoice',customers:'Customer contacts, vehicles and visit history',services:'Set service rates for private, taxi and commercial vehicles',inventory:'Track chemicals and consumables',purchases:'Record supplier purchases and stock received',expenses:'Daily, monthly and all-time business expenses',staff:'Staff profiles, monthly salaries and payments',reports:'Sales registers and Excel reports',offers:'Prepare WhatsApp offers for customers who agreed to receive them',settings:'Business profile, backups and connected cloud sync'})[p]||'';render(false);window.scrollTo(0,0)}
  function fy(d=today()){const x=new Date(d+'T00:00:00');let y=x.getFullYear();if(x.getMonth()+1<4)y--;return `${String(y).slice(-2)}-${String(y+1).slice(-2)}`}
  function nextInvoiceNo(date=today()){const prefix=(db.business.invoicePrefix||'CW').replace(/[^A-Za-z0-9-]/g,'').slice(0,4).toUpperCase()||'CW';const key=String(date).slice(2).replace(/-/g,'');const n=db.invoices.filter(x=>x.date===date).reduce((m,x)=>{const z=String(x.number||'').match(/-(\d{3,})$/);return Math.max(m,z?Number(z[1]):0)},0)+1;return `${prefix}-${key}-${String(n).padStart(3,'0')}`}
  function offlineInvoiceNo(date=today()){const base=nextInvoiceNo(date).replace(/-\d+$/,'');return base+'-OFF-'+id().toUpperCase()}
  async function reserveInvoiceNo(date=today()){
    const shared=window.WashDeskCloud?.getWorkspace?.();
    if(shared?.workspace_id&&!navigator.onLine)return offlineInvoiceNo(date);
    if(shared?.workspace_id){
      if(!window.WashDeskCloud?.nextInvoiceNumber)throw new Error('Shared invoice numbering is unavailable. Reconnect cloud sync before saving this bill.');
      return await window.WashDeskCloud.nextInvoiceNumber({prefix:db.business.invoicePrefix||'CW',date,minNext:Number(nextInvoiceNo(date).match(/-(\d+)$/)?.[1]||1)});
    }
    return nextInvoiceNo(date);
  }
  function sum(a,fn){return a.reduce((s,x)=>s+(Number(fn?fn(x):x)||0),0)}
  function paid(i){return sum(db.payments.filter(p=>p.invoiceId===i.id),p=>p.amount)}
  function invoiceDue(i){return i?.cancelled?0:Math.max(0,Number(i?.grandTotal||0)-paid(i))}
  function customerName(cid){return db.customers.find(c=>c.id===cid)?.name||'Walk-in customer'} function invoiceCustomerName(i){return i?.customerNameSnapshot||customerName(i?.customerId)}
  function normalizeMobile(value){
    let digits=String(value||'').replace(/\D/g,'');
    if(digits.startsWith('0091')&&digits.length===14)digits=digits.slice(4);
    else if(digits.startsWith('91')&&digits.length===12)digits=digits.slice(2);
    else if(digits.startsWith('0')&&digits.length===11)digits=digits.slice(1);
    return digits;
  }
  function normalizeVehicleNumber(value){return String(value||'').toUpperCase().replace(/[^A-Z0-9]/g,'')}
  function findCustomerByMobile(value,excludeId=''){
    const key=normalizeMobile(value);if(!key)return null;
    return db.customers.find(c=>c.id!==excludeId&&normalizeMobile(c.phone)===key)||null;
  }
  function findVehicleByNumber(value,excludeId=''){
    const key=normalizeVehicleNumber(value);if(!key)return null;
    return db.vehicles.find(v=>v.id!==excludeId&&normalizeVehicleNumber(v.number)===key)||null;
  }
  function renderBillCustomerMatches(query=''){
    const box=document.getElementById('bill-customer-results');if(!box)return;
    const q=String(query||'').trim().toLowerCase(),digits=normalizeMobile(q),reg=normalizeVehicleNumber(q);
    if(!q){box.innerHTML='<div class="customer-search-empty">Type a customer name, mobile number or vehicle number to search.</div>';return}
    const rows=db.customers.filter(c=>{
      const vehicles=db.vehicles.filter(v=>v.customerId===c.id).map(v=>v.number);
      return c.name.toLowerCase().includes(q)||String(c.city||'').toLowerCase().includes(q)||String(c.phone||'').toLowerCase().includes(q)||(digits.length>=3&&normalizeMobile(c.phone).includes(digits))||vehicles.some(v=>String(v||'').toLowerCase().includes(q)||(reg.length>=3&&normalizeVehicleNumber(v).includes(reg)));
    }).slice(0,8);
    box.innerHTML=rows.length?rows.map(c=>{
      const count=db.vehicles.filter(v=>v.customerId===c.id).length;
      return `<button type="button" class="customer-search-option" data-select-bill-customer="${esc(c.id)}"><span><b>${esc(c.name)}</b><small>${esc(c.phone||'No mobile')} · ${count} vehicle(s)</small></span><span class="customer-search-pick">Select</span></button>`;
    }).join(''):'<div class="customer-search-empty">No matching customer found. Use “＋ New customer” to add a new record.</div>';
  }
  function selectBillCustomer(customerId,preferredVehicleId=''){
    const customer=db.customers.find(c=>c.id===customerId);if(!customer)return;
    const select=document.getElementById('bill-customer'),search=document.getElementById('bill-customer-search'),status=document.getElementById('bill-customer-status');
    if(select)select.value=customer.id;if(search)search.value=customer.name;if(status)status.textContent=`Selected: ${customer.name} · ${customer.phone||'No mobile saved'}`;
    const results=document.getElementById('bill-customer-results');if(results)results.innerHTML='';
    updateBillVehicleOptions(preferredVehicleId);
  }
  function updateBillVehicleOptions(preferredId=''){
    const select=document.getElementById('bill-vehicle');if(!select)return;
    const customerId=document.getElementById('bill-customer')?.value||'';
    const rows=db.vehicles.filter(v=>!customerId||v.customerId===customerId);
    select.innerHTML='<option value="">Select vehicle (optional)</option>'+rows.map(v=>`<option value="${esc(v.id)}">${esc(v.number)} · ${esc(v.type)}</option>`).join('');
    if(preferredId&&rows.some(v=>v.id===preferredId))select.value=preferredId;
  }
  function updateCustomerDuplicateHint(){
    const form=document.getElementById('customer-form');if(!form)return;
    const status=document.getElementById('customer-duplicate-status');if(!status)return;
    const name=String(form.elements.name.value||'').trim(),phone=String(form.elements.phone.value||'').trim();
    const sameName=name?db.customers.filter(c=>c.name.trim().toLowerCase()===name.toLowerCase()):[];
    const duplicatePhone=phone?findCustomerByMobile(phone):null;
    if(phone&&normalizeMobile(phone).length!==10){
      status.className='duplicate-hint warning';status.textContent='Enter a valid 10-digit Indian mobile number (you may also type +91).';
    }else if(duplicatePhone){
      status.className='duplicate-hint error';status.textContent=`This mobile number is already saved for ${duplicatePhone.name}. Select that customer instead; mobile numbers must be unique.`;
    }else if(sameName.length){
      status.className='duplicate-hint warning';status.textContent='A customer with this name already exists. Same names are allowed; check the mobile number to avoid creating the wrong record.';
    }else{
      status.className='duplicate-hint';status.textContent='Customer name may repeat. Mobile number must be unique when provided.';
    }
    const submit=form.querySelector('button[type="submit"],button.primary');if(submit)submit.disabled=!!duplicatePhone;
  }
  function updateVehicleDuplicateHint(){
    const form=document.getElementById('vehicle-form');if(!form)return;
    const status=document.getElementById('vehicle-duplicate-status'),input=form.elements.number;if(!status||!input)return;
    const number=String(input.value||'').trim(),duplicate=number?findVehicleByNumber(number):null;
    if(duplicate){
      const owner=db.customers.find(c=>c.id===duplicate.customerId);
      status.className='duplicate-hint error';status.textContent=`This vehicle number is already added to ${owner?.name||'another customer'}.`;
      const submit=form.querySelector('button.primary');if(submit)submit.disabled=true;
    }else{
      status.className='duplicate-hint';status.textContent='Vehicle registration numbers must be unique.';
      const submit=form.querySelector('button.primary');if(submit)submit.disabled=false;
    }
  }
  function updateBillVehicleDuplicateHint(){
    const status=document.getElementById('bill-number-status'),input=document.getElementById('bill-number');if(!status||!input)return;
    const value=String(input.value||'').trim(),duplicate=value?findVehicleByNumber(value):null;

  function calcLines(lines=billLines,discount=0){const gross=sum(lines,l=>l.qty*l.rate);const lineDisc=sum(lines,l=>l.discount||0);const preTaxable=Math.max(0,gross-lineDisc);const overall=Math.min(preTaxable,Math.max(0,Number(discount)||0));const taxable=Math.max(0,preTaxable-overall);let tax=0;for(const l of lines){const lineBase=Math.max(0,l.qty*l.rate-(l.discount||0));const share=preTaxable>0?overall*lineBase/preTaxable:0;const lineTaxable=Math.max(0,lineBase-share);const rate=db.business.registered?Number(l.taxRate)||0:0;tax+=lineTaxable*rate/100}return {gross,lineDisc,overall,taxable,tax,grand:taxable+tax}}

  function staffMonthDayCount(month=monthKey()){
    const match=String(month||'').match(/^(\d{4})-(\d{2})$/);
    if(!match)return 30;

  function staffAttendanceSummary(staffId,month=monthKey()){
    const rows=(db.attendance||[]).filter(a=>a.staffId===staffId&&String(a.date||'').slice(0,7)===month);
    const byDate=new Map();
    for(const row of rows){
      if(!row.date)continue;
      const previous=byDate.get(row.date);
      if(!previous||(Number(row.updatedAt)||0)>=(Number(previous.updatedAt)||0))byDate.set(row.date,row);

  }
  function staffPayrollBreakdown(st,month=monthKey()){
    const monthlySalary=Math.max(0,Number(st.salary)||0),calendarDays=staffMonthDayCount(month),attendance=staffAttendanceSummary(st.id,month);
    const dailyRate=monthlySalary/calendarDays,absenceDeduction=Math.min(monthlySalary,Math.round((dailyRate*attendance.absentDays+Number.EPSILON)*100)/100);
    const earnedSalary=Math.max(0,Math.round((monthlySalary-absenceDeduction+Number.EPSILON)*100)/100);
    const settled=Math.round((staffSalaryPaid(st.id,month)+Number.EPSILON)*100)/100;
    const balanceBeforeAdvances=Math.max(0,Math.round((earnedSalary-settled+Number.EPSILON)*100)/100);
    const openAdvances=Math.round((staffAdvancesOutstanding(st.id)+Number.EPSILON)*100)/100;
    const advanceDeduction=Math.min(balanceBeforeAdvances,openAdvances);
    const netPayable=Math.max(0,Math.round((balanceBeforeAdvances-advanceDeduction+Number.EPSILON)*100)/100);
    return {monthlySalary,calendarDays,presentDays:attendance.presentDays,absentDays:attendance.absentDays,dailyRate,absenceDeduction,earnedSalary,settled,balanceBeforeAdvances,openAdvances,advanceDeduction,netPayable};

  function vcardEscape(value){return String(value||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}

  async function shareOfferViaWhatsApp(){
    offerDraft=String(document.getElementById('offer-message')?.value||'').trim();
    if(!offerDraft){notify('Write the offer message first.');return}
    const eligible=db.customers.filter(c=>c.waOptIn&&offerPhone(c.phone).length>=11);
    const selected=eligible.filter(c=>Array.isArray(offerSelectedCustomerIds)&&offerSelectedCustomerIds.includes(c.id));
    if(!selected.length){notify('Select at least one opted-in customer.');return}
    const message=`${offerDraft}\n\n— ${db.business.name||'Prime Auto Care'}`;
    const title=`${db.business.name||'Prime Auto Care'} offer`;
    const imageInput=document.getElementById('offer-image');
    const imageFile=imageInput?.files?.[0]||null;
    if(imageFile&&(!imageFile.type.startsWith('image/')||imageFile.size>12*1024*1024)){notify('Choose an image smaller than 12 MB.');return}
    try{
      if(!navigator.share)throw new Error('This device does not support the Android share menu. Open Prime Auto Care on your Android phone to share offers.');
      if(imageFile){
        const filePayload={files:[imageFile],title,text:message};
        if(navigator.canShare?.({files:[imageFile]})){await navigator.share(filePayload);notify(`Offer and image prepared for ${selected.length} selected customers. Choose WhatsApp Business, select those recipients and press Send.`);return}
        notify('This device cannot attach an image through its share menu. Remove the image and share the text, or use a supported Android device.');return;
      }
      await navigator.share({title,text:message});
      notify(`Offer prepared for ${selected.length} selected customers. Choose WhatsApp Business, select those recipients and press Send.`);
    }catch(err){
      if(err?.name==='AbortError'||err?.message==='USER_CANCELLED')return;
      console.error('WhatsApp Business offer sharing failed:',err);
      notify(err?.message||'Could not open the WhatsApp share menu. Please retry.');

  async function refreshMessagingStatus(){
    const statusBox=document.getElementById('messaging-provider-status');
    const jobsBox=document.getElementById('messaging-jobs-list');
    if(!statusBox||!window.PrimeAutoCareMessaging){if(statusBox)statusBox.textContent='Messaging backend bundle is not loaded.';return}
    try{
      const result=await window.PrimeAutoCareMessaging.status();
      window.PrimeAutoCareMessagingConfig=result.config||{};
      const providers=result.providers||{};
      const line=(key,label)=>{const p=providers[key]||{};return `<div class="stock-alert"><span>${label}</span><b class="${p.ready?'text-success':'text-warning'}">${p.ready?'Ready':'Setup required'}</b></div>${p.missing?.length?`<p class="help">${p.missing.map(esc).join(', ')}</p>`:''}`};
      statusBox.innerHTML=line('whatsapp','WhatsApp Cloud API')+line('sms','SMS gateway / DLT')+line('voice','Automated voice')+line('automationWorker','Server queue worker');
      if(jobsBox){
        const jobs=result.jobs||[];
        jobsBox.innerHTML=jobs.length?jobs.slice(0,12).map(j=>`<div class="stock-alert"><span>${esc(j.channel)} · ${esc(j.recipient_name||'Customer')}<br/><small>${esc(j.created_at||'')}</small></span><b>${esc(j.status)}</b></div>`).join(''):'No message jobs have been queued yet.';
      }
      const form=document.getElementById('communication-settings-form');
      if(form&&!form.dataset.loaded){
        Object.entries(window.PrimeAutoCareMessagingConfig).forEach(([key,value])=>{
          const field=form.elements.namedItem(key);
          if(!field||value===null||value===undefined)return;
          if(field instanceof RadioNodeList){
            [...field].forEach(el=>{if(el.type==='checkbox')el.checked=Array.isArray(value)&&value.includes(el.value)});
          }else if(field.type==='checkbox')field.checked=!!value;
          else if(field.type==='time')field.value=String(value).slice(0,5);
          else field.value=String(value);
        });
        form.dataset.loaded='1';
      }
    }catch(error){
      statusBox.textContent=error?.message||'Messaging backend is not deployed or this device is not paired.';
      if(jobsBox)jobsBox.textContent='Message history is unavailable until the server connection is ready.';
    }
  }

  async function queueMarketingCampaign(channel){
    const message=String(document.getElementById('offer-message')?.value||'').trim();
    if(!message){notify('Write the campaign message first.');return}
    const chosen=(Array.isArray(offerSelectedCustomerIds)?offerSelectedCustomerIds:[]);
    if(!chosen.length){notify('Select at least one customer.');return}
    const localSchedule=String(document.getElementById('offer-send-at')?.value||'');
    let scheduledAt=null;
    if(localSchedule){const date=new Date(localSchedule);if(Number.isNaN(date.getTime())||date.getTime()<Date.now()-60000){notify('Choose a future campaign time.');return}scheduledAt=date.toISOString()}
    const image=document.getElementById('offer-image')?.files?.[0]||null;
    try{
      notify('Checking consent and queuing the campaign on the secure server…');
      const result=await window.PrimeAutoCareMessaging.campaign({channel,customerIds:chosen,message,attachment:channel==='whatsapp'?image:null,scheduledAt,database:db});
      notify(`${String(channel).toUpperCase()} campaign queued: ${result.queued} recipient(s). ${result.skipped_consent||0} skipped for missing channel consent.`);
      await refreshMessagingStatus();
    }catch(error){
      console.error('Campaign queue failed:',error);
      notify(error?.details?.length?`${error.message} Missing: ${error.details.join(', ')}`:error?.message||'Campaign could not be queued.');
    }
  }
  function changeCommunicationConsent(customerId,field,granted){
    const allowed=['waOptIn','waServiceOptIn','smsOptIn','smsServiceOptIn','voiceOptIn'];
    if(!allowed.includes(field))return;
    const customer=db.customers.find(c=>c.id===customerId);if(!customer)return;
    customer[field]=!!granted;
    customer.communicationConsentUpdatedAt=Date.now();
    customer.communicationConsentSource='explicit-consent-confirmed-in-app';
    customer.communicationConsentHistory=Array.isArray(customer.communicationConsentHistory)?customer.communicationConsentHistory:[];
    customer.communicationConsentHistory.push({field,granted:!!granted,source:customer.communicationConsentSource,at:customer.communicationConsentUpdatedAt});
    customer.communicationConsentHistory=customer.communicationConsentHistory.slice(-30);
    if(granted&&!offerSelectedCustomerIds.includes(customerId))offerSelectedCustomerIds.push(customerId);
    if(!granted&&!customer.waOptIn&&!customer.smsOptIn&&!customer.voiceOptIn)offerSelectedCustomerIds=offerSelectedCustomerIds.filter(x=>x!==customerId);
    if(!save()){notify('Consent change could not be saved.');return}
    notify(`${field.replace(/OptIn/g,'').replace(/([A-Z])/g,' $1').trim()} permission ${granted?'saved':'removed'} for ${customer.name}.`);
  }

  function addLine(){const val=document.getElementById('line-item').value;const qty=Number(document.getElementById('line-qty').value);const disc=Number(document.getElementById('line-discount').value||0);if(!val||qty<=0||disc<0){notify('Choose an item and enter valid quantity and discount.');return}let l;if(val.startsWith('product:')){const p=db.products.find(x=>x.id===val.slice(8));if(!p)return;if(qty>Number(p.qty)){notify(`Only ${p.qty} ${p.unit||'units'} available.`);return}l={kind:'product',refId:p.id,name:p.name,qty,rate:Number(p.sellPrice||0),taxRate:db.business.registered?Number(p.taxRate||0):0,sac:p.hsn||'',discount:disc,unit:p.unit||'unit',cost:Number(p.cost||0)}}else{const svc=db.services.find(x=>x.id===val);if(!svc)return;const vtype=document.getElementById('bill-type')?.value||'Private Car';const key=({'Private Car':'private','Taxi':'taxi','Commercial Vehicle':'commercial','SUV':'suv'})[vtype]||'private';const custom=svc.prices?.[key];const rate=custom!==undefined&&custom!==null&&custom!==''?Number(custom):Number(svc.price||0);l={kind:'service',refId:svc.id,name:svc.name,qty,rate,taxRate:db.business.registered?Number(svc.taxRate||0):0,sac:svc.sac||'',discount:disc,unit:'service',consumption:svc.consumption||[]}}if(disc>qty*l.rate){notify('Line discount cannot exceed that line amount.');return}l.amount=Math.max(0,l.qty*l.rate-l.discount);billLines.push(l);document.getElementById('bill-lines').innerHTML=billLineTable();document.querySelector('[data-action="save-bill"]').disabled=false;document.getElementById('line-item').value='';document.getElementById('line-qty').value='1';document.getElementById('line-discount').value='0';updateBillSummary()}  function updateBillSummary(){document.getElementById('bill-summary').innerHTML=billSummary()}
  async function saveBill(){
    if(billSaving){notify('This bill is already being saved.');return}
    if(!billLines.length){notify('Add at least one service or product.');return}
    let custId=document.getElementById('bill-customer').value||null;
    const vehicleId=document.getElementById('bill-vehicle').value||null;
    const selectedVehicle=db.vehicles.find(v=>v.id===vehicleId)||null;
    if(selectedVehicle&&!custId)custId=selectedVehicle.customerId;
    if(selectedVehicle&&custId&&selectedVehicle.customerId!==custId){notify('The selected vehicle does not belong to this customer.');return}
    const typedNumber=String(document.getElementById('bill-number').value||'').trim().toUpperCase();
    if(selectedVehicle&&typedNumber&&normalizeVehicleNumber(typedNumber)!==normalizeVehicleNumber(selectedVehicle.number)){
      notify('The entered registration number does not match the selected saved vehicle. Clear it or select the correct vehicle.');return;
    }
    const number=selectedVehicle?.number||typedNumber;
    const normalizedRegistration=normalizeVehicleNumber(number);
    if(normalizedRegistration){
      const duplicate=findVehicleByNumber(number,selectedVehicle?.id||'');
      if(duplicate){
        const owner=db.customers.find(c=>c.id===duplicate.customerId);
        notify(`Vehicle number ${duplicate.number} is already added for ${owner?.name||'an existing customer'}. Select that saved vehicle instead.`);
        updateBillVehicleDuplicateHint();return;
      }
      if(!custId){notify('Select an existing customer or add a new customer before saving a new vehicle number.');return}
    }
    const cust=db.customers.find(c=>c.id===custId)||null;
    const discount=Number(document.getElementById('bill-discount').value||0);
    const calc=calcLines(billLines,discount);
    const amountPaid=Number(document.getElementById('bill-paid').value||0);
    if(discount<0||discount>calc.gross-calc.lineDisc+.009){notify('Overall discount cannot exceed the remaining item value.');return}
    if(amountPaid<0||amountPaid>calc.grand+.009){notify('Payment received cannot be more than the bill total.');return}
    const required={};
    billLines.forEach(l=>{
      if(l.kind==='product')required[l.refId]=(required[l.refId]||0)+l.qty;
      else (l.consumption||[]).forEach(u=>required[u.productId]=(required[u.productId]||0)+Number(u.qtyPerService||0)*l.qty);
    });
    for(const [pid,qty] of Object.entries(required)){
      const p=db.products.find(x=>x.id===pid);
      if(p&&qty>Number(p.qty)+.000001){notify(`Not enough stock for ${p.name}. Required ${qty}; available ${p.qty}.`);return}
    }
    billSaving=true;
    const saveButton=document.querySelector('[data-action="save-bill"]');if(saveButton)saveButton.disabled=true;
    try{
      // Reserve the globally unique invoice number before mutating local stock.
      // If the network/counter fails, no inventory quantity is changed.
      const biz=JSON.parse(JSON.stringify(db.business));
      const invoiceDate=today(),invoiceNumber=await reserveInvoiceNo(invoiceDate),invoiceId=id();
      const dbBefore=snapshotDatabase();
      const stockCost=applyConsumption(billLines,invoiceId);
      const vehicleType=selectedVehicle?.type||document.getElementById('bill-type').value;
      const inv={
        id:invoiceId,number:invoiceNumber,financialYear:fy(invoiceDate),date:invoiceDate,createdAt:Date.now(),
        businessSnapshot:biz,gstRegistered:!!biz.registered,businessState:biz.state,
        customerId:custId,customerNameSnapshot:cust?.name||'Walk-in customer',
        customerState:cust?.state||biz.state,customerGstin:cust?.gstin||'',
        customerAddress:cust?.address||'',customerCity:cust?.city||'',
        vehicleId:selectedVehicle?.id||null,vehicleNumber:number,vehicleType,
        odometer:document.getElementById('bill-odo').value,
        staffId:document.getElementById('bill-staff').value||null,
        staffNameSnapshot:db.staff.find(st=>st.id===document.getElementById('bill-staff').value)?.name||'',
        lines:JSON.parse(JSON.stringify(billLines)),discount,subtotal:calc.gross,
        lineDiscount:calc.lineDisc,taxable:calc.taxable,tax:calc.tax,grandTotal:calc.grand,
        stockCost,notes:document.getElementById('bill-notes').value||'',
        paymentMode:document.getElementById('bill-mode').value
      };
      db.invoices.push(inv);
      if(amountPaid>0)db.payments.push({id:id(),invoiceId:inv.id,date:invoiceDate,amount:amountPaid,mode:inv.paymentMode,createdAt:Date.now()});
      if(custId&&number&&!selectedVehicle){
        db.vehicles.push({id:id(),customerId:custId,number,type:vehicleType,createdAt:Date.now(),updatedAt:Date.now()});
      }
      if(!save()){restoreDatabase(dbBefore);throw new Error('The invoice could not be saved locally. No inventory or invoice changes were kept. Please free storage space and retry.')}
      billLines=[];setPage('invoices');openInvoice(inv.id);if(custId&&cust?.phone){notify('Invoice saved. Saving the PDF and opening the customer WhatsApp chat…');void (async()=>{await saveInvoicePdf(inv.id);openInvoiceCustomerChat(inv.id)})()}else{notify(custId?'Invoice saved. Add the customer mobile number to open the direct WhatsApp chat.':'Invoice saved. Use Save PDF / WhatsApp when you are ready to share it.')}
    }catch(error){
      console.error('Invoice save failed:',error);
      notify(error?.message||'The invoice could not be saved. Check the data and retry.');
    }finally{
      billSaving=false;
      const button=document.querySelector('[data-action="save-bill"]');if(button)button.disabled=!billLines.length;
    }
  }
  function applyConsumption(lines,invoiceId){let cost=0;const usage=invoiceStockUsage(lines);for(const [productId,qty] of Object.entries(usage)){const p=db.products.find(x=>x.id===productId);if(!p)continue;if(qty>Number(p.qty)+0.000001)throw new Error('Not enough '+p.name+' in local stock. Refresh inventory before saving this invoice.');recordStockMovement(productId,-qty,'invoice',invoiceId,'stock_invoice_'+invoiceId+'_'+productId);cost+=qty*Number(p.cost||0)}return cost}

  function blobAsDataUrl(blob){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result));reader.onerror=()=>reject(reader.error||new Error('Could not prepare the PDF file.'));reader.readAsDataURL(blob)})}
  function downloadInvoiceBlob(blob,filename){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
  async function saveInvoicePdf(invId){const i=db.invoices.find(x=>x.id===invId);if(!i)return;try{notify('Preparing your invoice PDF…');const blob=await makePdfBlob(i);const dataUrl=await blobAsDataUrl(blob);const filename=invoicePdfName(i);if(window.WashDeskFileSharer?.save){await window.WashDeskFileSharer.save({filename,contentType:'application/pdf',base64Data:dataUrl,android:{saveDirectory:'downloads',relativePath:'Download/Prime Auto Care'}});notify('Invoice PDF saved in your phone’s Downloads / Prime Auto Care folder.')}else{downloadInvoiceBlob(blob,filename);notify('Invoice PDF download started.')}}catch(err){console.error('Save invoice PDF failed:',err);notify(err?.message||'Could not save the invoice PDF. Please retry.')}}

  function openInvoiceCustomerChat(invId){

  async function shareInvoice(invId){const i=db.invoices.find(x=>x.id===invId);if(!i)return;const customer=db.customers.find(c=>c.id===i.customerId);const customerName=invoiceCustomerName(i);const customerPhone=String(customer?.phone||'').trim();const recipientHint=customerPhone?`${customerName} (${customerPhone})`:customerName;const message=`Hello ${customerName}, thank you for visiting ${i.businessSnapshot?.name||db.business.name||'our car wash centre'}. Your invoice ${i.number} dated ${i.date} is ${INR(i.grandTotal)}. Paid: ${INR(paid(i))}. Balance: ${INR(invoiceDue(i))}. Vehicle: ${i.vehicleNumber||'—'}. Thank you!`;try{notify('Preparing your invoice for sharing…');const blob=await makePdfBlob(i);const dataUrl=await blobAsDataUrl(blob);const filename=invoicePdfName(i);if(window.WashDeskFileSharer?.share){await window.WashDeskFileSharer.share({filename,contentType:'application/pdf',base64Data:dataUrl,title:`Prime Auto Care invoice ${i.number} · ${recipientHint}`,text:message,android:{chooserTitle:`Invoice ${i.number} · select ${recipientHint}`}});notify(`Invoice ${i.number} and its PDF are ready. Choose WhatsApp Business, select ${recipientHint}, review and press Send.`);return}const file=new File([blob],filename,{type:'application/pdf'});if(navigator.share&&navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:`Invoice ${i.number}`,text:message});return}downloadInvoiceBlob(blob,filename);const phone=(customer?.phone||'').replace(/\D/g,'');if(phone){const international=phone.length===10?'91'+phone:phone;window.location.href=`https://wa.me/${international}?text=${encodeURIComponent(message)}`;notify('PDF downloaded. WhatsApp opened with the message; attach the downloaded PDF.')}else notify('PDF downloaded. Share it from your Downloads folder.')}catch(err){if(err?.name==='AbortError'||err?.message==='USER_CANCELLED')return;console.error('Share invoice failed:',err);notify(err?.message||'Could not open the invoice share menu. Use Save PDF and share it from Downloads.')}}

    // the cashier is entering a bill. Both operations can block Android's UI
    // thread and a DOM refresh would dismiss Gboard and erase the search text.
    if(shouldDeferRemoteUpdate()){
      pendingRemotePayload=remote;
      remoteRenderPending=true;
      return {__cloudSyncDeferred:true};
    }
    db=mergeWashDeskData(db,remote);
    localStorage.setItem(STORE,JSON.stringify(db));
    if(canRenderRemoteUpdate())render();else remoteRenderPending=true;
    return db;
  }
  async function connectCloud(e){
    e.preventDefault();
    if(!window.WashDeskCloud?.pairDevice){notify('Shared device pairing is not available in this app build. Update Prime Auto Care.');return}
    const f=new FormData(e.target);
    const submit=e.target.querySelector('button[type="submit"],button:not([type])');
    if(submit){submit.disabled=true;submit.textContent='Connecting…'}
    try{
      const result=await window.WashDeskCloud.pairDevice({
        url:String(f.get('url')||''),
        anonKey:String(f.get('anonKey')||''),
        pairingCode:String(f.get('pairingCode')||''),
        getLocal:()=>db,
        onRemote:receiveCloudData
      });
      notify(result.message||'This device is paired with the shared Prime Auto Care database.');
      render();
    }catch(err){
      console.error('Prime Auto Care device pairing failed:',err);
      notify(err?.message||'Could not pair this device. Check the SQL setup and pairing code.');
      if(submit){submit.disabled=false;submit.textContent='Connect / Pair this device'}
    }
  }
  async function refreshCloudSession(){
    try{
      await window.WashDeskCloud?.resume?.({getLocal:()=>db,onRemote:receiveCloudData});
      const status=window.WashDeskCloud?.getStatus?.()||'Not connected';
      notify(status);render();
    }catch(err){notify(err?.message||'Could not refresh the cloud connection.')}
  }
  async function syncCloudNow(){try{const ok=await window.WashDeskCloud?.syncNow?.(db);notify(ok?'Cloud sync completed.':'No pending cloud changes.')}catch(e){notify(e?.message||'Connect cloud sync first.')}}
  async function disconnectCloud(){try{await window.WashDeskCloud?.disconnect?.();notify('This device disconnected. Local business records were kept.');render()}catch(e){notify(e?.message||'Could not disconnect cloud sync.')}}
  function stockAdjustForm(){if(!db.products.length){notify('Add an item first.');return}openModal('Adjust stock',`<form id="adjust-form"><div class="field-grid"><div class="field full"><label>Inventory item</label><select name="productId">${db.products.map(p=>`<option value="${p.id}">${esc(p.name)} — current ${p.qty} ${esc(p.unit||'')}</option>`).join('')}</select></div><div class="field"><label>Adjustment</label><select name="kind"><option value="add">Add stock</option><option value="remove">Use / remove stock</option></select></div><div class="field"><label>Quantity</label><input name="qty" type="number" min="0" step=".001" required /></div><div class="field full"><label>Reason</label><input name="reason" placeholder="Spillage, damaged, usage, stock count…" /></div></div><p class="help">Use Add or Remove to record the difference. Exact stock counts should be corrected by adding or removing the difference shown in current stock.</p><div class="form-actions"><button type="button" class="btn" id="cancel-modal">Cancel</button><button class="btn primary">Save adjustment</button></div></form>`);document.getElementById('adjust-form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);const p=db.products.find(x=>x.id===f.get('productId'));const q=Number(f.get('qty'));if(!p||q<0)return;const dbBefore=snapshotDatabase(),before=Number(p.qty),movementId=id(),delta=f.get('kind')==='add'?q:-q;if(before+delta<-.000001){notify('This adjustment would make stock negative.');return}recordStockMovement(p.id,delta,'manual-adjustment',movementId,'stock_adjust_'+movementId+'_'+p.id);db.expenses.push({id:id(),date:today(),category:'Stock adjustment',amount:0,paidTo:'',mode:'Non-cash',note:`${p.name}: ${before} → ${p.qty}. ${f.get('reason')||''}`,createdAt:Date.now()});if(!save()){restoreDatabase(dbBefore);notify('Stock adjustment was not saved. Inventory was restored.');return}closeModal();render();notify('Stock adjusted.')})}
  function addVehicleForm(cid){
    openModal('Add vehicle',`<form id="vehicle-form"><div class="field-grid">
      <div class="field"><label>Registration number *</label><input name="number" required placeholder="GJ05AB1234" autocomplete="off" /></div>
      <div class="field"><label>Vehicle class</label><select name="type"><option>Private Car</option><option>Taxi</option><option>Commercial Vehicle</option><option>SUV</option><option>Two Wheeler</option><option>Other</option></select></div>
      <div class="field"><label>Make / model</label><input name="make" /></div>
    </div><div id="vehicle-duplicate-status" class="duplicate-hint">Vehicle registration numbers must be unique.</div><div class="form-actions"><button type="button" class="btn" id="cancel-modal">Cancel</button><button class="btn primary" type="submit">Save vehicle</button></div></form>`);
    const form=document.getElementById('vehicle-form');form.elements.number.addEventListener('input',updateVehicleDuplicateHint);
    form.addEventListener('submit',e=>{
      e.preventDefault();const f=new FormData(e.target),number=String(f.get('number')||'').trim().toUpperCase(),normalized=normalizeVehicleNumber(number),duplicate=findVehicleByNumber(number);
      if(!normalized){notify('Enter a valid vehicle registration number.');return}
      if(duplicate){const owner=db.customers.find(c=>c.id===duplicate.customerId);notify(`Vehicle number already added for ${owner?.name||'another customer'}. Open that customer record instead.`);updateVehicleDuplicateHint();return}
      db.vehicles.push({id:id(),customerId:cid,number,type:String(f.get('type')||''),make:String(f.get('make')||''),createdAt:Date.now(),updatedAt:Date.now()});
      if(!save())return;closeModal();showCustomer(cid);notify('Vehicle added successfully.');
    });
  }
  function addPaymentForm(invId){const i=db.invoices.find(x=>x.id===invId);if(!i||i.cancelled){notify('Payments cannot be added to a cancelled invoice.');return}const due=invoiceDue(i);openModal('Record payment',`<p class="muted" style="font-size:12px">Invoice ${esc(i.number)} · Balance due ${INR(due)}</p><form id="payment-form"><div class="field-grid"><div class="field"><label>Amount received (₹)</label><input name="amount" type="number" min=".01" max="${due}" step=".01" required /></div><div class="field"><label>Payment mode</label><select name="mode"><option>Cash</option><option>UPI</option><option>Card</option><option>Bank Transfer</option><option>Mixed</option></select></div><div class="field"><label>Date</label><input name="date" type="date" value="${today()}" required /></div></div><div class="form-actions"><button type="button" class="btn" id="cancel-modal">Cancel</button><button class="btn primary">Save payment</button></div></form>`);document.getElementById('payment-form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);const amount=Number(f.get('amount'));if(amount<=0||amount>due+.009){notify('Enter a payment within the outstanding balance.');return}db.payments.push({id:id(),invoiceId:invId,date:f.get('date'),amount,mode:f.get('mode'),createdAt:Date.now()});if(!save())return;closeModal();openInvoice(invId);notify('Payment recorded.')})}
  document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.action;if(b.dataset.selectBillCustomer){selectBillCustomer(b.dataset.selectBillCustomer);return}if(a==='new-bill'){billLines=[];setPage('billing')}else if(a==='add-customer'||a==='quick-customer')addCustomerForm();else if(a==='add-service')addServiceForm();else if(a==='add-product')addProductForm();else if(a==='add-expense')addExpenseForm();else if(a==='add-purchase')addPurchaseForm();else if(a==='add-staff')addStaffForm();else if(a==='manager-pin')manageStaffManagerPin();else if(a==='add-staff-advance')addStaffAdvanceForm();else if(a==='export')exportBackup();else if(a==='import')importBackup();else if(a==='export-csv')exportCsv();else if(a==='export-excel')exportSalesExcel();else if(a==='stock-adjust')stockAdjustForm();else if(a==='clear-bill'){billLines=[];setPage('billing')}else if(a==='save-bill')saveBill();else if(a==='add-vehicle')addVehicleForm(b.dataset.customerId);else if(a==='add-edit-line')addInvoiceEditLine();else if(a==='share-offer-whatsapp')shareOfferViaWhatsApp();else if(a==='copy-broadcast-message')copyBroadcastMessage();else if(a==='export-broadcast-contacts')exportBroadcastContacts();else if(a==='prepare-opening-announcement'){offerDraft=openingAnnouncementMessage();setPage('offers');notify('Opening announcement prepared in the offer message box.')}else if(a==='share-opening-sms')shareOpeningAnnouncement('sms');else if(a==='preview-opening-voice')previewOpeningAnnouncement();else if(a==='offer-select-all'){offerSelectedCustomerIds=db.customers.filter(c=>(c.waOptIn||c.smsOptIn||c.voiceOptIn)&&offerPhone(c.phone).length>=11).map(c=>c.id);render()}else if(a==='offer-clear-selection'){offerSelectedCustomerIds=[];render()}else if(a==='queue-whatsapp-cloud')queueMarketingCampaign('whatsapp');else if(a==='queue-sms-gateway')queueMarketingCampaign('sms');else if(a==='queue-voice-calls')queueMarketingCampaign('voice');else if(a==='refresh-message-status')refreshMessagingStatus();else if(a==='cloud-sync-now')syncCloudNow();else if(a==='cloud-check-status')refreshCloudSession();else if(a==='cloud-disconnect')disconnectCloud();if(b.dataset.nav)setPage(b.dataset.nav);if(b.dataset.invoice)openInvoice(b.dataset.invoice);if(b.dataset.openWhatsappInvoice)openInvoiceCustomerChat(b.dataset.openWhatsappInvoice);if(b.dataset.cancelInvoice)cancelInvoice(b.dataset.cancelInvoice);if(b.dataset.editInvoice)editInvoice(b.dataset.editInvoice);if(b.dataset.customer)showCustomer(b.dataset.customer);if(b.dataset.savePdf)saveInvoicePdf(b.dataset.savePdf);if(b.dataset.share)shareInvoice(b.dataset.share);if(b.dataset.print)printInvoice(b.dataset.print);if(b.dataset.payment)addPaymentForm(b.dataset.payment);if(b.dataset.editService)addServiceForm(db.services.find(x=>x.id===b.dataset.editService));if(b.dataset.deleteService){if(confirm('Delete this service? Existing invoices will remain unchanged.'))markRecordDeleted('services',b.dataset.deleteService)}if(b.dataset.editProduct)addProductForm(db.products.find(x=>x.id===b.dataset.editProduct));if(b.dataset.deleteExpense){if(confirm('Delete this expense entry?'))markRecordDeleted('expenses',b.dataset.deleteExpense)}if(b.dataset.deleteStaff)removeStaffMember(b.dataset.deleteStaff);if(b.dataset.editStaffShift)editStaffShift(b.dataset.editStaffShift);if(b.dataset.editStaff)addStaffForm(db.staff.find(x=>x.id===b.dataset.editStaff));if(b.dataset.paySalary)payStaffSalaryForm(b.dataset.paySalary);if(b.dataset.addStaffAdvance!==undefined)addStaffAdvanceForm(b.dataset.addStaffAdvance);if(b.dataset.waToggle)toggleWhatsAppConsent(b.dataset.waToggle);if(b.dataset.removeEditLine!==undefined)removeInvoiceEditLine(Number(b.dataset.removeEditLine));if(b.id==='modal-close'||b.id==='cancel-modal')closeModal();if(b.dataset.removeLine!==undefined){billLines.splice(Number(b.dataset.removeLine),1);render()}});
  document.getElementById('modal-close').addEventListener('click',closeModal);document.getElementById('modal-backdrop').addEventListener('click',e=>{if(e.target.id==='modal-backdrop')closeModal()});document.getElementById('hamb').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)setPage(b.dataset.page)});document.getElementById('today-label').textContent=new Date().toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'});document.getElementById('avatar').textContent=(db.business.name||'W').slice(0,1).toUpperCase();
  render();
  if(deviceReminder.enabled)void updateOpeningReminder(true).then(result=>{if(result?.permissionDenied)notify('Allow notifications to receive the daily 7:00 AM opening reminder.')}).catch(e=>console.warn('Prime Auto Care opening reminder restore:',e));
  window.WashDeskCloud?.resume?.({getLocal:()=>db,onRemote:receiveCloudData}).then(()=>{if(page==='settings')render()}).catch(e=>console.warn('Cloud sync resume:',e));
  if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
